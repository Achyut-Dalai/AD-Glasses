</div>
<div class="flex items-center gap-4 bg-slate-50 px-4 min-h-[72px] py-2 justify-between shrink-0">
<div class="flex flex-col justify-center">
<p class="text-[#0c141d] text-base font-medium leading-normal line-clamp-1">Status</p>
<p class="text-[#4573a1] text-sm font-normal leading-normal line-clamp-2">Off</p>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-[#e6edf4] p-0.5 has-[:checked]:justify-end has-[:checked]:bg-[#005ab4]">

<input class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<div class="flex gap-4 bg-slate-50 px-4 py-3 justify-between shrink-0">
<div class="flex flex-1 flex-col justify-center">
<p class="text-[#0c141d] text-base font-medium leading-normal">Compatibility</p>
<p class="text-[#4573a1] text-sm font-normal leading-normal">Accessibility required</p>
</div>
<div class="shrink-0">
<div class="text-[#0c141d] flex size-7 items-center justify-center" data-icon="Info" data-size="24px" data-weight="regular">

<div class="bg-surface-container-lowest rounded-xl border border-outline-variant overflow-hidden flex flex-col shadow-sm">

<div>

</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Capture Interval -->

<span class="material-symbols-outlined text-primary" data-icon="timer">timer</span>
<div>
<p class="font-headline-sm text-on-surface">Capture interval</p>

</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>

<span class="material-symbols-outlined text-primary" data-icon="block">block</span>
<div>
<p class="font-headline-sm text-on-surface">App privacy blacklist</p>

</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>

<span class="material-symbols-outlined text-primary" data-icon="visibility_off">visibility_off</span>
<div>
<p class="font-headline-sm text-on-surface">OCR / Name-redaction</p>
<p class="font-body-sm text-on-surface-variant">Blur sensitive text on device</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer shrink-0 ml-2">

<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-on-primary after:border-outline-variant after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>

<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="delete_sweep">delete_sweep</span>
<div>
<p class="font-headline-sm text-on-surface">Retention</p>

</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
