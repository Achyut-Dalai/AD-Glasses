<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Container -->
<header class="w-full top-0 sticky z-50 bg-surface-bright dark:bg-surface-dim flat no shadows border-b border-surface-container-low dark:border-surface-container">
<!-- Structural Shell -->
<div class="flex justify-between items-center px-6 h-16 w-full max-w-4xl mx-auto">
<!-- Leading Icon (Back) -->
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<!-- Headline / Brand -->
<div class="flex-1 flex justify-center items-center">
<h1 class="font-headline text-headline-sm font-semibold truncate text-on-surface">Photo Details</h1>
</div>
<!-- Trailing Actions (Share, Delete) -->
<div class="flex items-center gap-2">
<button aria-label="Share" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">share</span>
</button>
<button aria-label="Delete" class="w-10 h-10 flex items-center justify-center rounded-full text-error hover:bg-error-container transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-4xl mx-auto pb-24 md:pb-8 flex flex-col relative">
<!-- High-Fidelity Photo Preview -->
<section class="w-full relative aspect-[4/3] md:aspect-video bg-surface-container-low overflow-hidden shadow-sm z-0">
<img class="w-full h-full object-cover" data-alt="A high-fidelity, wide-angle photograph of a modern cityscape view taken from an elevated vantage point. The scene captures sleek skyscrapers gleaming under a clear morning sky, with a lush green park visible in the foreground. The lighting is crisp and natural, emphasizing architectural details and vibrant urban life. The overall aesthetic is professional, clean, and technologically advanced, fitting a modern corporate light-mode UI design style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXi2L7C37jSUxSOhlvfNj3iYLNFpeG88WiXRRk_soIkoOupYBfEgcaoD0kBjKSGGAflmKjLbvVpeA7WDdU_LVwJyuGQC63LwBs75AWlRq4dM_qLqSMbGeXWvu7avW4P8Kqz2ftVuumv60tOXtdfeHFNmpWi2FAiGX1Kilt5prIBWQ033Uy6vPb5v4k80kQuiq9RZwlkNNDpZIUrtwu13A8QC3EJWSs-p3gIOHqKfMN2n_FDVXJa0OB"/>
</section>
<!-- Content Area -->
<div class="flex-1 px-4 md:px-8 py-6 flex flex-col gap-8 -mt-6 relative z-10 bg-surface rounded-t-3xl shadow-[0_-4px_24px_rgba(0,0,0,0.04)] md:rounded-none md:mt-0 md:shadow-none md:bg-transparent">
<!-- Primary Action (Floating over image on mobile, top of content on desktop) -->
<button class="w-full flex items-center justify-center gap-2 bg-on-surface text-surface py-4 px-6 rounded-xl font-label text-sm font-semibold hover:bg-inverse-surface active:scale-[0.98] transition-all shadow-md md:w-auto md:self-start">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
                Ask Assistant about this photo
            </button>
<!-- Linked Records Chip -->
<div class="flex items-center gap-2">
<span class="text-xs font-label text-on-surface-variant uppercase tracking-wider font-semibold">Linked</span>
<div class="inline-flex items-center gap-2 bg-secondary-container bg-opacity-30 text-on-surface-variant px-3 py-1.5 rounded-full text-xs font-medium border border-outline-variant/30 hover:bg-secondary-container/50 cursor-pointer transition-colors">
<span class="material-symbols-outlined text-[16px]">summarize</span>
                    Morning Sync Summary
                </div>
</div>
<!-- Grid Layout for Metadata & Actions -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-12">
<!-- Left Column: Details & Provenance -->
<div class="md:col-span-7 flex flex-col gap-8">
<!-- Metadata Section -->
<section class="flex flex-col gap-4 border-b border-surface-container-high pb-6">
<div class="flex items-center gap-3 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lens_blur</span>
<span class="font-label text-sm font-medium">Captured via AD Glasses</span>
</div>
<div class="flex flex-wrap gap-x-8 gap-y-4">
<div class="flex flex-col gap-1">
<span class="text-xs font-label text-on-surface-variant">Date</span>
<span class="text-base font-body text-on-surface">Oct 24, 2023</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-xs font-label text-on-surface-variant">Time</span>
<span class="text-base font-body text-on-surface">08:15 AM</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-xs font-label text-on-surface-variant">Location</span>
<span class="text-base font-body text-on-surface">Central Park, NY</span>
</div>
</div>
</section>
<!-- Provenance / Map Section -->
<section class="flex flex-col gap-3">
<h3 class="font-headline text-sm font-semibold text-on-surface">Provenance</h3>
<div class="flex gap-4 items-start bg-surface-container-lowest p-4 rounded-xl border border-surface-container-high">
<div class="w-20 h-20 bg-surface-container-low rounded-lg overflow-hidden shrink-0">
<img class="w-full h-full object-cover" data-alt="A clean, minimalist map interface showing Central Park in New York City. The map style uses soft grey and subtle blue tones, fitting a modern corporate dashboard aesthetic. A precise, sharp blue pin indicates a specific location within the park. The map details are simplified, prioritizing clarity and a professional, uncluttered look over dense geographic information." data-location="Central Park, New York" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAK564-gVy3h6X2IYW3WsxHR1-_OPdajsE5ba4cdzq7Cs80XGHKahlCObAAQKFXOHZm1y3EurinkjincN-GpjQF5iZFE9fvk8zeA2UJeZBbdaOKfRC7uJKpOt46QQsdf-ngpMNPemGV_-rNdsIUAXSm8utkfDVF8LdIulbwDHvuVzFEAck69O5whDrlyov9lLSyPiZs7z4SSBSDfEP1JM74tfjkJ1_LYKbcg-HFcrIgW4YRqah1t7K4"/>
</div>
<div class="flex flex-col justify-center h-full gap-1">
<div class="flex items-center gap-1.5 text-on-surface-variant text-sm">
<span class="material-symbols-outlined text-[18px]">location_on</span>
<span>40.7812° N, 73.9665° W</span>
</div>
<div class="flex items-center gap-1.5 text-on-surface-variant text-sm mt-1">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span>Device Authenticated</span>
</div>
</div>
</div>
</section>
</div>
<!-- Right Column: Secondary Actions -->
<div class="md:col-span-5 flex flex-col gap-3">
<h3 class="font-headline text-sm font-semibold text-on-surface mb-1">Quick Actions</h3>
<button class="w-full flex items-center justify-between p-4 rounded-xl border border-surface-container-high bg-surface-container-lowest hover:bg-surface-container-low transition-colors group text-left">
<div class="flex items-center gap-3 text-on-surface">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">collections_bookmark</span>
<span class="font-body text-sm font-medium">Add to collection</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl border border-surface-container-high bg-surface-container-lowest hover:bg-surface-container-low transition-colors group text-left">
<div class="flex items-center gap-3 text-on-surface">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">text_fields</span>
<span class="font-body text-sm font-medium">Extract text</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 rounded-xl border border-surface-container-high bg-surface-container-lowest hover:bg-surface-container-low transition-colors group text-left">
<div class="flex items-center gap-3 text-on-surface">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">center_focus_strong</span>
<span class="font-body text-sm font-medium">Identify objects</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</button>
</div>
</div>
</div>
</main>
