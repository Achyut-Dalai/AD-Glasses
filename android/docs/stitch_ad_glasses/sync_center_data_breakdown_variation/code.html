<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sync Center - Data First</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "tertiary-container": "#191c1e",
                        "background": "#f9f9ff",
                        "on-primary-fixed": "#1b1b1b",
                        "inverse-on-surface": "#ecf0ff",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#c5c7c8",
                        "on-surface-variant": "#4c4546",
                        "surface-control": "#FFFFFF",
                        "surface-tint": "#5e5e5e",

                        "primary-fixed": "#e2e2e2",
                        "warning-amber": "#FFBF00",
                        "primary-fixed-dim": "#c6c6c6",
                        "secondary-fixed-dim": "#aac7ff",
                        "secondary-fixed": "#d6e3ff",

                        "success-teal": "#008080",

                        "secondary-container": "#4090fe",

                        "on-tertiary-container": "#828486",
                        "surface-variant": "#dde2f2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gap-sm": "8px",
                        "hero-stage": "220px",
                        "base": "4px",
                        "margin-page": "16px",
                        "touch-target": "48px",
                        "gap-xs": "4px"
                    },
                    "fontFamily": {
                        "label-lg": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],

                        "label-sm": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }],

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-canvas text-on-surface antialiased min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-canvas p-4 pb-2 justify-between shrink-0">
<button aria-label="Go back" class="text-on-surface flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<h2 class="text-on-surface text-headline-md flex-1 text-center pr-12">Sync Center</h2>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col pb-24">
<!-- Floating Glasses Logo Mark -->
<div class="flex justify-center pt-8 pb-4">
<svg class="text-graphite-black opacity-80" fill="none" height="24" viewbox="0 0 48 24" width="48" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM4 12C4 7.58172 7.58172 4 12 4C16.4183 4 20 7.58172 20 12C20 16.4183 16.4183 20 12 20C7.58172 20 4 16.4183 4 12Z" fill="currentColor"></path>
<path d="M36 2C30.4772 2 26 6.47715 26 12C26 17.5228 30.4772 22 36 22C41.5228 22 46 17.5228 46 12C46 6.47715 41.5228 2 36 2ZM28 12C28 7.58172 31.5817 4 36 4C40.4183 4 44 7.58172 44 12C44 16.4183 40.4183 20 36 20C31.5817 20 28 16.4183 28 12Z" fill="currentColor"></path>
<rect fill="currentColor" height="2" width="8" x="20" y="10"></rect>
</svg>
</div>
<h1 class="text-on-surface text-headline-lg text-center px-4 pb-6 pt-2">Ready to sync 18 items</h1>
<!-- Data Breakdown Tiles -->
<div class="grid grid-cols-[repeat(auto-fit,minmax(150px,1fr))] gap-4 px-4 pb-8">
<div class="flex flex-col gap-3 rounded-xl border border-outline-variant bg-surface p-4 items-start shadow-sm hover:shadow-md transition-shadow">
<div class="text-secondary bg-secondary-container bg-opacity-20 p-2 rounded-lg">
<span class="material-symbols-outlined" style="font-size: 24px;">image</span>
</div>
<div>
<h2 class="text-on-surface text-body-lg font-semibold leading-tight">Photos</h2>
<p class="text-on-surface-variant text-label-md">12 items</p>
</div>
</div>
<div class="flex flex-col gap-3 rounded-xl border border-outline-variant bg-surface p-4 items-start shadow-sm hover:shadow-md transition-shadow">
<div class="text-electric-blue bg-blue-100 p-2 rounded-lg">
<span class="material-symbols-outlined" style="font-size: 24px;">videocam</span>
</div>
<div>
<h2 class="text-on-surface text-body-lg font-semibold leading-tight">Videos</h2>
<p class="text-on-surface-variant text-label-md">4 items</p>
</div>
</div>
<div class="flex flex-col gap-3 rounded-xl border border-outline-variant bg-surface p-4 items-start shadow-sm hover:shadow-md transition-shadow">
<div class="text-success-teal bg-teal-50 p-2 rounded-lg">
<span class="material-symbols-outlined" style="font-size: 24px;">music_note</span>
</div>
<div>
<h2 class="text-on-surface text-body-lg font-semibold leading-tight">Audio</h2>
<p class="text-on-surface-variant text-label-md">2 items</p>
</div>
</div>
</div>
<!-- System Readiness Checklist -->
<div class="px-4 mt-2">
<h3 class="text-on-surface text-label-lg font-semibold tracking-wide uppercase text-on-surface-variant mb-4">System Readiness</h3>
<div class="flex flex-col gap-0 border border-outline-variant rounded-xl bg-surface overflow-hidden shadow-sm">
<label class="flex items-center gap-x-4 py-4 px-4 border-b border-outline-variant hover:bg-surface-container-low transition-colors cursor-pointer">
<input checked="" class="h-5 w-5 rounded border-outline-variant border-2 bg-transparent text-graphite-black checked:bg-graphite-black checked:border-graphite-black focus:ring-0 focus:ring-offset-0 focus:outline-none transition-all" type="checkbox"/>
<div class="flex-1">
<p class="text-on-surface text-body-md font-medium leading-normal">BLE Handshake</p>
<p class="text-on-surface-variant text-label-sm">Established connection</p>
</div>
<span class="material-symbols-outlined text-success-teal" style="font-size: 20px;">check_circle</span>
</label>
<label class="flex items-center gap-x-4 py-4 px-4 border-b border-outline-variant hover:bg-surface-container-low transition-colors cursor-pointer">
<input checked="" class="h-5 w-5 rounded border-outline-variant border-2 bg-transparent text-graphite-black checked:bg-graphite-black checked:border-graphite-black focus:ring-0 focus:ring-offset-0 focus:outline-none transition-all" type="checkbox"/>
<div class="flex-1">
<p class="text-on-surface text-body-md font-medium leading-normal">Local Wi-Fi Active</p>
<p class="text-on-surface-variant text-label-sm">High-speed transfer ready</p>
</div>
<span class="material-symbols-outlined text-success-teal" style="font-size: 20px;">check_circle</span>
</label>
<label class="flex items-center gap-x-4 py-4 px-4 hover:bg-surface-container-low transition-colors cursor-pointer">
<input checked="" class="h-5 w-5 rounded border-outline-variant border-2 bg-transparent text-graphite-black checked:bg-graphite-black checked:border-graphite-black focus:ring-0 focus:ring-offset-0 focus:outline-none transition-all" type="checkbox"/>
<div class="flex-1">
<p class="text-on-surface text-body-md font-medium leading-normal">Storage Verified</p>
<p class="text-on-surface-variant text-label-sm">Sufficient space available</p>
</div>
<span class="material-symbols-outlined text-success-teal" style="font-size: 20px;">check_circle</span>
</label>
</div>
</div>
</main>
<!-- Sticky Bottom Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-canvas/80 backdrop-blur-md border-t border-outline-variant">
<button class="w-full bg-graphite-black text-on-primary h-touch-target rounded-full font-semibold text-body-lg flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant transition-colors shadow-lg">
<span class="material-symbols-outlined" style="font-size: 20px;">sync</span>
            Start Sync
        </button>
</div>
</body></html>
