<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Syncing - AD Glasses</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {

                extend: {
                    "colors": {

                        "surface": "#f9f9ff",
                        "on-error": "#ffffff",
                        "inverse-primary": "#aac7ff",
                        "surface-variant": "#e0e2eb",
                        "surface-tint": "#095db7",
                        "on-background": "#181c22",
                        "error": "#ba1a1a",
                        "surface-container": "#ebedf7",
                        "outline": "#727783",
                        "on-tertiary-container": "#ffc9ac",
                        "tertiary-fixed-dim": "#ffb68c",
                        "primary": "#004389",
                        "on-surface-variant": "#414753",
                        "background": "#f9f9ff",
                        "on-primary-fixed": "#001b3e",
                        "on-primary-fixed-variant": "#00458d",
                        "on-tertiary-fixed-variant": "#753400",

                        "tertiary-container": "#964400",
                        "on-secondary-fixed": "#001b3d",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2d3037",
                        "surface-dim": "#d7dae3",
                        "tertiary": "#723200",
                        "secondary": "#465f88",
                        "primary-container": "#0a73e0",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f9f9ff",
                        "secondary-fixed": "#d6e3ff",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "full": "9999px"
                    },
                    "spacing": {
                        "grid-gutter": "1rem",
                        "element-gap": "0.75rem",
                        "container-padding": "1rem",
                        "section-gap": "1.5rem"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-sm": ["Inter"],
                        "body-md": ["Inter"],

                    },
                    "fontSize": {

            }
        }

<style>
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes flow {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }
        .progress-flow {
            background-size: 200% auto;
            animation: flow 3s linear infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Canvas area - focusing on the syncing state -->
<main class="flex-1 flex flex-col items-center justify-center p-4 max-w-xl mx-auto w-full min-h-screen">
<!-- Hero Graphic & Header -->
<div class="flex flex-col items-center mb-8 w-full">
<div class="relative w-32 h-32 mb-6 flex items-center justify-center">
<!-- Decorative concentric circles -->
<div class="absolute inset-0 rounded-full border border-primary/20 animate-[spin_10s_linear_infinite]"></div>
<div class="absolute inset-2 rounded-full border border-primary/40 border-dashed animate-[spin_15s_linear_infinite_reverse]"></div>
<!-- Central pulsing icon -->
<div class="relative z-10 w-16 h-16 bg-surface-container-highest rounded-full flex items-center justify-center shadow-sm">
<div class="absolute inset-0 rounded-full bg-primary/20 animate-pulse-ring"></div>
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">cloud_sync</span>
</div>
</div>
<h1 class="font-display-sm text-display-sm text-on-surface mb-2 tracking-wide uppercase">Syncing...</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-xs">Transferring data from your glasses to your device.</p>
</div>
<!-- Main Sync Card (Bento Style) -->
<div class="w-full bg-surface-container rounded-xl p-6 shadow-sm border border-outline-variant/30 relative overflow-hidden mb-8">
<!-- Decorative background gradient -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
<div class="relative z-10 space-y-6">
<!-- Overall Progress Section -->
<div>
<div class="flex justify-between items-end mb-3">
<div>
<span class="font-headline-sm text-headline-sm text-on-surface block">Overall Progress</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">6 of 18 items</span>
</div>
<span class="font-headline-sm text-headline-sm text-primary">35%</span>
</div>
<!-- Determinate Progress Bar -->
<div class="h-2 w-full bg-surface-dim rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full bg-gradient-to-r from-primary to-primary-fixed progress-flow rounded-full" style="width: 35%;"></div>
</div>
<!-- Status Text -->
<div class="mt-2 flex items-center space-x-2">
<span class="material-symbols-outlined text-primary text-[14px]">sync</span>
<p class="font-label-md text-label-md text-on-surface-variant truncate">Transferring VID_20240520_1422.mp4</p>
</div>
</div>
<hr class="border-outline-variant/20"/>
<!-- Transfer Stats Row -->
<div class="grid grid-cols-3 gap-4">
<!-- Photos Stat -->
<div class="flex flex-col items-center p-3 bg-surface rounded-lg border border-outline-variant/20">
<span class="material-symbols-outlined text-secondary mb-1" style="font-variation-settings: 'FILL' 0;">photo_library</span>
<span class="font-label-lg text-label-lg text-on-surface">Photos</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">4/12</span>
</div>
<!-- Videos Stat -->
<div class="flex flex-col items-center p-3 bg-surface rounded-lg border border-primary/30 bg-primary/5">
<div class="relative mb-1">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">videocam</span>
<span class="absolute -top-1 -right-1 w-2 h-2 bg-primary rounded-full animate-ping"></span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Videos</span>
<span class="font-label-sm text-label-sm text-on-surface-variant text-primary">1/4</span>
</div>
<!-- Audio Stat -->
<div class="flex flex-col items-center p-3 bg-surface rounded-lg border border-outline-variant/20 opacity-60">
<span class="material-symbols-outlined text-secondary mb-1" style="font-variation-settings: 'FILL' 0;">mic</span>
<span class="font-label-lg text-label-lg text-on-surface">Audio</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">0/2</span>
</div>
</div>
</div>
</div>
<!-- Note & Action -->
<div class="w-full flex flex-col items-center space-y-6">
<div class="flex items-start space-x-2 px-4 py-3 bg-surface-container-low rounded-lg max-w-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[18px] shrink-0 mt-0.5">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Already saved files are safe in your Library if interrupted.</p>
</div>
<button class="px-6 py-2 border-2 border-outline-variant text-on-surface font-headline-sm text-headline-sm rounded-full hover:bg-surface-container-highest transition-colors active:scale-95 flex items-center justify-center space-x-2 w-full max-w-[200px]" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
<span>Cancel</span>
</button>
</div>
</main>
</body></html>
