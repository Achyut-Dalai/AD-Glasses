<style>
        body { font-family: 'Hanken Grotesk', sans-serif; background-color: #F6F7F9; }
        
        .halo-pulse {
            animation: pulse-halo 3s ease-in-out infinite alternate;
        }
        
        @keyframes pulse-halo {
            0% { transform: scale(0.95); opacity: 0.3; }
            100% { transform: scale(1.05); opacity: 0.6; }
        }

        .float-glasses {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-canvas text-on-background min-h-screen flex flex-col pt-safe pb-safe pb-32">
<!-- Top Navigation -->
<header class="flex items-center justify-between px-4 py-2 w-full max-w-5xl mx-auto bg-canvas h-14 z-50 sticky top-0">
<button class="h-touch-target w-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest/50 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface text-center flex-1 pr-touch-target">Sync Center</h1>
</header>
<main class="flex-1 flex flex-col w-full max-w-md mx-auto relative px-margin-page">
<!-- Connectivity Stage -->
<div class="relative w-full h-hero-stage flex items-center justify-center mt-4 mb-8">
<!-- Halo Background -->
<div class="absolute w-48 h-48 bg-electric-blue/10 rounded-full blur-2xl halo-pulse"></div>
<!-- Hardware Render -->
<img alt="HeyCyan Pro Glasses" class="relative z-10 w-full max-w-[280px] object-contain float-glasses" data-alt="A highly detailed, photorealistic 3D render of modern, sleek smart glasses floating in mid-air against a pure, seamless light gray background. The lighting is studio-quality, casting subtle, realistic reflections on the smooth, satin graphite frames and the slightly tinted lenses. A soft, diffuse drop shadow anchors the floating object, creating a sense of depth and precision in a clean, minimalist environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCSNj0YZ7LhEAuabBKfga2G8gFnAYwwigp7LWc9PVDs6KatxNkuaJnEdX721e7Y5c4ODxQkyNCr8YdKgr0LoWr0EUXl6yETLSdC-rOCgAIIj0Lsp95ruqtPGc2bH8Ed9G8o_L0nPAkijRNQDp1DBrtSIuaaQ2xIT5SR7J13Ms3EDssSn0lcHYMBNq7QUA9omk9B6d2JI2CJ17nhIMW3zdFvrI6pVXtHdXN4dvP5-5ctJ8oqbtzAsvnb"/>
</div>
<!-- Transfer Status -->
<div class="text-center mb-6">
<h2 class="font-headline-lg text-headline-lg text-primary mb-1">Ready to Transfer</h2>
<p class="font-body-md text-body-md text-cool-gray">12 new captures available</p>
</div>
<!-- Source & Destination Cards -->
<div class="space-y-3 mb-6 relative">
<!-- Connection Line connecting the two cards -->
<div class="absolute left-6 top-10 bottom-10 w-px bg-outline-variant/50 z-0 border-l border-dashed border-electric-blue/30"></div>
<!-- Source Card -->
<div class="bg-surface-control rounded-xl p-4 shadow-sm relative z-10 flex items-start gap-4">
<div class="h-10 w-10 rounded-full bg-surface-container flex items-center justify-center shrink-0 border border-outline-variant/30">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">smart_toy</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-1">
<h3 class="font-label-lg text-label-lg text-on-surface">HeyCyan Pro</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">battery_5_bar</span>
                            82%
                        </span>
</div>
<p class="font-body-md text-body-md text-primary font-medium">1.2 GB to move</p>
</div>
</div>
<!-- Destination Card -->
<div class="bg-surface-control rounded-xl p-4 shadow-sm relative z-10 flex items-start gap-4">
<div class="h-10 w-10 rounded-full bg-surface-container flex items-center justify-center shrink-0 border border-outline-variant/30">
<span class="material-symbols-outlined text-electric-blue" style="font-variation-settings: 'FILL' 0;">smartphone</span>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-1">
<h3 class="font-label-lg text-label-lg text-on-surface">Local Storage</h3>
</div>
<p class="font-body-md text-body-md text-cool-gray">45 GB available</p>
</div>
</div>
</div>
<!-- Security Note -->
<div class="flex items-center justify-center gap-2 mb-8 opacity-80">
<span class="material-symbols-outlined text-success-teal text-[16px]">lock</span>
<span class="font-label-sm text-label-sm text-cool-gray">Encrypted transfer over Wi-Fi Direct</span>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 w-full bg-canvas/80 backdrop-blur-md z-50 pb-safe pt-4 px-margin-page border-t border-outline-variant/10 shadow-[0_-4px_24px_rgba(0,0,0,0.02)]">
<div class="max-w-md mx-auto pb-4">
<button class="w-full h-touch-target bg-graphite-black text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">sync</span>
                Start Sync
            </button>
</div>
</div>
