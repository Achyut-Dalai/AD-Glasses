<style>
        .pulse-error {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-container-padding antialiased">
<div class="w-full max-w-md flex flex-col gap-section-gap">
<header class="w-full flex items-center justify-center pb-4 border-b border-outline-variant/20">
<h1 class="font-display-sm text-on-surface uppercase tracking-widest text-center">Connection Interrupted</h1>
</header>
<main class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-8 flex flex-col items-center text-center relative overflow-hidden">
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at center, var(--tw-colors-error-container) 0%, transparent 70%);"></div>
<div class="relative w-24 h-24 flex items-center justify-center mb-6">
<div class="absolute inset-0 bg-error/10 rounded-full pulse-error"></div>
<div class="relative bg-surface-container rounded-full w-16 h-16 flex items-center justify-center border border-error/20">
<span class="material-symbols-outlined text-4xl text-error" style="font-variation-settings: 'FILL' 1;">wifi_off</span>
</div>
</div>
<h2 class="font-display-sm text-on-surface mb-2">Local Wi-Fi unavailable</h2>
<p class="font-body-md text-on-surface-variant mb-8 max-w-[280px]">
                The glasses and phone lost their direct connection. Ensure your glasses are nearby and powered on.
            </p>
<div class="w-full bg-surface-container-low border border-outline-variant/20 rounded-lg p-4 flex items-start gap-3 mb-8">
<span class="material-symbols-outlined text-secondary mt-0.5" style="font-variation-settings: 'FILL' 1;">cloud_done</span>
<div class="text-left flex-1">
<p class="font-label-md text-on-surface mb-0.5">Status Check</p>
<p class="font-body-sm text-on-surface-variant">3 files were saved before the interruption.</p>
</div>
</div>
<div class="w-full flex flex-col gap-3">
<button class="w-full h-12 bg-on-surface hover:bg-on-surface/90 text-surface font-label-lg uppercase rounded-full transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                    Try again
                </button>
<button class="w-full h-12 bg-transparent border border-outline hover:bg-surface-container-low text-on-surface font-label-lg uppercase rounded-full transition-colors flex items-center justify-center">
                    Continue later
                </button>
</div>
</main>
</div>
