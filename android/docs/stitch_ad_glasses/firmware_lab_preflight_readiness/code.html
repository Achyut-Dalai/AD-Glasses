<div class="fixed bottom-0 left-0 right-0 p-container-padding bg-surface-container-lowest border-t border-surface-variant z-50">
<button class="w-full bg-primary text-on-primary font-headline-sm py-4 rounded-full flex items-center justify-center gap-2 transition-all duration-300 opacity-50 cursor-not-allowed" disabled="" id="initiateUpdateBtn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">system_update_alt</span>
            Initiate Update Sequence
        </button>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const submitBtn = document.getElementById('initiateUpdateBtn');

            function evaluatePreflightStatus() {
                let allSystemsGo = true;
                checkboxes.forEach(checkbox => {
                    if (!checkbox.checked) {
                        allSystemsGo = false;
                    }
                });

                if (allSystemsGo) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    submitBtn.classList.add('shadow-md', 'hover:bg-primary-container', 'hover:text-on-primary-container');
                } else {
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    submitBtn.classList.remove('shadow-md', 'hover:bg-primary-container', 'hover:text-on-primary-container');
                }
            }

            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', evaluatePreflightStatus);
            });
        });
    </script>
