<style>
        .radar-ping {
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes ping {
            75%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-canvas text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-electric-blue selection:text-white">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-margin-page h-touch-target z-50">
<button aria-label="Close" class="h-touch-target w-touch-target flex items-center justify-start hover:opacity-80 scale-98 transition-transform duration-200">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">Pair Glasses</h1>
<div class="h-touch-target w-touch-target flex items-center justify-end">
<span class="material-symbols-outlined text-primary text-2xl hover:opacity-80 scale-98 transition-transform duration-200 cursor-pointer" data-icon="help_outline">help_outline</span>
</div>
</header>
<main class="flex-1 flex flex-col max-w-md mx-auto w-full pt-8 pb-32">
<!-- Hero Stage / Radar -->
<div class="w-full h-hero-stage flex flex-col items-center justify-center relative mb-8">
<!-- Pulsing halos -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-32 h-32 rounded-full bg-electric-blue/10 radar-ping absolute"></div>
<div class="w-48 h-48 rounded-full bg-electric-blue/5 radar-ping absolute" style="animation-delay: 0.5s;"></div>
</div>
<!-- Logo -->
<div class="relative z-10 w-24 h-24 bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/30 flex items-center justify-center overflow-hidden">
<img alt="Optic Bridge Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLvf9P6GqbyZ-mEkmoK8rz1k4WZ_EVB3-QXNxJuPNPBXhE-AMcGFIXlzvBQWNlt3ht9vPSoOFxSjqiRT8kFzphsTfDkWvcbiDljU1yXVJeoxk4TUnAs9kZEatcm-OfBZ0TNpNBzRaov9gcSoBbsvDbZ_YrX-lSgtxdTWEHkV-9HezubKmLzI_tbME-U8jAy8KRpVzCORgiZhMWnXEEtDgcGJX8_oVjbr3pJ3HFdSS7WBtkk3Npy4i4nqUQ"/>
</div>
<p class="mt-8 font-body-lg text-body-lg text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-electric-blue animate-spin" data-icon="sync">sync</span>
                Looking for nearby glasses...
            </p>
</div>
<!-- Detected Devices List -->
<div class="px-margin-page flex flex-col gap-gap-sm w-full">
<h2 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider mb-2 px-2">Detected Devices</h2>
<!-- Device 1: Strong Signal -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-4 flex items-center justify-between hover:bg-surface-container-low transition-colors duration-200 fade-in-up shadow-sm" style="animation-delay: 0.1s;">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-electric-blue/10 flex items-center justify-center text-electric-blue">
<span class="material-symbols-outlined text-2xl" data-icon="glasses">qr_code_2</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-primary">AD One Pro</span>
<div class="flex items-center gap-2 mt-1">
<span class="font-label-sm text-label-sm px-2 py-1 bg-success-teal/10 text-success-teal rounded-full font-medium">HeyCyan-compatible</span>
</div>
</div>
</div>
<div class="flex flex-col items-end gap-1">
<span class="material-symbols-outlined text-success-teal text-xl" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Strong</span>
</div>
</button>
<!-- Device 2: Unknown -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-4 flex items-center justify-between hover:bg-surface-container-low transition-colors duration-200 fade-in-up shadow-sm opacity-70" style="animation-delay: 0.2s;">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-2xl" data-icon="device_unknown">device_unknown</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-primary">Unknown device</span>
<div class="flex items-center gap-2 mt-1">
<span class="font-label-sm text-label-sm text-on-surface-variant">Bluetooth LE</span>
</div>
</div>
</div>
<div class="flex flex-col items-end gap-1">
<span class="material-symbols-outlined text-warning-amber text-xl" data-icon="signal_cellular_2_bar">signal_cellular_2_bar</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Weak</span>
</div>
</button>
</div>
<!-- Troubleshooting / Empty State Help -->
<div class="mt-auto px-margin-page pt-12 fade-in-up" style="animation-delay: 0.5s;">
<div class="flex flex-col items-center text-center p-6 bg-surface-container-lowest rounded-2xl border border-outline-variant/30">
<span class="material-symbols-outlined text-cool-gray text-3xl mb-3" data-icon="find_in_page">find_in_page</span>
<h3 class="font-headline-md text-headline-md text-primary mb-2">Can't find your glasses?</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-6 max-w-[250px]">Ensure your glasses are charged and in pairing mode (indicated by a pulsing blue light).</p>
<button class="w-full bg-graphite-black text-white rounded-lg h-touch-target font-label-lg text-label-lg font-medium hover:opacity-90 active:scale-98 transition-all duration-200 flex items-center justify-center">
                    Show Troubleshooting Guide
                </button>
</div>
</div>
</main>
