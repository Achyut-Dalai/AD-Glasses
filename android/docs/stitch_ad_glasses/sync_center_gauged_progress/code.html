<script>
        // Simple script to animate the progress circle slightly to simulate activity
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.getElementById('progressCircle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = `${circumference}`;

            function setProgress(percent) {
                const offset = circumference - percent / 100 * circumference;
                circle.style.strokeDashoffset = offset;
            }

            // Initial setting
            setTimeout(() => setProgress(68), 100);
            
            // Simulate very slow progress
            let currentProgress = 68;
            setInterval(() => {
                if(currentProgress < 100) {
                    currentProgress += 0.5;
                    setProgress(currentProgress);
                    document.getElementById('progressText').innerText = Math.floor(currentProgress) + '%';
                }
            }, 3000);
        });
    </script>
