<style>
  /* Custom checkbox styles to map to theme colors since we can't use arbitrary arbitrary values easily in the generic component */
  .checkbox-custom {
    @apply h-5 w-5 rounded border-outline-variant border-2 bg-transparent text-primary checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0 focus:border-outline-variant focus:outline-none transition-colors duration-200;
    background-image: var(--checkbox-tick-svg, none);
  }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen">
<!-- Excluded main nav because this is a focused setup/process flow -->
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden max-w-md mx-auto bg-surface" style="--checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27%23ffffff%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');">
<!-- Minimal Header for Focused View -->
<header class="flex items-center px-4 py-3 bg-surface border-b border-surface-variant sticky top-0 z-10">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-variant text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-inset">
<span aria-hidden="true" class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-headline-sm font-semibold ml-2 text-on-surface flex-1 truncate">External AI Automation Setup</h1>
</header>
<main class="flex-1 pb-24">
<!-- Context Banner -->
<div class="bg-error-container p-4 m-4 rounded-lg flex items-start gap-3 shadow-sm border border-error/20">
<span aria-hidden="true" class="material-symbols-outlined text-error mt-0.5" style="font-variation-settings: 'FILL' 1;">warning</span>
<div>
<h2 class="text-label-lg text-on-error-container mb-1">Device Requirements</h2>
<p class="text-body-sm text-on-error-container/90">Your phone <strong>must be unlocked</strong> for external AI automation tasks (like Assistant or Tasker) to execute properly. These tasks cannot bypass secure lock screens.</p>
</div>
</div>
<!-- Section Header -->
<div class="px-container-padding pt-section-gap pb-2">
<h3 class="text-headline-sm text-on-surface">Integration Checklist</h3>
<p class="text-body-md text-on-surface-variant mt-1">Complete all steps to ensure full functionality.</p>
</div>
<!-- Checklist Form -->
<form class="px-container-padding flex flex-col gap-element-gap mt-4" id="setupForm">
<!-- Item 1 -->
<label class="flex items-start gap-3 p-4 bg-surface-container-low rounded-xl border border-outline-variant/30 cursor-pointer hover:bg-surface-container-high transition-colors focus-within:ring-2 focus-within:ring-primary focus-within:ring-inset">
<input aria-describedby="desc-1" checked="" class="checkbox-custom mt-0.5" type="checkbox"/>
<div class="flex-1">
<p class="text-body-md font-medium text-on-surface leading-tight">Import Tasker Profile</p>
<p class="text-body-sm text-on-surface-variant mt-1" id="desc-1">Load the XML configuration into Tasker.</p>
<div class="mt-2 flex items-center gap-1.5 text-primary text-label-md">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            Ready
          </div>
</div>
</label>
<!-- Item 2 -->
<label class="flex items-start gap-3 p-4 bg-surface-container-low rounded-xl border border-outline-variant/30 cursor-pointer hover:bg-surface-container-high transition-colors focus-within:ring-2 focus-within:ring-primary focus-within:ring-inset">
<input aria-describedby="desc-2" checked="" class="checkbox-custom mt-0.5" type="checkbox"/>
<div class="flex-1">
<p class="text-body-md font-medium text-on-surface leading-tight">Verify Automation Tasks</p>
<p class="text-body-sm text-on-surface-variant mt-1" id="desc-2">Ensure entry and exit tasks are mapped correctly.</p>
<div class="mt-2 flex items-center gap-1.5 text-primary text-label-md">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            Ready
          </div>
</div>
</label>
<!-- Item 3 -->
<label class="flex items-start gap-3 p-4 bg-surface-container-low rounded-xl border border-outline-variant/30 cursor-pointer hover:bg-surface-container-high transition-colors focus-within:ring-2 focus-within:ring-primary focus-within:ring-inset">
<input aria-describedby="desc-3" class="checkbox-custom mt-0.5" type="checkbox"/>
<div class="flex-1">
<div class="flex justify-between items-center">
<p class="text-body-md font-medium text-on-surface leading-tight">Android Accessibility</p>
<button class="text-label-md text-primary bg-primary-container/20 px-2 py-1 rounded hover:bg-primary-container/30 transition-colors" type="button">Open</button>
</div>
<p class="text-body-sm text-on-surface-variant mt-1" id="desc-3">Grant accessibility permissions for screen reading.</p>
<div class="mt-2 flex items-center gap-1.5 text-on-surface-variant text-label-md">
<span class="material-symbols-outlined text-[14px]">pending</span>
            Pending action
          </div>
</div>
</label>
<!-- Item 4 -->
<label class="flex items-start gap-3 p-4 bg-surface-container-low rounded-xl border border-outline-variant/30 cursor-pointer hover:bg-surface-container-high transition-colors focus-within:ring-2 focus-within:ring-primary focus-within:ring-inset">
<input aria-describedby="desc-4" class="checkbox-custom mt-0.5" type="checkbox"/>
<div class="flex-1">
<div class="flex justify-between items-center">
<p class="text-body-md font-medium text-on-surface leading-tight">Test Voice Trigger</p>
<button class="text-label-md text-primary bg-primary-container/20 px-2 py-1 rounded hover:bg-primary-container/30 transition-colors flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[14px]">mic</span> Run
            </button>
</div>
<p class="text-body-sm text-on-surface-variant mt-1" id="desc-4">Say the trigger phrase to wake the assistant.</p>
<div class="mt-2 flex items-center gap-1.5 text-on-surface-variant text-label-md">
<span class="material-symbols-outlined text-[14px]">pending</span>
            Pending test
          </div>
</div>
</label>
<!-- Item 5 -->
<label class="flex items-start gap-3 p-4 bg-surface-container-low rounded-xl border border-outline-variant/30 cursor-pointer hover:bg-surface-container-high transition-colors focus-within:ring-2 focus-within:ring-primary focus-within:ring-inset">
<input aria-describedby="desc-5" class="checkbox-custom mt-0.5" type="checkbox"/>
<div class="flex-1">
<p class="text-body-md font-medium text-on-surface leading-tight">Test Image Context</p>
<p class="text-body-sm text-on-surface-variant mt-1" id="desc-5">Ensure the AI can analyze screen content.</p>
<div class="mt-2 flex items-center gap-1.5 text-on-surface-variant text-label-md">
<span class="material-symbols-outlined text-[14px]">pending</span>
            Pending test
          </div>
</div>
</label>
</form>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 w-full max-w-md mx-auto bg-surface border-t border-surface-variant p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
<button class="w-full h-12 flex items-center justify-center rounded-full bg-primary text-on-primary text-label-lg transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 disabled:cursor-not-allowed" form="setupForm" type="submit">
      Complete Setup
    </button>
</div>
</div>
<script>
  // Simple interaction to update status text when checkboxes change
  document.addEventListener('DOMContentLoaded', () => {
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    
    checkboxes.forEach(cb => {
      cb.addEventListener('change', (e) => {
        const statusContainer = e.target.nextElementSibling.querySelector('.mt-2');
        if (!statusContainer) return;

        if (e.target.checked) {
          statusContainer.className = 'mt-2 flex items-center gap-1.5 text-primary text-label-md';
          statusContainer.innerHTML = `
            <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            Ready
          `;
        } else {
          statusContainer.className = 'mt-2 flex items-center gap-1.5 text-on-surface-variant text-label-md';
          statusContainer.innerHTML = `
            <span class="material-symbols-outlined text-[14px]">pending</span>
            Pending action
          `;
        }
      });
    });
  });
</script>
</body></html>
