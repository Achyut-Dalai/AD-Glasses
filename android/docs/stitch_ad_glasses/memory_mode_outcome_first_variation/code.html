<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memory Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "background": "#F6F7F9",
                "surface": "#ffffff",
                "on-surface": "#181c22",
                "on-surface-variant": "#424752",
                "primary": "#005ab4",
                "primary-container": "#e0f0ff",
                "on-primary-container": "#001b3d",
                "outline": "#c2c6d4",
                "error": "#ba1a1a",
                "error-container": "#ffdad6",
                "on-error-container": "#93000a"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "2xl": "1rem",
                      "full": "9999px"
              },
              "spacing": {
                      "section-gap": "1.5rem",
                      "element-gap": "0.75rem",
                      "container-padding": "1.5rem",
                      "grid-gutter": "1rem"
              },
              "fontFamily": {
                      "label-sm": ["Inter"],
                      "display-sm": ["Inter"],
                      "body-sm": ["Inter"],
                      "label-md": ["Inter"],
                      "label-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-sm": ["Inter"]
              },
              "fontSize": {
                      "label-sm": ["10px", {"lineHeight": "12px", "fontWeight": "500"}],
                      "display-sm": ["1.125rem", {"lineHeight": "1.5rem", "letterSpacing": "0.15em", "fontWeight": "700"}],
                      "body-sm": ["0.75rem", {"lineHeight": "1rem", "fontWeight": "400"}],
                      "label-md": ["11px", {"lineHeight": "1rem", "fontWeight": "500"}],
                      "label-lg": ["0.75rem", {"lineHeight": "1rem", "fontWeight": "600"}],
                      "body-md": ["0.875rem", {"lineHeight": "1.25rem", "fontWeight": "400"}],
                      "headline-sm": ["1rem", {"lineHeight": "1.5rem", "fontWeight": "600"}],
                      "headline-md": ["1.125rem", {"lineHeight": "1.75rem", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="bg-background w-full sticky top-0 z-50">
<div class="flex flex-col">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-5xl mx-auto">
<button class="text-on-surface-variant hover:bg-black/5 transition-colors rounded-full p-2 active:scale-95 duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Memory Mode</h1>
<button class="text-on-surface-variant hover:bg-black/5 transition-colors rounded-full p-2 active:scale-95 duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-2xl px-container-padding py-6 flex-1 flex flex-col space-y-4">
<!-- Private Local (Selected) -->
<button class="w-full text-left bg-surface border-2 border-primary rounded-2xl p-5 shadow-sm hover:shadow-md transition-all active:scale-[0.98] duration-200 relative group">
<div class="flex items-start justify-between">
<div class="flex-1 pr-4">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Maximum Privacy</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-3">Never leaves your phone. Content and retrieval stay entirely on your device.</p>
<div class="flex items-center gap-2">
<span class="text-xs font-semibold text-primary uppercase tracking-wider">Private Local</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-primary-container text-primary font-label-md text-label-md">
<span class="w-1.5 h-1.5 rounded-full bg-primary mr-1"></span> Active
                    </span>
</div>
</div>
<div class="text-primary flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</button>
<!-- Encrypted Sync -->
<button class="w-full text-left bg-surface border border-outline/30 rounded-2xl p-5 shadow-sm hover:shadow-md transition-all active:scale-[0.98] duration-200 group">
<div class="flex items-start justify-between">
<div class="flex-1 pr-4">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Cross-Device Access</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-3">End-to-end encrypted backup to your own configured backend.</p>
<div class="flex items-center gap-2">
<span class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Encrypted Sync</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-error-container text-on-error-container font-label-md text-label-md">
<span class="w-1.5 h-1.5 rounded-full bg-error mr-1"></span> Backend Needed
                    </span>
</div>
</div>
</div>
</button>
<!-- Fast Cloud Memory -->
<button class="w-full text-left bg-surface border border-outline/30 rounded-2xl p-5 shadow-sm hover:shadow-md transition-all active:scale-[0.98] duration-200 group">
<div class="flex items-start justify-between">
<div class="flex-1 pr-4">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">High-Speed Retrieval</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-3">Fastest responses leveraging your personal cloud infrastructure.</p>
<div class="flex items-center gap-2">
<span class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Fast Cloud</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-black/5 text-on-surface-variant font-label-md text-label-md">
<span class="w-1.5 h-1.5 rounded-full bg-on-surface-variant mr-1"></span> Requires Setup
                    </span>
</div>
</div>
</div>
</button>
<!-- Confidential Cloud Beta -->
<button class="w-full text-left bg-surface/60 border border-outline/20 rounded-2xl p-5 opacity-60 cursor-not-allowed">
<div class="flex items-start justify-between">
<div class="flex-1 pr-4">
<div class="flex items-center gap-2 mb-1">
<h2 class="font-headline-md text-headline-md text-on-surface">Verifiable Security</h2>
<span class="bg-black/10 text-on-surface text-[10px] uppercase font-bold px-1.5 py-0.5 rounded">Beta</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-3">Hardware-secured confidential computing in the cloud.</p>
<div class="flex items-center gap-2">
<span class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Confidential Cloud</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-black/5 text-on-surface-variant font-label-md text-label-md">
                        Unavailable
                    </span>
</div>
</div>
</div>
</button>
</main>
</body></html>
