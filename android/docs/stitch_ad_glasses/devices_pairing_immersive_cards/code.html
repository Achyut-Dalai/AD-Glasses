<!DOCTYPE html>

<body class="bg-background-alt text-on-surface antialiased min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="bg-surface-glass dark:bg-surface-glass backdrop-blur-md shadow-sm fixed top-0 w-full z-50 flex justify-between items-center px-container-margin h-16 w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary dark:text-primary-fixed hover:bg-surface-container-high/50 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="settings_glasses">animated_images</span>
</button>
<div class="flex items-center gap-2">
<img alt="Logo" class="h-6 w-auto mix-blend-multiply" src="https://lh3.googleusercontent.com/aida/AP1WRLvf9P6GqbyZ-mEkmoK8rz1k4WZ_EVB3-QXNxJuPNPBXhE-AMcGFIXlzvBQWNlt3ht9vPSoOFxSjqiRT8kFzphsTfDkWvcbiDljU1yXVJeoxk4TUnAs9kZEatcm-OfBZ0TNpNBzRaov9gcSoBbsvDbZ_YrX-lSgtxdTWEHkV-9HezubKmLzI_tbME-U8jAy8KRpVzCORgiZhMWnXEEtDgcGJX8_oVjbr3pJ3HFdSS7WBtkk3Npy4i4nqUQ"/>
<h1 class="font-display-lg text-display-lg font-extrabold text-on-surface dark:text-inverse-on-surface">AD Glasses</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high/50 transition-colors active:scale-95 duration-150 overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A detailed headshot of a professional user in a well-lit studio environment, featuring neutral gray tones and subtle electric blue accents in the background to match the high-end tech ecosystem aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlFi0ojoTC-Mx5mq_K9Pq-joeoPDCZWdXia-R3GCVMO8KCtKyLQkbr_v_Ui-nLoZClHIiAi53hczpVOjtMIsLxOWicadTbJWddMkiXCPVcaoXVGfW4AxyXvbk11pVsDKqr9gOhs_Cj-_N6pv9_wcs2pgDk8kol3pVzhdNOWyBS2AUQxd_G-Od4G6sBQTclU_W4cspYQooLV6oFyodSX9Ust8zyF2XfONqKCRfmCVFZfcv0yZJb2-K5"/>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 mt-16 px-container-margin py-section-gap flex flex-col gap-6 max-w-3xl mx-auto w-full">
<!-- Active Device Card -->
<section class="bg-surface-container-lowest shadow-sm rounded-xl p-6 flex flex-col gap-4 relative overflow-hidden border border-surface-variant/50">
<div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(circle at 50% 20%, rgba(10, 115, 224, 0.08) 0%, transparent 70%);"></div>
<div class="flex justify-between items-start z-10">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Cyan X1</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Active Connection</p>
</div>
<div class="flex items-center gap-2 bg-surface-container-low px-3 py-1.5 rounded-full border border-surface-variant">
<div class="w-2 h-2 rounded-full bg-status-connected animate-pulse"></div>
<span class="font-label-sm text-label-sm text-on-surface">Connected</span>
</div>
</div>
<div class="w-full h-48 relative rounded-lg bg-background-alt overflow-hidden flex items-center justify-center border border-surface-variant/50">
<img alt="Cyan X1 Glasses" class="w-full h-full object-contain p-4 mix-blend-multiply" src="https://lh3.googleusercontent.com/aida/AP1WRLtC7A76AZx5Vvs01DR1AONRS4MFiiy6OcZRsny96grxRQF2ZS2eBKzw2HbriSV2OGm_TieMs34N_si8weTX7HyVkBHC91drTonf4aVULwb39a9rXYQUWtqYBkJ_huvmNUDGqWVrns5a5RTlxAnpNC-2iuO9CijSKBVBtsM8qLrhUAhMEOsBCoRJrnUv20ylnqN4mhwNtKdLmz3EGErlaVRmXiBEnCPrCXGJZSy_VFYdvkOc-OaIua4WLw"/>
</div>
<div class="flex justify-between items-center z-10 pt-2 border-t border-surface-variant">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">Battery</span>
<span class="font-body-md text-body-md font-medium text-on-surface">84%</span>
</div>
<button class="h-10 px-4 bg-inverse-surface text-on-primary rounded-full font-label-sm text-label-sm hover:bg-inverse-surface/90 active:scale-95 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="settings">settings</span>
                    Device Settings
                </button>
</div>
</section>
<!-- Scanning / Pairing Section -->
<div class="flex flex-col gap-4">
<h3 class="font-headline-md text-headline-md text-on-surface px-1">Nearby Devices</h3>
<!-- Found Device: Highlighted Result -->
<button class="w-full text-left bg-surface-container-lowest shadow-sm rounded-xl p-5 flex flex-col gap-4 border-2 border-status-connected/20 hover:border-status-connected/50 transition-colors group relative overflow-hidden">
<div class="absolute right-0 top-0 w-32 h-32 bg-status-connected/5 rounded-bl-full pointer-events-none"></div>
<div class="flex justify-between items-start z-10">
<div>
<div class="flex items-center gap-2 mb-1">
<h4 class="font-headline-md text-headline-md text-on-surface">HeyCyan X1</h4>
<span class="bg-secondary-container text-on-secondary-container font-label-xs text-label-xs px-2 py-0.5 rounded-full">New</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">Generation 2 • Ready to pair</p>
</div>
<div class="w-10 h-10 rounded-full bg-status-connected text-on-primary flex items-center justify-center group-hover:scale-105 transition-transform shadow-md shadow-status-connected/20">
<span class="material-symbols-outlined" data-icon="add_link">add_link</span>
</div>
</div>
<div class="flex gap-3 z-10">
<div class="flex items-center gap-1.5 bg-surface-container-low px-2.5 py-1.5 rounded-lg border border-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="mic" style="font-variation-settings: 'FILL' 0;">mic</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Voice</span>
</div>
<div class="flex items-center gap-1.5 bg-surface-container-low px-2.5 py-1.5 rounded-lg border border-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="videocam" style="font-variation-settings: 'FILL' 0;">videocam</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Camera</span>
</div>
<div class="flex items-center gap-1.5 bg-surface-container-low px-2.5 py-1.5 rounded-lg border border-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="sensors" style="font-variation-settings: 'FILL' 0;">sensors</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Motion</span>
</div>
</div>
</button>
<!-- Other Device Result -->
<button class="w-full text-left bg-surface-container-lowest shadow-sm rounded-xl p-4 flex justify-between items-center border border-surface-variant/50 hover:border-surface-variant transition-colors group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-outline border border-surface-variant">
<span class="material-symbols-outlined" data-icon="headset">headset</span>
</div>
<div>
<h4 class="font-body-md text-body-md font-medium text-on-surface">Graphite Audio Pro</h4>
<p class="font-body-sm text-body-sm text-on-surface-variant">Audio Device</p>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Start Scan Action -->
<div class="mt-4 flex justify-center">
<button class="flex items-center gap-2 text-primary font-body-sm text-body-sm font-semibold hover:bg-primary/5 px-4 py-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px] animate-spin" data-icon="radar" style="animation-duration: 3s;">radar</span>
                Scanning for devices...
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-glass dark:bg-surface-glass shadow-lg fixed bottom-0 w-full z-50 pb-safe md:hidden flex justify-around items-center h-20 px-2 w-full">
<!-- Status (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-container text-on-secondary-container dark:text-secondary-container rounded-xl px-4 py-1 flex-1 max-w-[80px]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="legend_toggle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">legend_toggle</span>
<span class="font-label-xs text-label-xs">Status</span>
</a>
<!-- Gallery -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low transition-all rounded-xl px-4 py-1 flex-1 max-w-[80px] active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="collections">collections</span>
<span class="font-label-xs text-label-xs">Gallery</span>
</a>
<!-- Capture -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low transition-all rounded-xl px-4 py-1 flex-1 max-w-[80px] active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="photo_camera">photo_camera</span>
<span class="font-label-xs text-label-xs">Capture</span>
</a>
<!-- Support -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low transition-all rounded-xl px-4 py-1 flex-1 max-w-[80px] active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="build_circle">build_circle</span>
<span class="font-label-xs text-label-xs">Support</span>
</a>
</nav>
<!-- Desktop Navigation (Hidden on mobile) -->
<div class="hidden md:flex fixed top-0 right-0 h-16 items-center gap-6 px-8 z-[60]">
<a class="font-body-sm text-body-sm text-primary font-semibold border-b-2 border-primary py-1" href="#">Status</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Gallery</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Capture</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Support</a>
</div>
</body></html>
