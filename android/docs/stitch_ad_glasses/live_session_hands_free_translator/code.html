<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hands-Free Translator - Active Session</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "on-tertiary-fixed-variant": "#753400",

                        "stage-halo-start": "rgba(10, 115, 224, 0.15)",
                        "surface-container": "#ebeef6",
                        "on-secondary-container": "#3f5881",
                        "on-surface": "#181c22",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#465f88",
                        "surface-bright": "#f8f9ff",

                        "surface-dim": "#d7dae2",

                    "borderRadius": {

                    "spacing": {
                        "element-gap": "0.75rem",
                        "container-margin": "1rem",
                        "touch-target-min": "40px",
                        "section-gap": "2rem"

                    "fontFamily": {
                        "body-md": ["Inter"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface font-body-md h-screen overflow-hidden flex flex-col antialiased">
<!-- Shared Component Structure with Theme Adjustments -->
<div class="relative flex flex-1 w-full flex-col bg-background group/design-root overflow-x-hidden overflow-y-auto pb-32">
<div class="flex items-center bg-background p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-on-surface flex size-12 shrink-0 items-center" data-icon="X" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-[24px]">swipe_left</span>
</div>
<h2 class="text-on-surface text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Translating</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-transparent text-on-surface gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
<div class="text-on-surface" data-icon="DotsThree" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-[24px]">encrypted_off</span>
</div>
</button>
</div>
</div>
<p class="text-on-surface text-base font-normal leading-normal pb-3 pt-1 px-4 text-center">English (US) → Spanish</p>
<div class="flex flex-col px-4 py-6">
<div class="flex flex-col items-center gap-6">
<!-- Replaced image placeholder with accessible CSS indicator maintaining original structure constraints -->
<div class="relative aspect-video rounded-lg w-full max-w-[360px] flex items-center justify-center overflow-hidden bg-surface-container-low border border-surface-variant">
<div class="absolute size-20 bg-primary/20 rounded-full animate-ping"></div>
<div class="absolute size-14 bg-primary/40 rounded-full animate-pulse"></div>
<div class="relative size-10 bg-primary rounded-full flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<p class="text-on-surface text-lg font-bold leading-tight tracking-[-0.015em] max-w-[480px] text-center">Listening...</p>
</div>
</div>
<div class="flex items-center gap-4 bg-background px-4 min-h-[72px] py-2">
<div class="text-on-surface flex items-center justify-center rounded-lg bg-secondary-container shrink-0 size-12" data-icon="User" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-[24px]">shuffle</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-on-surface text-base font-medium leading-normal line-clamp-1">Hello, how are you?</p>
<p class="text-secondary text-sm font-normal leading-normal line-clamp-2">Speaker 1 (EN) - 10:01 AM</p>
</div>
</div>
<div class="flex items-center gap-4 bg-background px-4 min-h-[72px] py-2">
<div class="text-on-surface flex items-center justify-center rounded-lg bg-secondary-container shrink-0 size-12" data-icon="Translate" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-[24px]">markdown_copy</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-on-surface text-base font-medium leading-normal line-clamp-1">Hola, ¿cómo estás?</p>
<p class="text-secondary text-sm font-normal leading-normal line-clamp-2">Speaker 1 (ES) - 10:01 AM</p>
</div>
</div>
<div class="h-5 bg-background"></div>
</div>
<!-- Fixed Footer Controls -->
<div class="absolute bottom-0 left-0 right-0 bg-surface/95 backdrop-blur-md border-t border-surface-variant p-6 pb-8 flex flex-col items-center gap-6 z-20">
<div class="flex items-center gap-2 text-on-surface-variant text-label-sm font-medium bg-surface-container-high px-3 py-1.5 rounded-full">
<span class="material-symbols-outlined text-[16px]">eyeglasses</span>
<span>Glasses display active</span>
</div>
<div class="flex items-center justify-center gap-8 w-full max-w-[360px]">
<button class="size-14 rounded-full border-2 border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-variant hover:border-outline transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined text-[24px]">mic_off</span>
</button>
<button class="size-20 rounded-full bg-error text-on-error flex items-center justify-center shadow-lg hover:bg-on-error-container transition-all hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-error-container">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">stop</span>
</button>
<button class="size-14 rounded-full border-2 border-outline-variant flex items-center justify-center text-on-surface hover:bg-surface-variant hover:border-outline transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined text-[24px]">bookmark</span>
</button>
</div>
</div>
<!-- Component Variant Note: For Captions variant, change title to "Captioning", remove language pair subtitle, and simplify speaker labels to just "Speaker N". -->
</body></html>
