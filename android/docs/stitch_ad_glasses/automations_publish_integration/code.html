<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AD Glasses - Publish Integration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",

                extend: {
                    "colors": {
                        "inverse-surface": "#2d3037",
                        "on-secondary-container": "#3f5881",

                        "surface-container": "#ebedf7",
                        "on-tertiary-fixed": "#321200",
                        "surface-container-highest": "#e0e2eb",
                        "surface-tint": "#095db7",
                        "on-primary-fixed-variant": "#00458d",
                        "surface-container-low": "#f1f3fc",
                        "tertiary-container": "#964400",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d7dae3",
                        "primary-fixed-dim": "#aac7ff",
                        "on-surface": "#181c22",
                        "on-tertiary-container": "#ffc9ac",
                        "surface-variant": "#e0e2eb",
                        "surface-container-high": "#e6e8f1",
                        "secondary": "#465f88",
                        "outline": "#727783",
                        "secondary-container": "#b6d0ff",
                        "secondary-fixed": "#d6e3ff",
                        "surface-bright": "#f9f9ff",
                        "error": "#ba1a1a",
                        "surface": "#f9f9ff",
                        "tertiary-fixed-dim": "#ffb68c",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#414753",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c2c6d4",
                        "tertiary": "#723200",
                        "on-secondary": "#ffffff",
                        "primary": "#004389",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#753400",
                        "on-background": "#181c22",
                        "tertiary-fixed": "#ffdbc9",
                        "on-secondary-fixed-variant": "#2e476f",
                        "on-primary-container": "#c0d5ff",
                        "on-primary-fixed": "#001b3e",
                        "on-secondary-fixed": "#001b3d",
                        "inverse-on-surface": "#eef0fa",
                        "inverse-primary": "#aac7ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "1.5rem",
                        "container-padding": "1rem",
                        "element-gap": "0.75rem",
                        "grid-gutter": "1rem"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-sm": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["0.875rem", {"lineHeight": "1.25rem", "fontWeight": "400"}],
                        "body-sm": ["0.75rem", {"lineHeight": "1rem", "fontWeight": "400"}],
                        "display-sm": ["1.125rem", {"lineHeight": "1.5rem", "letterSpacing": "0.15em", "fontWeight": "700"}],
                        "label-lg": ["0.75rem", {"lineHeight": "1rem", "fontWeight": "600"}],
                        "label-md": ["11px", {"lineHeight": "1rem", "fontWeight": "500"}],
                        "headline-sm": ["0.875rem", {"lineHeight": "1.25rem", "fontWeight": "600"}],
                        "label-sm": ["10px", {"lineHeight": "12px", "fontWeight": "500"}]
                    }
                }
            }
        }

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen font-body-md">
<!-- TopAppBar -->
<header class="bg-surface w-full top-0 sticky border-b border-outline-variant/20 flex justify-between items-center px-container-padding h-14 max-w-5xl mx-auto z-40">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center overflow-hidden border border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
<h1 class="font-display-sm text-display-sm text-on-surface tracking-tight">Glasses Pro</h1>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors scale-95 duration-150 text-on-surface-variant">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="max-w-3xl mx-auto px-container-padding py-section-gap pb-32">
<!-- Form Header -->
<div class="mb-section-gap flex items-center gap-3">
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div>
<h2 class="font-display-sm text-display-sm text-on-surface">Publish Integration</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Submit your integration to the community service.</p>
</div>
</div>
<!-- Form Container (Bento Style) -->
<form class="space-y-6">
<!-- Basic Details Card -->
<div class="bg-surface-container rounded-xl p-container-padding border border-outline-variant/20 shadow-sm space-y-4">
<h3 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant/20 pb-2">Basic Details</h3>
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface" for="integration-name">Name</label>
<input class="w-full bg-surface-container-highest border-outline-variant/30 rounded-lg text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary font-body-md p-2.5 transition-colors" id="integration-name" placeholder="e.g., Smart Home Controller" type="text"/>
</div>
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface" for="integration-outcome">One-line outcome</label>
<input class="w-full bg-surface-container-highest border-outline-variant/30 rounded-lg text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary font-body-md p-2.5 transition-colors" id="integration-outcome" placeholder="e.g., Control lights and temperature via voice." type="text"/>
</div>
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface" for="integration-description">Description</label>
<textarea class="w-full bg-surface-container-highest border-outline-variant/30 rounded-lg text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary font-body-md p-2.5 transition-colors resize-none" id="integration-description" placeholder="Provide a detailed description of what your integration does..." rows="3"></textarea>
</div>
</div>
<!-- Technical Details Card -->
<div class="bg-surface-container rounded-xl p-container-padding border border-outline-variant/20 shadow-sm space-y-4">
<h3 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant/20 pb-2">Technical Details</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface" for="integration-source">Source URL/Package</label>
<input class="w-full bg-surface-container-highest border-outline-variant/30 rounded-lg text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary font-body-md p-2.5 transition-colors" id="integration-source" placeholder="https://github.com/..." type="url"/>
</div>
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface" for="integration-version">Version</label>
<input class="w-full bg-surface-container-highest border-outline-variant/30 rounded-lg text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary font-body-md p-2.5 transition-colors" id="integration-version" placeholder="1.0.0" type="text"/>
</div>
</div>
</div>
<!-- Configuration Card -->
<div class="bg-surface-container rounded-xl p-container-padding border border-outline-variant/20 shadow-sm space-y-6">
<h3 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant/20 pb-2">Configuration</h3>
<!-- Compatible Devices -->
<div class="space-y-3">
<label class="font-label-lg text-label-lg text-on-surface block">Compatible devices</label>
<div class="grid grid-cols-2 gap-3">
<label class="flex items-center gap-2 p-2 rounded-lg hover:bg-surface-container-low cursor-pointer transition-colors border border-outline-variant/10">
<input class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-highest" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface">Model X1</span>
</label>
<label class="flex items-center gap-2 p-2 rounded-lg hover:bg-surface-container-low cursor-pointer transition-colors border border-outline-variant/10">
<input class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-highest" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface">Model Pro</span>
</label>
<label class="flex items-center gap-2 p-2 rounded-lg hover:bg-surface-container-low cursor-pointer transition-colors border border-outline-variant/10">
<input class="rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-highest" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface">Model Lite</span>
</label>
</div>
</div>
<!-- Permissions Required -->
<div class="space-y-3">
<label class="font-label-lg text-label-lg text-on-surface block">Permissions required</label>
<div class="flex flex-wrap gap-2">
<label class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-highest border border-outline-variant/20 cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-secondary-container has-[:checked]:border-secondary-container">
<input class="sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">photo_camera</span>
<span class="font-label-md text-label-md text-on-surface">Camera</span>
</label>
<label class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-highest border border-outline-variant/20 cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-secondary-container has-[:checked]:border-secondary-container">
<input class="sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">mic</span>
<span class="font-label-md text-label-md text-on-surface">Mic</span>
</label>
<label class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-highest border border-outline-variant/20 cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-secondary-container has-[:checked]:border-secondary-container">
<input class="sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">location_on</span>
<span class="font-label-md text-label-md text-on-surface">Location</span>
</label>
<label class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-highest border border-outline-variant/20 cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:bg-secondary-container has-[:checked]:border-secondary-container">
<input class="sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">bluetooth</span>
<span class="font-label-md text-label-md text-on-surface">Bluetooth</span>
</label>
</div>
</div>
<!-- Processing Boundary -->
<div class="space-y-3">
<label class="font-label-lg text-label-lg text-on-surface block">Processing Boundary</label>
<div class="grid grid-cols-2 gap-3">
<label class="relative flex flex-col items-start p-3 rounded-lg border border-outline-variant/20 bg-surface-container-highest cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/20">
<div class="flex items-center justify-between w-full mb-1">
<span class="font-label-lg text-label-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">memory</span>
                                    On device
                                </span>
<input class="text-primary focus:ring-primary bg-surface border-outline-variant" name="processing-boundary" type="radio" value="device"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant pl-6">Data processed locally.</span>
</label>
<label class="relative flex flex-col items-start p-3 rounded-lg border border-outline-variant/20 bg-surface-container-highest cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/20">
<div class="flex items-center justify-between w-full mb-1">
<span class="font-label-lg text-label-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">cloud</span>
                                    Your cloud
                                </span>
<input class="text-primary focus:ring-primary bg-surface border-outline-variant" name="processing-boundary" type="radio" value="cloud"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant pl-6">Requires external API.</span>
</label>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row-reverse gap-3 pt-4">
<button class="w-full sm:w-auto px-6 py-2.5 rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg hover:bg-primary hover:text-on-primary transition-colors flex justify-center items-center gap-2 shadow-sm" type="submit">
<span class="material-symbols-outlined text-[18px]">cloud_upload</span>
                    Submit to Community Service
                </button>
<button class="w-full sm:w-auto px-6 py-2.5 rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg hover:bg-surface-container-highest transition-colors flex justify-center items-center" type="button">
                    Cancel
                </button>
</div>
</form>
</main>
<!-- BottomNavBar is suppressed because this is a transactional form/task-focused screen with a "Cancel/Back" action implied. -->
</body></html>
