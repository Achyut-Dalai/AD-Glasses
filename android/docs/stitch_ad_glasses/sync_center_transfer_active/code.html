<body class="bg-canvas text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-electric-blue selection:text-white">
<!-- TopAppBar (Transactional - Hidden Nav Shell for focused task) -->
<header class="bg-surface-container-lowest text-primary font-headline-md text-headline-md w-full top-0 sticky bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center px-margin-page h-touch-target z-40">
<button aria-label="Close" class="w-touch-target h-touch-target flex items-center justify-center -ml-2 text-primary hover:opacity-80 scale-98 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="font-headline-md text-headline-md tracking-tight">Sync Center</div>
<div class="w-touch-target h-touch-target"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-page max-w-md mx-auto w-full pb-32">
<!-- Status Pill -->
<div class="inline-flex items-center gap-2 bg-surface-container-high px-3 py-1.5 rounded-full mb-8 border border-outline-variant/30">
<span class="w-2 h-2 rounded-full bg-electric-blue animate-pulse"></span>
<span class="font-label-md text-label-md text-on-surface-variant">Local Wi-Fi connection stable</span>
</div>
<!-- Central Animation / Visual -->
<div class="relative w-hero-stage h-hero-stage flex items-center justify-center mb-12">
<!-- Halos -->
<div class="absolute inset-0 bg-electric-blue/5 rounded-full blur-2xl"></div>
<div class="absolute inset-8 border border-electric-blue/20 rounded-full pulse-ring"></div>
<div class="absolute inset-16 border border-electric-blue/40 rounded-full"></div>
<!-- Icon Core -->
<div class="relative z-10 w-24 h-24 bg-surface-container-lowest rounded-full shadow-sm flex items-center justify-center border border-outline-variant/50">
<span class="material-symbols-outlined text-4xl text-electric-blue animate-spin" data-icon="sync" style="animation-duration: 3s;">sync</span>
</div>
</div>
<!-- Progress Section -->
<div class="w-full bg-surface-container-lowest rounded-xl p-6 shadow-sm border border-outline-variant/30 mb-8">
<div class="flex justify-between items-end mb-4">
<div>
<h2 class="font-headline-md text-headline-md text-primary mb-1">Transferring media</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Syncing 12 photos and 2 videos</p>
</div>
<span class="font-headline-md text-headline-md text-electric-blue">45%</span>
</div>
<!-- Progress Bar -->
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden mb-6">
<div class="h-full bg-electric-blue progress-bar-fill w-[45%] rounded-full relative">
<div class="absolute inset-0 bg-white/20 animate-pulse"></div>
</div>
</div>
<!-- Stepper Timeline -->
<div class="relative">
<div class="absolute left-3 top-2 bottom-2 w-px bg-outline-variant/50"></div>
<div class="flex flex-col gap-4">
<!-- Step 1: Done -->
<div class="flex items-start gap-4 relative z-10">
<div class="w-6 h-6 rounded-full bg-success-teal flex items-center justify-center shrink-0 border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-[14px] text-white" data-icon="check" data-weight="fill">check</span>
</div>
<div class="pt-0.5">
<p class="font-label-lg text-label-lg text-on-background">Prepare glasses</p>
</div>
</div>
<!-- Step 2: Done -->
<div class="flex items-start gap-4 relative z-10">
<div class="w-6 h-6 rounded-full bg-success-teal flex items-center justify-center shrink-0 border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-[14px] text-white" data-icon="check" data-weight="fill">check</span>
</div>
<div class="pt-0.5">
<p class="font-label-lg text-label-lg text-on-background">Establish Wi-Fi</p>
</div>
</div>
<!-- Step 3: Active -->
<div class="flex items-start gap-4 relative z-10">
<div class="w-6 h-6 rounded-full bg-surface-container-lowest border-2 border-electric-blue flex items-center justify-center shrink-0">
<div class="w-2 h-2 rounded-full bg-electric-blue"></div>
</div>
<div class="pt-0.5">
<p class="font-label-lg text-label-lg text-primary font-medium">Transferring media</p>
</div>
</div>
</div>
</div>
</div>
</main>

<div class="fixed bottom-0 left-0 w-full p-margin-page bg-canvas/80 backdrop-blur-md pb-safe border-t border-outline-variant/20 z-30">
<div class="max-w-md mx-auto">
<button class="w-full h-touch-target bg-transparent text-error font-label-lg text-label-lg border border-error/30 rounded-full flex items-center justify-center hover:bg-error/5 active:scale-98 transition-all duration-200">
                Cancel sync
            </button>
</div>
