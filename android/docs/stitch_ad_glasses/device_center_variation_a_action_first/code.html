<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Device Center</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#ebedf7",
                        "tertiary-fixed": "#ffdbc9",
                        "tertiary": "#723200",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#aac7ff",
                        "on-secondary-container": "#3f5881",
                        "surface": "#f9f9ff",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#181c22",
                        "primary-container": "#0a73e0",
                        "tertiary-fixed-dim": "#ffb68c",
                        "secondary-fixed": "#d6e3ff",
                        "secondary-container": "#b6d0ff",
                        "on-secondary-fixed-variant": "#2e476f",
                        "background": "#f9f9ff",
                        "surface-container-low": "#f1f3fc",
                        "on-primary-container": "#c0d5ff",
                        "primary": "#004389",
                        "surface-bright": "#f9f9ff",
                        "inverse-on-surface": "#eef0fa",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#d6e3ff",
                        "tertiary-container": "#964400",
                        "on-surface-variant": "#424752",
                        "surface-variant": "#e0e2eb",
                        "on-primary-fixed": "#001b3e",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c2c6d4",
                        "on-tertiary-fixed-variant": "#753400",
                        "surface-container-high": "#e6e8f1",
                        "on-background": "#181c22",
                        "surface-tint": "#095db7",
                        "on-tertiary-container": "#ffc9ac",
                        "secondary-fixed-dim": "#aec7f6",
                        "surface-container-highest": "#e0e2eb",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#001b3d",
                        "error": "#ba1a1a",
                        "outline": "#727783",
                        "inverse-surface": "#2d3037",
                        "primary-fixed-dim": "#aac7ff",
                        "secondary": "#465f88",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d7dae3",
                        "on-tertiary-fixed": "#321200",
                        "on-primary-fixed-variant": "#00458d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "1rem",
                        "grid-gutter": "1rem",
                        "section-gap": "1.5rem",
                        "element-gap": "0.75rem"
                    },
                    "fontFamily": {
                        "display-sm": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "display-sm": ["1.125rem", { "lineHeight": "1.5rem", "letterSpacing": "0.15em", "fontWeight": "700" }],
                        "label-lg": ["0.75rem", { "lineHeight": "1rem", "fontWeight": "600" }],
                        "body-md": ["0.875rem", { "lineHeight": "1.25rem", "fontWeight": "400" }],
                        "headline-sm": ["0.875rem", { "lineHeight": "1.25rem", "fontWeight": "600" }],
                        "label-md": ["11px", { "lineHeight": "1rem", "fontWeight": "500" }],
                        "body-sm": ["0.75rem", { "lineHeight": "1rem", "fontWeight": "400" }],
                        "label-sm": ["10px", { "lineHeight": "12px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased pb-safe">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface border-b border-outline-variant/20 flat no shadows">
<div class="flex justify-between items-center px-container-padding h-14 max-w-5xl mx-auto">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors scale-95 duration-150 text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-display-sm text-display-sm text-on-surface tracking-tight text-primary">Device Center</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="max-w-5xl mx-auto px-container-padding py-6 space-y-section-gap">
<!-- Device Hero Section -->
<section class="flex flex-col items-center">
<div class="w-full max-w-sm aspect-[1.79] rounded-2xl overflow-hidden bg-surface-container mb-6 relative shadow-sm border border-outline-variant/20">
<img alt="Device Product Image" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLtC7A76AZx5Vvs01DR1AONRS4MFiiy6OcZRsny96grxRQF2ZS2eBKzw2HbriSV2OGm_TieMs34N_si8weTX7HyVkBHC91drTonf4aVULwb39a9rXYQUWtqYBkJ_huvmNUDGqWVrns5a5RTlxAnpNC-2iuO9CijSKBVBtsM8qLrhUAhMEOsBCoRJrnUv20ylnqN4mhwNtKdLmz3EGErlaVRmXiBEnCPrCXGJZSy_VFYdvkOc-OaIua4WLw"/>
<!-- Status Pill inside image overlay -->
<div class="absolute top-4 right-4 bg-primary-container/90 backdrop-blur-sm text-on-primary-container px-3 py-1 rounded-full flex items-center gap-1.5 shadow-sm border border-primary/20">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-lg text-label-lg">Connected</span>
</div>
</div>
<div class="text-center space-y-1 mb-2">
<h2 class="font-display-sm text-display-sm text-on-surface">HeyCyan Pro</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Primary</p>
</div>
</section>
<!-- Metrics Bento -->
<section class="grid grid-cols-2 gap-grid-gutter">
<!-- Battery Card -->
<div class="bg-surface-container p-4 rounded-2xl flex flex-col items-center justify-center space-y-2 border border-outline-variant/30 shadow-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1; font-size: 24px;">battery_charging_80</span>
<div class="flex flex-col items-center">
<span class="font-headline-sm text-headline-sm text-on-surface">82%</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide">Battery</span>
</div>
</div>
<!-- Storage Card -->
<div class="bg-surface-container p-4 rounded-2xl flex flex-col items-center justify-center space-y-2 border border-outline-variant/30 shadow-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0; font-size: 24px;">cloud_sync</span>
<div class="flex flex-col items-center">
<span class="font-headline-sm text-headline-sm text-on-surface">61%</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wide">Storage</span>
</div>
</div>
</section>
<!-- Primary Actions -->
<section class="grid grid-cols-4 gap-2">
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full bg-inverse-surface text-inverse-on-surface flex items-center justify-center shadow-sm group-hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Ask</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center shadow-sm border border-outline-variant/20 group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Capture</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center shadow-sm border border-outline-variant/20 group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sync</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Sync</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center shadow-sm border border-outline-variant/20 group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">radio_button_checked</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Record</span>
</button>
</section>
<!-- Settings List -->
<section class="bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm overflow-hidden">
<div class="divide-y divide-outline-variant/10">
<div class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">sensors</span>
<span class="font-body-md text-body-md text-on-surface">Wearing Detection</span>
</div>
<!-- Toggle Switch Mock -->
<div class="w-10 h-6 bg-primary rounded-full relative shadow-inner">
<div class="absolute right-1 top-1 w-4 h-4 bg-on-primary rounded-full shadow-sm"></div>
</div>
</div>
<div class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">videocam</span>
<span class="font-body-md text-body-md text-on-surface">Video Duration</span>
</div>
<div class="flex items-center gap-1 text-on-surface-variant">
<span class="font-body-sm text-body-sm">30s</span>
<span class="material-symbols-outlined text-sm">chevron_right</span>
</div>
</div>
<div class="flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">graphic_eq</span>
<span class="font-body-md text-body-md text-on-surface">Audio Duration</span>
</div>
<div class="flex items-center gap-1 text-on-surface-variant">
<span class="font-body-sm text-body-sm">60s</span>
<span class="material-symbols-outlined text-sm">chevron_right</span>
</div>
</div>
</div>
</section>
<!-- Bottom Links -->
<section class="bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm overflow-hidden mb-8">
<div class="divide-y divide-outline-variant/10">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">science</span>
<span class="font-body-md text-body-md text-on-surface">Firmware Lab</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">preview</span>
<span class="font-body-md text-body-md text-on-surface">Live Preview</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-left">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">bug_report</span>
<span class="font-body-md text-body-md text-on-surface">Advanced &amp; Diagnostics</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</button>
</div>
</section>
</main>
</body></html>
