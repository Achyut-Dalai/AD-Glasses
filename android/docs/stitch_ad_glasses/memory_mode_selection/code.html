<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Memory Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",

            extend: {
              "colors": {
                      "surface-bright": "#f9f9ff",
                      "secondary-container": "#b6d0ff",
                      "surface-dim": "#d7dae3",
                      "surface-container": "#ebedf7",
                      "on-tertiary-container": "#ffc9ac",
                      "background": "#f9f9ff",
                      "surface-container-low": "#f1f3fc",
                      "on-tertiary-fixed-variant": "#753400",
                      "surface-container-highest": "#e0e2eb",
                      "tertiary-container": "#964400",
                      "surface-container-high": "#e6e8f1",
                      "secondary-fixed": "#d6e3ff",
                      "error-container": "#ffdad6",
                      "surface-container-lowest": "#ffffff",
                      "inverse-surface": "#2d3037",
                      "primary-fixed": "#d6e3ff",
                      "primary": "#004389",
                      "surface-tint": "#095db7",
                      "on-surface-variant": "#414753",
                      "on-error": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed": "#001b3e",
                      "primary-fixed-dim": "#aac7ff",
                      "tertiary-fixed": "#ffdbc9",
                      "on-primary-fixed-variant": "#00458d",
                      "primary-container": "#005ab4",
                      "on-error-container": "#93000a",

                      "on-primary-container": "#c0d5ff",
                      "inverse-on-surface": "#eef0fa",
                      "on-secondary": "#ffffff",
                      "on-secondary-container": "#3f5881",
                      "secondary-fixed-dim": "#aec7f6",
                      "surface-variant": "#e0e2eb",
                      "on-tertiary-fixed": "#321200",
                      "on-surface": "#181c22",
                      "tertiary-fixed-dim": "#ffb68c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "section-gap": "1.5rem",
                      "element-gap": "0.75rem",
                      "container-padding": "1rem",
                      "grid-gutter": "1rem"
              },
              "fontFamily": {
                      "label-sm": ["Inter"],
                      "display-sm": ["Inter"],
                      "body-sm": ["Inter"],
                      "label-md": ["Inter"],
                      "label-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-sm": ["Inter"]
              },
              "fontSize": {
                      "label-sm": ["10px", {"lineHeight": "12px", "fontWeight": "500"}],
                      "display-sm": ["1.125rem", {"lineHeight": "1.5rem", "letterSpacing": "0.15em", "fontWeight": "700"}],

          }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="bg-surface dark:bg-surface-dim w-full sticky top-0 z-50 transition-colors">
<div class="flex flex-col">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-5xl mx-auto">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 active:scale-95 duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim">Memory Mode</h1>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 active:scale-95 duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-2xl px-container-padding py-section-gap flex-1 flex flex-col space-y-6">
<!-- Private Local (Selected) -->
<button class="w-full text-left bg-surface-container-highest border border-primary/30 rounded-xl p-4 shadow-sm hover:bg-surface-container transition-colors active:scale-95 duration-200 relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 opacity-10 group-hover:opacity-20 transition-opacity"></div>
<div class="flex items-start space-x-4 relative z-10">
<div class="mt-1 bg-primary-container text-on-primary-container rounded-full p-2 flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">smartphone</span>
</div>
<div class="flex-1">
<div class="flex items-center justify-between mb-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Private Local</h2>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-2">Content and retrieval stay entirely on your phone.</p>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md">
<span class="w-1.5 h-1.5 rounded-full bg-primary mr-1"></span> Available now
                    </span>
</div>
</div>
</button>
<!-- Encrypted Sync -->
<button class="w-full text-left bg-surface-container border border-outline-variant/30 rounded-xl p-4 shadow-sm hover:bg-surface-container-high transition-colors active:scale-[0.98] duration-200 opacity-80">
<div class="flex items-start space-x-4">
<div class="mt-1 bg-surface-variant text-on-surface-variant rounded-full p-2 flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">cloud_sync</span>
</div>
<div class="flex-1">
<div class="flex items-center justify-between mb-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Encrypted Sync</h2>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-2">Secure backup to your own backend.</p>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-error-container text-on-error-container font-label-md text-label-md">
<span class="w-1.5 h-1.5 rounded-full bg-error mr-1"></span> Backend not configured
                    </span>
</div>
</div>
</button>
<!-- Fast Cloud Memory -->
<button class="w-full text-left bg-surface-container border border-outline-variant/30 rounded-xl p-4 shadow-sm hover:bg-surface-container-high transition-colors active:scale-[0.98] duration-200 opacity-80">
<div class="flex items-start space-x-4">
<div class="mt-1 bg-surface-variant text-on-surface-variant rounded-full p-2 flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">speed</span>
</div>
<div class="flex-1">
<div class="flex items-center justify-between mb-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Fast Cloud Memory</h2>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-2">High-speed retrieval via your cloud.</p>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-surface-variant text-on-surface-variant font-label-md text-label-md">
<span class="w-1.5 h-1.5 rounded-full bg-outline mr-1"></span> Backend dependent
                    </span>
</div>
</div>
</button>
<!-- Confidential Cloud Beta -->
<button class="w-full text-left bg-surface border border-outline-variant/20 rounded-xl p-4 opacity-50 cursor-not-allowed">
<div class="flex items-start space-x-4">
<div class="mt-1 bg-surface-variant/50 text-outline rounded-full p-2 flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">shield_lock</span>
</div>
<div class="flex-1">
<div class="flex items-center justify-between mb-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
                            Confidential Cloud
                            <span class="bg-tertiary-container text-on-tertiary-container text-[8px] uppercase font-bold px-1.5 py-0.5 rounded">Beta</span>
</h2>
</div>
<p class="font-body-md text-body-md text-outline mb-2">Verified confidential computing.</p>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-surface-variant text-outline font-label-md text-label-md">
                        Unavailable
                    </span>
</div>
</div>
</button>
</main>
</body></html>
