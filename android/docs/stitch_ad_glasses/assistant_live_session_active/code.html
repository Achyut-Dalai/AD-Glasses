<style>
        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            height: 100%;
        }
        .waveform-bar {
            width: 8px;
            border-radius: 4px;
            background-color: var(--tw-colors-primary, #004389);
            animation: pulse 1s ease-in-out infinite alternate;
        }
        .waveform-bar:nth-child(1) { height: 20%; animation-delay: 0s; }
        .waveform-bar:nth-child(2) { height: 50%; animation-delay: -0.2s; }
        .waveform-bar:nth-child(3) { height: 80%; animation-delay: -0.4s; }
        .waveform-bar:nth-child(4) { height: 40%; animation-delay: -0.6s; }
        .waveform-bar:nth-child(5) { height: 30%; animation-delay: -0.8s; }
        
        @keyframes pulse {
            0% { transform: scaleY(0.5); opacity: 0.5; }
            100% { transform: scaleY(1); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen">
<!-- Shared Component: TopAppBar / Live Session Focused View -->
<div class="relative flex h-auto min-h-screen w-full flex-col bg-surface group/design-root overflow-x-hidden font-body-md">
<div class="flex items-center bg-surface p-4 pb-2 justify-between">
<div class="text-on-surface flex size-12 shrink-0 items-center justify-center cursor-pointer rounded-full hover:bg-surface-variant transition-colors" data-icon="close" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-[24px]">close</span>
</div>
<h2 class="text-on-surface text-lg font-headline-sm leading-tight tracking-[-0.015em] flex-1 text-center">Live Session</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 w-12 bg-transparent text-on-surface hover:bg-surface-variant transition-colors min-w-0 p-0">
<div class="text-on-surface flex items-center justify-center" data-icon="photo_camera" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-[24px]">photo_camera</span>
</div>
</button>
</div>
</div>
<h1 class="text-primary tracking-tight text-[32px] font-display-sm leading-tight px-4 text-center pb-3 pt-6 animate-pulse">Listening...</h1>
<div class="flex w-full grow bg-surface @container p-4 flex-col justify-center">
<div class="w-full gap-1 overflow-hidden bg-surface-container-low @[480px]:gap-2 aspect-[3/2] rounded-xl flex items-center justify-center relative shadow-sm border border-outline-variant/30">
<!-- Simulated Waveform instead of static placeholder image for live feel -->
<div class="waveform absolute inset-0 z-10">
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
<div class="waveform-bar"></div>
</div>
<!-- Keeping structural integrity of the requested placeholder div but obscuring it conceptually with the waveform -->
<div class="w-full bg-center bg-no-repeat bg-cover aspect-auto rounded-none flex-1 opacity-5" data-alt="A completely blank minimalist placeholder background to support a live audio waveform visualization. Subtle grey tones, completely plain, clean studio aesthetic." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDrTyxv2pe2ZDq4HrEHvimbnUhLobxbPFofuDPzCT4lipoE274j3-gAjWCoptNYxK8vUKoi107jQQ_5LIUwUdCn9Kpj593PcQxX59p1zwoS3DlrFjd8VoK1Ui6SNlWtHH1O2xyqNAVYXJvMDlbbQZv7p2z5WVIA9KDEongPPUbtQaQZiCpK9lq5qMdTVykgiLH_D-8aHwCYbAvrLdSl6WW6UsrYDOedUF3vXhh9JXxpRfdR5uG5YbQd");'></div>
</div>
</div>
<p class="text-on-surface-variant text-base font-body-md leading-relaxed pb-6 pt-2 px-6 text-center italic">"I understand, you'd like to check your recent activity and review the..."</p>
<div class="@container pb-8">
<div class="gap-4 px-6 grid-cols-[repeat(auto-fit, minmax(80px,_1fr))] grid justify-center max-w-sm mx-auto">
<div class="flex flex-col items-center gap-3 bg-surface py-2 text-center group cursor-pointer">
<div class="rounded-full bg-surface-variant group-hover:bg-primary-container transition-colors p-4 shadow-sm">
<div class="text-on-surface group-hover:text-on-primary transition-colors flex items-center justify-center" data-icon="mic_off" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-[24px]">mic_off</span>
</div>
</div>
<p class="text-on-surface text-sm font-label-md leading-normal">Mute</p>
</div>
<div class="flex flex-col items-center gap-3 bg-surface py-2 text-center group cursor-pointer">
<div class="rounded-full bg-surface-variant group-hover:bg-primary-container transition-colors p-4 shadow-sm">
<div class="text-on-surface group-hover:text-on-primary transition-colors flex items-center justify-center" data-icon="videocam_off" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-[24px]">videocam_off</span>
</div>
</div>
<p class="text-on-surface text-sm font-label-md leading-normal">Camera</p>
</div>
<div class="flex flex-col items-center gap-3 bg-surface py-2 text-center group cursor-pointer">
<div class="rounded-full bg-error text-on-error hover:bg-on-error-container transition-colors p-4 shadow-md">
<div class="flex items-center justify-center" data-icon="call_end" data-size="24px" data-weight="regular">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">call_end</span>
</div>
</div>
<p class="text-on-surface text-sm font-label-md leading-normal text-error">End</p>
</div>
</div>
</div>
<div class="h-safe-area-bottom bg-surface"></div>
</div>
</body></html>
