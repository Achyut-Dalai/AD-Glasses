<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Media Detail - AD Glasses</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#f9f9ff",

                    "surface-container": "#ebedf7",
                    "surface-container-high": "#e6e8f1",
                    "outline-variant": "#c1c6d5",
                    "on-surface-variant": "#414753",
                    "on-tertiary-container": "#fffbff",
                    "on-tertiary-fixed": "#321200",
                    "error-container": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-container": "#bd5700",
                    "on-tertiary-fixed-variant": "#763400",
                    "tertiary-fixed-dim": "#ffb68c",
                    "secondary-container": "#b6d0ff",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",

                    "on-secondary-container": "#3f5881",

                    "inverse-primary": "#aac7ff",
                    "surface": "#f9f9ff",
                    "on-surface": "#181c22",
                    "surface-variant": "#e0e2eb",
                    "secondary-fixed": "#d6e3ff",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#001b3e",
                    "primary": "#005ab4",
                    "on-secondary-fixed": "#001b3d",
                    "surface-container-highest": "#e0e2eb",
                    "on-secondary-fixed-variant": "#2d476f"

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",

            "fontFamily": {

                    "display": ["Inter"],
                    "body": ["Inter"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Hardware Precision smooth scrolling */
        html { scroll-behavior: smooth; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface flex items-center justify-between px-4 py-2 border-b border-outline-variant/30 backdrop-blur-md bg-opacity-90">
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-xl font-black text-primary dark:text-inverse-primary" style="font-variation-settings: 'wght' 200;">qr_code_2</span>
<h1 class="font-headline text-lg font-medium text-on-surface">Media Detail</h1>
</div>
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-14 pb-12 w-full max-w-4xl mx-auto">
<!-- Edge-to-Edge Hero Image -->
<div class="relative w-full aspect-[4/3] md:aspect-[21/9] bg-surface-container-lowest overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A stunning, edge-to-edge architectural photograph of the London skyline at sunset, captured from a high vantage point. The image features modern glass skyscrapers reflecting the warm, golden-hour light, contrasted against a clear gradient sky fading from deep twilight blue to soft amber. The lighting is pristine and dramatic, emphasizing the sharp, geometric lines of the buildings. The overall mood is sophisticated, calm, and technologically advanced, fitting perfectly within a sleek, light-mode interface characterized by a cool, professional blue-and-neutral color palette and minimalist aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7oL7TNFYrf60adKGqXrvU_P5TwgC9HeyL-4pNMgstVH58ex8hTWDE6B2rUjD0z5TReaa5mnNgKfLnMa5VdOstkeNvB4OntFl3NKbG5j1y82XrH-9RZjyvn5jnIM_z_iC8pW5Row-gf2M5-lVIN67APeCLeeSgmdgv1v0DxLZMXuR1sSxvGpu58CWiSOoWVVCjkh2ZHAcvRKDhlOHKL8izw2idXQB6F-BjL9nQoC8ad5nEsYacFunO"/>
<!-- Floating Assistant Pill -->
<button class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-surface/80 backdrop-blur-lg border border-outline-variant/40 text-on-surface font-label text-sm font-medium px-5 py-2.5 rounded-full shadow-[0_4px_24px_rgba(0,0,0,0.08)] flex items-center gap-2 hover:bg-surface transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1, 'wght' 300;">auto_awesome</span>
<span>Ask Assistant about this photo</span>
</button>
</div>
<!-- Data Sheet Content -->
<div class="px-5 md:px-8">
<!-- Capture Stats -->
<section class="py-5 border-b border-outline-variant/60">
<h2 class="font-label text-xs font-semibold text-outline uppercase tracking-[0.15em] mb-4">Capture Stats</h2>
<div class="grid grid-cols-3 gap-6">
<div class="flex flex-col">
<span class="text-xs text-on-surface-variant mb-1 font-medium">Aperture</span>
<span class="font-headline text-base text-on-surface font-medium">f/1.8</span>
</div>
<div class="flex flex-col">
<span class="text-xs text-on-surface-variant mb-1 font-medium">Shutter</span>
<span class="font-headline text-base text-on-surface font-medium">1/500s</span>
</div>
<div class="flex flex-col">
<span class="text-xs text-on-surface-variant mb-1 font-medium">ISO</span>
<span class="font-headline text-base text-on-surface font-medium">100</span>
</div>
</div>
</section>
<!-- Provenance -->
<section class="py-5 border-b border-outline-variant/60 flex flex-row items-center justify-between">
<div>
<h2 class="font-label text-xs font-semibold text-outline uppercase tracking-[0.15em] mb-2">Provenance</h2>
<div class="flex items-center gap-2">
<span class="font-body text-base text-on-surface font-medium">Device Authenticated</span>
</div>
<p class="text-sm text-on-surface-variant mt-0.5">Original Unedited • AD Glass v2.1</p>
</div>
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</section>
<!-- Spatial Data -->
<section class="py-5 border-b border-outline-variant/60">
<h2 class="font-label text-xs font-semibold text-outline uppercase tracking-[0.15em] mb-4">Spatial Data</h2>
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center shrink-0 border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary">explore</span>
</div>
<div>
<p class="font-body text-base text-on-surface font-medium">Central Park, New York</p>
<p class="text-sm text-on-surface-variant mt-0.5 font-mono">40.785091, -73.968285</p>
</div>
</div>
</section>
<!-- Actions (Tonal Tiles) -->
<section class="py-8">
<h2 class="font-label text-xs font-semibold text-outline uppercase tracking-[0.15em] mb-4">On-Device Processing</h2>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
<button class="bg-surface-container-low hover:bg-surface-container border border-outline-variant/20 transition-colors duration-200 rounded-xl p-4 flex flex-col items-start gap-3 group active:scale-[0.98]">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors">document_scanner</span>
<span class="font-body text-sm font-medium text-on-surface">Extract Text</span>
</button>
<button class="bg-surface-container-low hover:bg-surface-container border border-outline-variant/20 transition-colors duration-200 rounded-xl p-4 flex flex-col items-start gap-3 group active:scale-[0.98]">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors">center_focus_strong</span>
<span class="font-body text-sm font-medium text-on-surface">Identify Objects</span>
</button>
<button class="bg-surface-container-low hover:bg-surface-container border border-outline-variant/20 transition-colors duration-200 rounded-xl p-4 flex flex-col items-start gap-3 group active:scale-[0.98]">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors">translate</span>
<span class="font-body text-sm font-medium text-on-surface">Translate Image</span>
</button>
</div>
</section>
</div>
</main>
<!-- BottomNavBar Suppressed: Page intent is a task-focused detail view with a "Back" action. -->
</body></html>
