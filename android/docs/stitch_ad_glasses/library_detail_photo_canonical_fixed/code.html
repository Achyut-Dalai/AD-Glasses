<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Media Detail - Studio Graphite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#F6F7F9",
                        surface: "#FFFFFF",
                        primary: "#0066FF",
                        "primary-hover": "#0052CC",
                        "text-main": "#111827",
                        "text-secondary": "#6B7280",
                        border: "#E5E7EB",
                        danger: "#EF4444",
                        "danger-bg": "#FEE2E2"
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: max(884px, 100dvh);
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-background text-text-main min-h-screen flex flex-col">
<!-- Header -->
<header class="flex items-center justify-between h-14 px-4 bg-surface border-b border-border sticky top-0 z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-background text-text-main transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-base font-semibold">Media Detail</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-background text-text-main transition-colors">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto pb-24">
<!-- Photo Preview -->
<div class="w-full aspect-[4/3] bg-border relative">
<img alt="A vivid, high-resolution photograph taken from the perspective of smart glasses, showing a bustling outdoor cafe on a sunny afternoon." class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAly7BPt1_r5qUAz9C2zcKKdLfUnOpls0bQB-Enm2yrOca198F7VeKuUoK2k2lQ2GjceN1LX-Bfu76mgIFPiI6M_k_PGdA4AGR7d5l3r1aYc_8ZzseJvHXM1VVdWiwNCEoYdWaCpuurRGLjKHE_GoUCSbhQSp_PZLxP80KFQtRg7puTqc5u2QL2PdIZ24Xqsj3oSQCufmw5tE0ZTn0axvYRGFxABR9bPbvdFouvxqPstd7LmP48wZEQ"/>
</div>
<!-- Metadata Section -->
<div class="p-4 flex flex-col gap-4 bg-surface mt-2 border-y border-border">
<div class="flex flex-col gap-1">
<h2 class="text-xl font-bold m-0">HeyCyan Pro</h2>
<p class="text-sm text-text-secondary m-0">Captured with glasses • 2:14 PM • 12MP • 2.4MB</p>
</div>
<button class="w-full h-12 bg-primary text-white rounded-lg text-sm font-semibold flex items-center justify-center gap-2 hover:bg-primary-hover transition-colors shadow-sm">
<span class="material-symbols-outlined text-[20px]">chat_bubble</span>
                Ask about this photo
            </button>
</div>
</main>
<!-- Bottom Navigation -->
<footer class="fixed bottom-0 w-full bg-surface border-t border-border z-20 pb-safe">
<div class="flex justify-between items-center px-6 py-3 max-w-md mx-auto">
<button class="flex flex-col items-center justify-center gap-1 text-text-secondary hover:text-primary transition-colors min-w-[64px]">
<span class="material-symbols-outlined text-[24px]">chat_bubble</span>
<span class="text-[10px] font-medium">Ask</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 text-text-secondary hover:text-primary transition-colors min-w-[64px]">
<span class="material-symbols-outlined text-[24px]">share</span>
<span class="text-[10px] font-medium">Share</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 text-text-secondary hover:text-primary transition-colors min-w-[64px]">
<span class="material-symbols-outlined text-[24px]">add</span>
<span class="text-[10px] font-medium">Add</span>
</button>
<button class="flex flex-col items-center justify-center gap-1 text-text-secondary hover:text-danger transition-colors min-w-[64px]">
<span class="material-symbols-outlined text-[24px]">delete</span>
<span class="text-[10px] font-medium">Delete</span>
</button>
</div>
</footer>
</body></html>
