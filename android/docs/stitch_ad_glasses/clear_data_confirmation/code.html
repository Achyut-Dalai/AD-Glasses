<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Clear Local Data</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#181c22",
                        "outline": "#717785",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#2d476f",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#aac7ff",
                        "surface-tint": "#005db8",
                        "on-secondary-container": "#3f5881",
                        "secondary-fixed-dim": "#aec7f7",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d7dae3",
                        "tertiary-fixed": "#ffdbc9",
                        "on-primary-fixed-variant": "#00458d",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2d3037",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#321200",
                        "on-primary-fixed": "#001b3e",
                        "on-secondary-fixed": "#001b3d",
                        "on-tertiary-container": "#fffbff",
                        "surface-variant": "#e0e2eb",
                        "tertiary": "#964400",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#763400",
                        "inverse-primary": "#aac7ff",
                        "tertiary-fixed-dim": "#ffb68c",
                        "surface-container-low": "#f1f3fc",
                        "on-primary-container": "#fefcff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#d6e3ff",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#eef0fa",
                        "primary-container": "#0a73e0",
                        "surface-container-high": "#e6e8f1",
                        "on-surface-variant": "#414753",
                        "outline-variant": "#c1c6d5",
                        "tertiary-container": "#bd5700",
                        "surface-bright": "#f9f9ff",
                        "surface-container-highest": "#e0e2eb",
                        "background": "#f9f9ff",
                        "secondary-fixed": "#d6e3ff",
                        "primary": "#005ab4",
                        "surface-container": "#ebedf7",
                        "secondary-container": "#b6d0ff",
                        "on-background": "#181c22",
                        "secondary": "#465f88",
                        "surface": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    "fontSize": {},
                    "animation": {
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.2, 0, 0, 1) forwards',
                        'fade-in': 'fadeIn 0.2s ease-out forwards',
                    },
                    "keyframes": {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface h-screen overflow-hidden flex flex-col relative select-none">
<!-- TopAppBar (From JSON) -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flex items-center px-4 h-16 w-full z-10">
<button aria-label="Go back" class="material-symbols-outlined text-primary hover:bg-surface-container-low transition-colors active:opacity-70 transition-opacity p-2 rounded-full mr-2 -ml-2">
            arrow_back
        </button>
<h1 class="font-body text-label-large font-medium text-primary flex-1">
            Settings
        </h1>
</header>
<!-- Dummy Background Content to provide context for the bottom sheet -->
<main class="flex-1 overflow-y-auto px-4 py-6 blur-[2px] pointer-events-none opacity-40">
<div class="max-w-2xl mx-auto space-y-6">
<section>
<h3 class="text-on-surface-variant font-label text-sm mb-3 px-2">Storage</h3>
<div class="bg-surface-container-lowest rounded-xl border border-surface-variant overflow-hidden">
<div class="flex items-center justify-between p-4 border-b border-surface-variant">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">cloud</span>
<span class="text-on-surface font-medium">Cloud Sync</span>
</div>
<span class="material-symbols-outlined text-outline-variant">toggle_on</span>
</div>
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">delete</span>
<span class="text-on-surface font-medium">Clear Cache</span>
</div>
<span class="text-outline-variant text-sm">24 MB</span>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Sheet Overlay -->
<!-- The backdrop handles the fade-in, the sheet handles the slide-up -->
<div aria-modal="true" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center" role="dialog">
<!-- Scrim / Backdrop -->
<div class="absolute inset-0 bg-on-surface/50 backdrop-blur-[1px] animate-fade-in"></div>
<!-- Sheet Container -->
<div class="relative bg-surface-container-lowest w-full sm:max-w-[400px] rounded-t-xl sm:rounded-xl shadow-2xl animate-slide-up flex flex-col p-4 sm:p-6 pb-8 sm:pb-6">
<!-- Mobile Drag Handle -->
<div class="w-8 h-1 bg-outline-variant/50 rounded-full mx-auto mb-6 sm:hidden"></div>
<!-- Content Area -->
<div class="flex flex-col items-center sm:items-start text-center sm:text-left gap-4">
<!-- Icon & Text Group -->
<div class="flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-5 w-full">
<div class="bg-error-container/30 p-3 rounded-full flex-shrink-0">
<span class="material-symbols-outlined text-error text-3xl" style="font-variation-settings: 'FILL' 1;">
                            warning
                        </span>
</div>
<div class="flex-1">
<h2 class="font-headline font-bold text-xl text-on-surface mb-2">
                            Clear all local data?
                        </h2>
<p class="font-body text-[15px] leading-relaxed text-on-surface-variant">
                            This will delete all media, transcripts, and notes from this phone. Data on your glasses or your cloud will not be affected. This cannot be undone.
                        </p>
</div>
</div>
</div>
<!-- Actions Container -->
<!-- 16dp (4 tailwind spacing unit) gutters between buttons -->
<div class="flex flex-col sm:flex-row-reverse gap-4 mt-8 w-full">
<!-- Primary Destructive Action -->
<!-- Graphite/warning contrast: Using the dark, non-neon error color from theme with white text -->
<button class="flex-1 w-full bg-error text-on-error rounded-xl py-3.5 px-4 font-label font-medium text-base hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    Delete everything
                </button>
<!-- Secondary Cancel Action -->
<button class="flex-1 w-full bg-surface-container-high text-on-surface-variant rounded-xl py-3.5 px-4 font-label font-medium text-base hover:bg-surface-container-highest active:scale-[0.98] transition-all flex items-center justify-center">
                    Cancel
                </button>
</div>
</div>
</div>
</body></html>
