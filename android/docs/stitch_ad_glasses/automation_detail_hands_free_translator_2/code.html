<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Hands-Free Translator Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#753400",
                    "on-tertiary-container": "#ffc9ac",
                    "secondary-fixed": "#d6e3ff",
                    "tertiary-container": "#964400",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "status-connected": "#1275e2",
                    "on-tertiary": "#ffffff",
                    "stage-halo-start": "rgba(10, 115, 224, 0.15)",
                    "primary": "#004389",
                    "on-primary-fixed-variant": "#00458d",
                    "surface-container-high": "#e5e8f1",
                    "primary-fixed": "#d6e3ff",
                    "surface-dim": "#d7dae2",
                    "tertiary-fixed": "#ffdbc9",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#eef1f9",
                    "on-surface-variant": "#424752",
                    "on-secondary-container": "#3f5881",
                    "secondary-container": "#b6d0ff",
                    "tertiary": "#723200",
                    "on-primary": "#ffffff",
                    "secondary": "#465f88",
                    "on-secondary-fixed-variant": "#2e476f",
                    "secondary-fixed-dim": "#aec7f6",
                    "error-container": "#ffdad6",
                    "surface-glass": "rgba(249, 249, 255, 0.8)",
                    "surface-container-highest": "#dfe2eb",
                    "on-error-container": "#93000a",
                    "primary-container": "#005ab4",
                    "on-secondary-fixed": "#001b3d",
                    "background-alt": "#F6F7F9",
                    "surface-container": "#ebeef6",
                    "surface-tint": "#095db7",
                    "on-background": "#181c22",
                    "outline": "#727783",
                    "error": "#ba1a1a",
                    "on-surface": "#181c22",
                    "surface-container-low": "#f1f3fc",
                    "on-primary-fixed": "#001b3e",
                    "surface-bright": "#f8f9ff",
                    "tertiary-fixed-dim": "#ffb68c",
                    "surface": "#f8f9ff",
                    "outline-variant": "#c2c6d4",
                    "background": "#f8f9ff",
                    "surface-variant": "#dfe2eb",
                    "on-primary-container": "#c0d5ff",
                    "primary-fixed-dim": "#aac7ff",
                    "inverse-primary": "#aac7ff",
                    "inverse-surface": "#2d3137",
                    "on-tertiary-fixed": "#321200"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "section-gap": "2rem",
                    "element-gap": "0.75rem",
                    "container-margin": "1rem",
                    "touch-target-min": "40px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "label-xs": ["Inter"],
                    "body-md": ["Inter"],
                    "body-sm": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "display-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.025em", "fontWeight": "800"}],
                    "label-xs": ["10px", {"lineHeight": "12px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: #F6F7F9; /* background-alt */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Ambient depth effects */
        .glass-panel {
            background: var(--tw-colors-surface-container-lowest, #ffffff);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03), 0 1px 3px rgba(0,0,0,0.02);
            border: 1px solid rgba(255,255,255,0.4);
        }
        
        .stage-halo {
            background: radial-gradient(circle at top center, rgba(10, 115, 224, 0.15) 0%, transparent 70%);
        }

        /* Custom toggle switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #004389; /* primary */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #004389; /* primary */
        }
        .toggle-checkbox:focus {
            outline: none;
            box-shadow: none;
        }
        
        /* Hide scrollbar for horizontal scrolling areas */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background font-body-md min-h-screen flex flex-col relative pb-safe">
<!-- Top App Bar (Shared Component) -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary-fixed w-full top-0 sticky border-b border-outline-variant/20 z-50 backdrop-blur-md bg-opacity-80">
<div class="flex justify-between items-center px-container-margin h-14 max-w-5xl mx-auto">
<!-- Back Action (Since it's a detail screen, it acts as a secondary layer) -->
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors scale-95 duration-150 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight truncate flex-1 text-center">Glasses Pro</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors scale-95 duration-150 text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 max-w-2xl mx-auto w-full px-container-margin pt-6 pb-32">
<!-- Header Section -->
<div class="flex flex-col items-center mb-8 relative">
<div class="absolute inset-0 stage-halo -z-10 rounded-full blur-2xl opacity-50"></div>
<div class="w-16 h-16 rounded-2xl bg-surface-container-lowest shadow-sm flex items-center justify-center mb-4 text-primary">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">translate</span>
</div>
<h2 class="font-display-lg text-display-lg text-on-background mb-2 text-center">Hands-Free Translator</h2>
<!-- Status Pill -->
<div class="flex items-center gap-2 bg-surface-container-lowest border border-outline-variant/30 rounded-full px-3 py-1 mb-6">
<div class="w-2 h-2 rounded-full bg-status-connected animate-pulse"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Ready</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-md">
                Translate a conversation while you listen. High accuracy powered by Lumina AI.
            </p>
</div>
<!-- Settings Container -->
<div class="space-y-section-gap">
<!-- Section 1: Language Pair -->
<section class="glass-panel rounded-xl p-5">
<h3 class="font-headline-md text-headline-md text-on-background mb-4">Language Pair</h3>
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg mb-element-gap hover:bg-surface-container-high transition-colors cursor-pointer">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">Source</span>
<span class="font-body-md text-body-md font-medium text-on-background">Auto-detect</span>
</div>
<span class="material-symbols-outlined text-outline">mic</span>
</div>
<div class="flex justify-center -my-3 relative z-10">
<button class="w-8 h-8 rounded-full bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-sm text-primary hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" style="font-size: 18px;">swap_vert</span>
</button>
</div>
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg mt-element-gap hover:bg-surface-container-high transition-colors cursor-pointer">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">Target</span>
<span class="font-body-md text-body-md font-medium text-on-background">English (US)</span>
</div>
<span class="material-symbols-outlined text-outline">translate</span>
</div>
</section>
<!-- Section 2: Input Source -->
<section class="glass-panel rounded-xl p-5">
<h3 class="font-headline-md text-headline-md text-on-background mb-4">Input Source</h3>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-center justify-center p-4 rounded-lg border-2 border-primary bg-primary/5 text-primary transition-all">
<span class="material-symbols-outlined mb-2" style="font-variation-settings: 'FILL' 1;">smartphone</span>
<span class="font-body-sm text-body-sm text-center">Phone Mic</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-lg border border-outline-variant/30 bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined mb-2">headset_mic</span>
<span class="font-body-sm text-body-sm text-center">Bluetooth Headset</span>
</button>
</div>
</section>
<!-- Section 3: Output Choices -->
<section class="glass-panel rounded-xl p-5">
<h3 class="font-headline-md text-headline-md text-on-background mb-4">Output Display</h3>
<div class="space-y-3">
<label class="flex items-center justify-between p-3 rounded-lg hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined">qr_code_2</span>
</div>
<div>
<p class="font-body-sm text-body-sm text-on-background">Glasses Display</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">AR subtitle overlay</p>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 top-0 left-0 transition-all duration-200" id="toggle-glasses" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200" for="toggle-glasses"></label>
</div>
</label>
<label class="flex items-center justify-between p-3 rounded-lg hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">volume_up</span>
</div>
<div>
<p class="font-body-sm text-body-sm text-on-background">Speak Aloud</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Synthesized voice</p>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 top-0 left-0 transition-all duration-200" id="toggle-voice" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200" for="toggle-voice"></label>
</div>
</label>
</div>
</section>
<!-- Section 4: Data -->
<section class="glass-panel rounded-xl p-5 mb-8">
<div class="flex items-start justify-between">
<div>
<h3 class="font-body-sm text-body-sm text-on-background font-medium mb-1">Save Transcripts</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant pr-4">Store translation history locally for 30 days.</p>
</div>
<div class="relative inline-block w-12 mt-1 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 top-0 left-0 transition-all duration-200" id="toggle-data" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200" for="toggle-data"></label>
</div>
</div>
</section>
</div>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 w-full z-40 bg-surface/90 backdrop-blur-md border-t border-outline-variant/20 p-4 pb-safe flex items-center gap-3 max-w-2xl mx-auto left-1/2 -translate-x-1/2">
<button class="h-12 px-6 rounded-full bg-surface-container-low text-on-surface-variant font-body-sm text-body-sm font-medium hover:bg-surface-container transition-colors flex items-center justify-center whitespace-nowrap">
            Test Phrase
        </button>
<button class="flex-1 h-12 rounded-full bg-on-background text-white font-body-sm text-body-sm font-medium hover:bg-inverse-surface transition-colors flex items-center justify-center gap-2 shadow-sm">
<span class="material-symbols-outlined" style="font-size: 20px;">play_arrow</span>
            Start Translating
        </button>
</div>
</body></html>
