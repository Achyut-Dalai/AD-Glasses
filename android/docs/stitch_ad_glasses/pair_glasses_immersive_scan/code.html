<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>AD Glasses - Pair Device</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Scanning Animation */
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
                box-shadow: 0 0 0 0 rgba(25, 120, 229, 0.4);
            }
            70% {
                transform: scale(1.2);
                opacity: 0;
                box-shadow: 0 0 0 40px rgba(25, 120, 229, 0);
            }
            100% {
                transform: scale(0.8);
                opacity: 0;
            }
        }

        .scanning-pulse {
            animation: pulse-ring 2.5s infinite cubic-bezier(0.45, 0, 0.55, 1);
        }
        
        .scanning-pulse-delay {
            animation: pulse-ring 2.5s infinite cubic-bezier(0.45, 0, 0.55, 1);
            animation-delay: 1.25s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-canvas text-on-surface font-body-lg min-h-screen flex flex-col items-center antialiased">
<!-- Top Navigation (Transactional intent, suppressed bottom nav) -->
<header class="w-full flex justify-between items-center px-6 py-4 bg-surface/80 backdrop-blur-md sticky top-0 z-50">
<button aria-label="Close" class="h-touch-target w-touch-target flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
<h1 class="font-headline-md text-on-surface font-bold tracking-tight">Add Device</h1>
<div class="h-touch-target w-touch-target"></div> <!-- Placeholder for balance -->
</header>
<main class="w-full max-w-md px-margin-page flex flex-col flex-1 pb-24">
<!-- Header Section -->
<section class="text-center mt-8 mb-12">
<h2 class="font-headline-lg text-primary mb-2">Looking for Glasses</h2>
<p class="font-body-md text-cool-gray">Make sure your glasses are turned on and nearby.</p>
</section>
<!-- Scanning Stage -->
<section class="relative h-hero-stage flex items-center justify-center mb-12 isolate">
<!-- Pulsing background -->
<div class="absolute inset-0 flex items-center justify-center -z-10">
<div class="absolute w-32 h-32 rounded-full border border-electric-blue/30 scanning-pulse bg-electric-blue/5"></div>
<div class="absolute w-32 h-32 rounded-full border border-electric-blue/20 scanning-pulse-delay bg-electric-blue/5"></div>
</div>
<!-- Central Icon Container -->
<div class="w-24 h-24 bg-surface-control rounded-full shadow-sm flex items-center justify-center border border-outline-variant relative z-10 overflow-hidden">
<img alt="Glasses scanning icon" class="w-16 h-16 object-contain mix-blend-multiply opacity-80" src="https://lh3.googleusercontent.com/aida/AP1WRLvf9P6GqbyZ-mEkmoK8rz1k4WZ_EVB3-QXNxJuPNPBXhE-AMcGFIXlzvBQWNlt3ht9vPSoOFxSjqiRT8kFzphsTfDkWvcbiDljU1yXVJeoxk4TUnAs9kZEatcm-OfBZ0TNpNBzRaov9gcSoBbsvDbZ_YrX-lSgtxdTWEHkV-9HezubKmLzI_tbME-U8jAy8KRpVzCORgiZhMWnXEEtDgcGJX8_oVjbr3pJ3HFdSS7WBtkk3Npy4i4nqUQ"/>
</div>
</section>
<!-- Detected Devices List -->
<section class="flex flex-col gap-gap-sm mb-auto">
<h3 class="font-label-md text-on-surface-variant uppercase tracking-widest mb-2 px-2">Detected Devices</h3>
<!-- Device Item 1 -->
<div class="bg-surface-control rounded-xl p-4 flex items-center gap-4 border border-outline-variant hover:border-electric-blue transition-colors cursor-pointer group">
<div class="w-12 h-12 bg-surface-container-low rounded-full flex items-center justify-center flex-shrink-0 text-electric-blue group-hover:bg-electric-blue/10 transition-colors">
<span class="material-symbols-outlined">eyeglasses</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-1">
<span class="font-label-lg text-on-surface truncate">AD Glasses Pro</span>
<div aria-label="Strong signal" class="flex gap-0.5 text-success-teal">
<span class="material-symbols-outlined text-[16px] leading-none" data-weight="fill">signal_cellular_4_bar</span>
</div>
</div>
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-success-teal inline-block"></span>
<span class="font-body-md text-cool-gray text-xs">HeyCyan-compatible</span>
</div>
</div>
<button class="bg-primary text-on-primary font-label-lg px-4 py-2 rounded-lg hover:opacity-90 active:scale-95 transition-all flex-shrink-0 h-[40px]">
                    Connect
                </button>
</div>
<!-- Device Item 2 (Weaker signal) -->
<div class="bg-surface-control rounded-xl p-4 flex items-center gap-4 border border-outline-variant hover:border-electric-blue transition-colors cursor-pointer group opacity-80">
<div class="w-12 h-12 bg-surface-container-low rounded-full flex items-center justify-center flex-shrink-0 text-cool-gray group-hover:text-electric-blue group-hover:bg-electric-blue/10 transition-colors">
<span class="material-symbols-outlined">eyeglasses</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-1">
<span class="font-label-lg text-on-surface truncate">AD Glasses (Guest)</span>
<div aria-label="Weak signal" class="flex gap-0.5 text-warning-amber">
<span class="material-symbols-outlined text-[16px] leading-none" data-weight="fill">signal_cellular_2_bar</span>
</div>
</div>
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-cool-gray inline-block"></span>
<span class="font-body-md text-cool-gray text-xs">Basic mode</span>
</div>
</div>
<button class="bg-surface-container-highest text-on-surface font-label-lg px-4 py-2 rounded-lg hover:bg-surface-variant active:scale-95 transition-all flex-shrink-0 h-[40px]">
                    Connect
                </button>
</div>
</section>
<!-- Troubleshooting Section -->
<section class="mt-12 border-t border-outline-variant pt-6">
<button class="w-full flex items-center justify-between p-4 bg-surface-control rounded-xl border border-outline-variant hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-cool-gray group-hover:text-on-surface transition-colors">help</span>
<span class="font-label-lg text-on-surface">Can't find your glasses?</span>
</div>
<span class="material-symbols-outlined text-cool-gray">chevron_right</span>
</button>
</section>
</main>
</body></html>
