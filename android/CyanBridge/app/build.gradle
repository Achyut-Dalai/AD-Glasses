def keystorePropertiesFile = rootProject.file("keystore.properties")

def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def metaGithubToken = System.getenv("GITHUB_TOKEN")
        ?: localProperties.getProperty("github_token")
        ?: localProperties.getProperty("meta_token")
def metaDatEnabled = metaGithubToken != null && !metaGithubToken.trim().isEmpty()

android {
    namespace = "com.fersaiyan.cyanbridge"
    compileSdk = 37
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId = "com.fersaiyan.cyanbridge"
        // Meta DAT declares minSdk 29. Keep the regular build on API 24 if Meta SDK is skipped.
        minSdk = metaDatEnabled ? 29 : 24
        targetSdk = 37
        versionCode = 14
        versionName = "alpha"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Chapter 6: optional transcription API key (do not commit secrets).
        def openAiKey = project.findProperty("OPENAI_API_KEY") ?: ""
        buildConfigField "String", "OPENAI_API_KEY", "\"${openAiKey}\""

        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = false
        buildConfig = true
        compose = true
        aidl = true
    }

    sourceSets {
        main {
            java.srcDir("src/main/myvu-upstream/android/app/src/main/java")
            assets.srcDir("src/main/myvu-upstream/android/app/src/main/assets")
            java.exclude("com/myvu/client/ui/**")
            java.exclude("com/myvu/client/service/MyvuService.java")
            java.exclude("com/myvu/client/service/MirrorNotificationListener.java")
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

