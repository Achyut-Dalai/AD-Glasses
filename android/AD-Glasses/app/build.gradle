plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose.compiler)
    alias(libs.plugins.ksp)
}

def keystorePropertiesFile = rootProject.file("keystore.properties")

def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def metaGithubToken = System.getenv("GITHUB_TOKEN")
        ?: localProperties.getProperty("github_token")
        ?: localProperties.getProperty("meta_token")
def metaDatEnabled = metaGithubToken != null && !metaGithubToken.trim().isEmpty()
def myvuJavaSourceDir = file("src/main/myvu-upstream/android/app/src/main/java")
def myvuAssetsSourceDir = file("src/main/myvu-upstream/android/app/src/main/assets")
def myvuEnabled = new File(myvuJavaSourceDir, "com/myvu/client/service/ConnectionManager.java").exists()

android {
    namespace = "com.ad_glasses"
    compileSdk = 37
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId = "com.ad_glasses"
        // Meta DAT declares minSdk 29. Keep the regular build on API 24 if Meta SDK is skipped.
        minSdk = metaDatEnabled ? 29 : 24
        targetSdk = 37
        versionCode = 14
        versionName = "alpha"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "META_DAT_AVAILABLE", metaDatEnabled.toString()
        buildConfigField "boolean", "MYVU_SDK_AVAILABLE", myvuEnabled.toString()

        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = false
        buildConfig = true
        compose = true
        aidl = true
    }

    sourceSets {
        main {
            if (myvuEnabled) {
                java.srcDir(myvuJavaSourceDir)
                assets.srcDir(myvuAssetsSourceDir)
                java.exclude("com/myvu/client/ui/**")
                java.exclude("com/myvu/client/service/MyvuService.java")
                java.exclude("com/myvu/client/service/MirrorNotificationListener.java")
            } else {
                kotlin.srcDir("src/myvu-stub/java")
            }

            if (!metaDatEnabled) {
                // The real manager directly references the private Meta DAT SDK. Exclude only that
                // implementation and compile an explicit unavailable backend when credentials are absent.
                kotlin.exclude("com/ad_glasses/devices/metarayban/MetaRaybanManager.kt")
                kotlin.srcDir("src/meta-stub/java")
            }

            assets.srcDir("build/generated/sharedComposeResourcesAssets")
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

if (!myvuEnabled) {
    logger.warn("MYVU upstream sources are not initialized - compiling the unavailable MYVU transport shim. Run 'git submodule update --init --recursive' to enable MYVU hardware support.")
}

def syncSharedComposeResources = tasks.register("syncSharedComposeResources", Sync) {
    dependsOn(":shared:prepareComposeResourcesTaskForCommonMain")
    from(rootProject.file("shared/build/generated/compose/resourceGenerator/preparedResources/commonMain/composeResources"))
    into(layout.buildDirectory.dir(
            "generated/sharedComposeResourcesAssets/composeResources/com.ad_glasses.shared.generated.resources"
    ))
}

tasks.named("preBuild").configure {
    dependsOn(syncSharedComposeResources)
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("AD-Glasses.apk")
        }
    }
}

