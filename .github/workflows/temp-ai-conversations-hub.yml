name: Temporary AI conversation hub

on:
  push:
    branches:
      - fix/ai-conversations-hub

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/ai-conversations-hub
          fetch-depth: 1
      - name: Apply AI conversation hub
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp_ai_conversations_hub.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/AD-Glasses/app/src/main/java/com/ad_glasses/ui/adglasses/ADGlassesModels.kt \
                  android/AD-Glasses/app/src/main/java/com/ad_glasses/ui/adglasses/ADComponents.kt \
                  android/AD-Glasses/app/src/main/java/com/ad_glasses/ui/adglasses/ADGlassesApp.kt \
                  android/AD-Glasses/app/src/main/java/com/ad_glasses/ui/adglasses/ADNativeConversationScreen.kt \
                  android/AD-Glasses/app/src/main/java/com/ad_glasses/ai/orchestrator/AssistantConversationSession.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Redesign AI conversations hub'
            git push origin HEAD:fix/ai-conversations-hub
          fi
