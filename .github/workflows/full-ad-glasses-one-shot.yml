name: Complete AD Glasses rebrand

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: read
  issues: write
  pull-requests: write

concurrency:
  group: complete-ad-glasses-rebrand
  cancel-in-progress: true

jobs:
  transform-build-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_SHA: bac316924bfaba3eb9e09c07c111eae82e7e003b
      TARGET_BRANCH: fix/complete-ad-glasses-rebrand
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          ref: fix/complete-ad-glasses-rebrand
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Materialize submodule LFS files
        shell: bash
        run: |
          git lfs install --local
          git submodule foreach --recursive 'git lfs install --local && git lfs pull'

      - name: Verify starting base
        shell: bash
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git merge-base "${BASE_SHA}" HEAD)" = "${BASE_SHA}"

      - name: Apply full repository transformation
        run: python3 tools/full_ad_glasses_one_shot.py

      - name: Normalize source identifiers and filenames
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source_exts = {'.kt', '.java', '.swift', '.aidl'}

          for p in list(Path('.').rglob('*')):
              if not p.is_file() or p.suffix.lower() not in source_exts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = text.replace('AD_GLASSES', 'ADGlasses')
              if new != text:
                  p.write_text(new, encoding='utf-8')

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = [x.decode('utf-8', 'surrogateescape') for x in tracked if x]
          for old in sorted(paths, key=lambda x: (x.count('/'), len(x)), reverse=True):
              p = Path(old)
              if p.suffix.lower() not in source_exts or 'AD-Glasses' not in p.name or not p.exists():
                  continue
              new_name = p.name.replace('AD-Glasses', 'ADGlasses')
              new = p.with_name(new_name)
              subprocess.run(['git', 'mv', '-f', '--', str(p), str(new)], check=True)
          PY

      - name: Validate transformed tree
        shell: bash
        run: |
          git diff --check
          test -d android/AD-Glasses/app
          test -d android/AD-Glasses/shared
          grep -R --line-number --fixed-strings 'com.ad_glasses' \
            android/AD-Glasses/app/build.gradle \
            android/AD-Glasses/app/src \
            android/AD-Glasses/shared/src >/dev/null
          if git ls-files | grep -iE 'cyanbridge|fersaiyan|tasker'; then
            echo 'Forbidden legacy term remains in a tracked path.' >&2
            exit 1
          fi
          if git grep -nEi 'cyanbridge|fersaiyan|tasker' -- \
            ':!third_party/**' \
            ':!**/build/**' \
            ':!tools/full_ad_glasses_one_shot.py' \
            ':!.github/workflows/full-ad-glasses-one-shot.yml'; then
            echo 'Forbidden legacy term remains in tracked text.' >&2
            exit 1
          fi

      - name: Publish transformed tree to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: materialize AD Glasses repository rename [skip ci]'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/AD-Glasses/**/*.gradle*
            android/AD-Glasses/gradle/libs.versions.toml
            heycyan-core/**/*.gradle*

      - name: Install current Android CLI
        shell: bash
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo tee /etc/apt/keyrings/google.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] http://dl.google.com/android/cli/latest/debian/ stable main" \
            | sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y android-cli
          android update

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          android --sdk="$SDK_ROOT" sdk install \
            platforms/android-37 \
            build-tools/36.0.0 \
            cmake/3.22.1 \
            ndk/29.0.14206865 \
            platform-tools

      - name: Compile shared Android source
        id: shared_compile
        continue-on-error: true
        working-directory: android/AD-Glasses
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --warning-mode=all :shared:compileAndroidMain --stacktrace 2>&1 | tee /tmp/shared-compile.log

      - name: Publish shared compile failure
        if: steps.shared_compile.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '### Shared compile failure'
            echo '```text'
            grep -nE '(^e: | error: |Compilation error|FAILED|Exception)' /tmp/shared-compile.log | tail -n 140 || true
            echo
            tail -n 140 /tmp/shared-compile.log
            echo '```'
          } > /tmp/shared-compile-tail.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/shared-compile-tail.md
          exit 1

      - name: Run app unit tests
        id: app_tests
        continue-on-error: true
        working-directory: android/AD-Glasses
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --warning-mode=all :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/app-tests.log

      - name: Publish unit-test failure
        if: steps.app_tests.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '### App unit-test failure'
            echo '```text'
            tail -n 180 /tmp/app-tests.log
            echo '```'
          } > /tmp/app-tests-tail.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/app-tests-tail.md
          exit 1

      - name: Assemble debug APK
        id: assemble_debug
        continue-on-error: true
        working-directory: android/AD-Glasses
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --warning-mode=all :app:assembleDebug --stacktrace 2>&1 | tee /tmp/assemble-debug.log

      - name: Publish APK-build failure
        if: steps.assemble_debug.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '### Debug APK build failure'
            echo '```text'
            tail -n 180 /tmp/assemble-debug.log
            echo '```'
          } > /tmp/assemble-debug-tail.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/assemble-debug-tail.md
          exit 1

      - name: Verify branded APK
        run: test -f android/AD-Glasses/app/build/outputs/apk/debug/AD-Glasses.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v7
        with:
          name: AD-Glasses-debug
          path: android/AD-Glasses/app/build/outputs/apk/debug/AD-Glasses.apk
          if-no-files-found: error
          retention-days: 7

      - name: Replace branch with one final atomic commit
        shell: bash
        run: |
          starting_tip="$(git rev-parse HEAD)"
          rm -f tools/full_ad_glasses_one_shot.py
          rm -f .github/workflows/full-ad-glasses-one-shot.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree_sha="$(git write-tree)"
          final_sha="$(printf '%s\n\n%s\n' \
            'refactor: complete AD Glasses one-shot rebrand' \
            'Rename package ownership, source paths, Android project, URI scheme, branding, CI and docs; remove legacy automation integration and stale cleanup artifacts while preserving cloud/local assistant paths.' \
            | git commit-tree "$tree_sha" -p "$BASE_SHA")"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${starting_tip}" \
            origin "${final_sha}:refs/heads/${TARGET_BRANCH}"
          echo "FINAL_SHA=${final_sha}" >> "$GITHUB_ENV"

      - name: Confirm final branch shape
        shell: bash
        run: |
          git fetch origin "${TARGET_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "${FINAL_SHA}"
          test "$(git rev-parse "${FINAL_SHA}^")" = "${BASE_SHA}"
