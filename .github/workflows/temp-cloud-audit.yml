name: Temporary cloud architecture audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v7
        with:
          ref: cleanup/ad-glasses-cloud-rebrand
          fetch-depth: 0
          submodules: false
      - name: Apply cloud-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          CHAT_SCREEN='android/AD-Glasses/shared/src/commonMain/kotlin/com/ad_glasses/shared/ui/chat/ChatThreadScreen.kt'
          sed -i '/generated.resources.chat_configure_local_model/d; /generated.resources.chat_local_model_required/d' "$CHAT_SCREEN"
          python3 tools/temp_cloud_only_cleanup.py
          git diff --check
          echo '===== REMAINING LIVE LOCAL TEXT-LLM TOKENS ====='
          git grep -n -i -E 'local[ _-]?(llm|model|models)|localmodels|LOCAL_MODELS|LocalModelsProvider|CONFIGURE_LOCAL_MODEL|Gemma.*LLM' -- \
            android/AD-Glasses/app/src/main android/AD-Glasses/shared/src/commonMain || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finish Cloud-only AI architecture cleanup'
            git push origin HEAD:cleanup/ad-glasses-cloud-rebrand
          fi
