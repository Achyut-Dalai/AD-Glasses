name: Temporary final repo reference audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Apply final residual cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp_cleanup_residual_refs.py
          git diff --check

      - name: Verify strict legacy references are gone
        shell: bash
        run: |
          set -u
          echo '===== STRICT BRAND / PACKAGE ====='
          git grep -n -i -E 'cyan[ _-]?bridge|cyanbridge|fersaiyan|tasker' -- . \
            ':(exclude).github/workflows/temp-repo-reference-audit.yml' \
            ':(exclude)tools/temp_cleanup_legacy_refs.py' \
            ':(exclude)tools/temp_cleanup_locale_refs.py' \
            ':(exclude)tools/temp_cleanup_residual_refs.py' || true

          echo '===== RETIRED LIVE UI / IMPLEMENTATION ====='
          git grep -n -E 'CliRelayClient|CloudAiPrefs|GlassesAssistantMode|EXTERNAL_ASSISTANT|PRO_RELAY|CLI_RELAY|cbImageAsAssistant|btnModeGemini|btnModeChatgpt|btnModeInternal|compose_external_|dashboard_phone_assistant|dashboard_gemini_chatgpt_setup' -- . \
            ':(exclude).github/workflows/temp-repo-reference-audit.yml' \
            ':(exclude)tools/temp_cleanup_legacy_refs.py' \
            ':(exclude)tools/temp_cleanup_locale_refs.py' \
            ':(exclude)tools/temp_cleanup_residual_refs.py' || true

      - name: Upload corrected locale resources
        uses: actions/upload-artifact@v4
        with:
          name: final-locale-cleanup
          path: |
            android/AD-Glasses/shared/src/commonMain/composeResources/values-de/strings_extra.xml
            android/AD-Glasses/shared/src/commonMain/composeResources/values-es/strings_extra.xml
            android/AD-Glasses/shared/src/commonMain/composeResources/values-fr/strings_extra.xml
            android/AD-Glasses/shared/src/commonMain/composeResources/values-it/strings_extra.xml
            android/AD-Glasses/shared/src/commonMain/composeResources/values-ko/strings_extra.xml
            android/AD-Glasses/shared/src/commonMain/composeResources/values-pt-rBR/strings_extra.xml
            android/AD-Glasses/shared/src/commonMain/composeResources/values-ru/strings_extra.xml
            android/AD-Glasses/shared/src/commonMain/composeResources/values-zh-rCN/strings_extra.xml
          if-no-files-found: error
          retention-days: 1
