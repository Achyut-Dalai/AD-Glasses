name: Temporary final repo reference audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Final repo-wide legacy reference scan
        shell: bash
        run: |
          set -u
          EX1=':(exclude).github/workflows/temp-repo-reference-audit.yml'
          EX2=':(exclude)tools/temp_cleanup_legacy_refs.py'
          EX3=':(exclude)tools/temp_cleanup_locale_refs.py'
          EX4=':(exclude)tools/temp_cleanup_residual_refs.py'

          echo '===== STRICT BRAND / PACKAGE ====='
          git grep -n -i -E 'cyan[ _-]?bridge|cyanbridge|fersaiyan|tasker' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== RETIRED IMPLEMENTATION SYMBOLS / UI IDS ====='
          git grep -n -E 'CliRelayClient|CloudAiPrefs|GlassesAssistantMode|EXTERNAL_ASSISTANT|PRO_RELAY|CLI_RELAY|cbImageAsAssistant|btnModeGemini|btnModeChatgpt|btnModeInternal|compose_external_|dashboard_phone_assistant|dashboard_gemini_chatgpt_setup' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== CHATGPT / COMBINED GEMINI-CHATGPT REFERENCES ====='
          git grep -n -i -E 'chatgpt|chat[_ -]?gpt|gemini[^[:alnum:]]{0,8}chatgpt|gemini_chatgpt' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== CONSUMER ASSISTANT PACKAGES / HANDOFF COPY ====='
          git grep -n -i -E 'com\.openai\.chatgpt|com\.google\.android\.googlequicksearchbox|com\.google\.android\.apps\.bard|gemini app|phone assistant|external assistant|consumer assistant|assistant-app handoff|app handoff|phone-app handoff' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== OLD AUTOMATION SETUP LANGUAGE ====='
          git grep -n -i -E 'AutoInput|automation profile|external automation|accessibility submission|choose default phone assistant' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== COMBINED SETUP IDS OUTSIDE TRANSLATION DEFINITIONS ====='
          git grep -n -E 'dashboard_gemini_chatgpt_setup|dashboard_phone_assistant' -- . "$EX1" "$EX2" "$EX3" "$EX4" \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-de/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-es/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-fr/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-it/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-ko/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-pt-rBR/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-ru/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-zh-rCN/strings_extra.xml' || true

          echo '===== INTENTIONAL MIGRATION WIRE TOKENS ====='
          git grep -n -E 'PHONE_ASSISTANT|CUSTOM_AI_PROVIDER|phone_assistant|default_assistant|"gemini"|"chatgpt"' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== GENERIC HARDWARE COMPANION APP REFERENCES ====='
          git grep -n -i -E 'companion app' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== DIRECT META DAT SDK IMPORTS ====='
          git grep -n -E 'com\.meta\.wearable|Wearables\.|PermissionStatus|Permission\.CAMERA' -- android/AD-Glasses/app/src/main || true

          echo '===== META MANAGER CONSUMERS ====='
          git grep -n -E 'MetaRaybanManager|CapturedPhoto|RegistrationState|DeviceSessionState|StreamState' -- android/AD-Glasses/app/src/main ':!android/AD-Glasses/app/src/main/java/com/ad_glasses/devices/metarayban/MetaRaybanManager.kt' || true

          echo '===== DIRECT MYVU IMPORTS ====='
          git grep -n -E 'com\.myvu\.|ConnectionManager|ConnectionState' -- android/AD-Glasses/app/src/main ':!android/AD-Glasses/app/src/main/myvu-upstream' || true

          echo '===== MYVU SUBMODULE STATUS ====='
          git submodule status android/AD-Glasses/app/src/main/myvu-upstream || true
