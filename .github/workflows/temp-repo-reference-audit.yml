name: Temporary final repo reference audit

on:
  push:
    branches:
      - fix/repo-wide-legacy-reference-cleanup
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/repo-wide-legacy-reference-cleanup
          submodules: false
          fetch-depth: 0

      - name: Apply residual legacy cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp_cleanup_residual_refs.py
          git diff --check

          EX1=':(exclude).github/workflows/temp-repo-reference-audit.yml'
          EX2=':(exclude)tools/temp_cleanup_legacy_refs.py'
          EX3=':(exclude)tools/temp_cleanup_locale_refs.py'
          EX4=':(exclude)tools/temp_cleanup_residual_refs.py'

          ! git grep -n -i -E 'cyan[ _-]?bridge|cyanbridge|fersaiyan|tasker' -- . "$EX1" "$EX2" "$EX3" "$EX4"
          ! git grep -n -E 'CliRelayClient|CloudAiPrefs|GlassesAssistantMode|EXTERNAL_ASSISTANT|PRO_RELAY|CLI_RELAY|cbImageAsAssistant|btnModeGemini|btnModeChatgpt|btnModeInternal|compose_external_|dashboard_phone_assistant' -- . "$EX1" "$EX2" "$EX3" "$EX4"
          ! git grep -n -i -E 'AutoInput|automation profile|external automation|accessibility submission|choose default phone assistant' -- . "$EX1" "$EX2" "$EX3" "$EX4"

      - name: Commit residual cleanup if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/temp-repo-reference-audit.yml tools/temp_cleanup_legacy_refs.py tools/temp_cleanup_locale_refs.py tools/temp_cleanup_residual_refs.py
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'chore: remove residual legacy automation references'
            git push origin HEAD:fix/repo-wide-legacy-reference-cleanup
          else
            echo 'No residual cleanup changes remain.'
          fi

      - name: Report intentional migration and hardware-companion references
        shell: bash
        run: |
          set -u
          EX1=':(exclude).github/workflows/temp-repo-reference-audit.yml'
          EX2=':(exclude)tools/temp_cleanup_legacy_refs.py'
          EX3=':(exclude)tools/temp_cleanup_locale_refs.py'
          EX4=':(exclude)tools/temp_cleanup_residual_refs.py'

          echo '===== CONSUMER ASSISTANT RETIREMENT GUARDRAILS ====='
          git grep -n -i -E 'consumer assistant|assistant-app handoff|phone-app handoff' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== MIGRATION WIRE TOKENS ====='
          git grep -n -E 'PHONE_ASSISTANT|CUSTOM_AI_PROVIDER|phone_assistant|default_assistant|"gemini"|"chatgpt"' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== GENERIC HARDWARE COMPANION APP REFERENCES ====='
          git grep -n -i -E 'companion app' -- . "$EX1" "$EX2" "$EX3" "$EX4" || true

          echo '===== DIRECT META DAT SDK IMPORTS ====='
          git grep -n -E 'com\.meta\.wearable|Wearables\.|PermissionStatus|Permission\.CAMERA' -- android/AD-Glasses/app/src/main || true

          echo '===== META MANAGER CONSUMERS ====='
          git grep -n -E 'MetaRaybanManager|CapturedPhoto|RegistrationState|DeviceSessionState|StreamState' -- android/AD-Glasses/app/src/main ':!android/AD-Glasses/app/src/main/java/com/ad_glasses/devices/metarayban/MetaRaybanManager.kt' || true

          echo '===== DIRECT MYVU IMPORTS ====='
          git grep -n -E 'com\.myvu\.|ConnectionManager|ConnectionState' -- android/AD-Glasses/app/src/main ':!android/AD-Glasses/app/src/main/myvu-upstream' || true

          echo '===== MYVU SUBMODULE STATUS ====='
          git submodule status android/AD-Glasses/app/src/main/myvu-upstream || true
