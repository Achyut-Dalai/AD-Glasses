name: Temporary final repo reference audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Final repo-wide legacy reference scan
        shell: bash
        run: |
          set -u
          EX1=':(exclude).github/workflows/temp-repo-reference-audit.yml'
          EX2=':(exclude)tools/temp_cleanup_legacy_refs.py'
          EX3=':(exclude)tools/temp_cleanup_locale_refs.py'

          echo '===== STRICT BRAND / PACKAGE ====='
          git grep -n -i -E 'cyan[ _-]?bridge|cyanbridge|fersaiyan|tasker' -- . "$EX1" "$EX2" "$EX3" || true

          echo '===== RETIRED IMPLEMENTATION SYMBOLS ====='
          git grep -n -E 'CliRelayClient|CloudAiPrefs|GlassesAssistantMode|EXTERNAL_ASSISTANT|PRO_RELAY|CLI_RELAY|cbImageAsAssistant|btnModeGemini|btnModeChatgpt|btnModeInternal|compose_external_' -- . "$EX1" "$EX2" "$EX3" || true

          echo '===== CONSUMER ASSISTANT PACKAGES / HANDOFF COPY ====='
          git grep -n -i -E 'com\.openai\.chatgpt|com\.google\.android\.googlequicksearchbox|com\.google\.android\.apps\.bard|chatgpt app|gemini app|phone assistant|external assistant|consumer assistant|assistant handoff|app handoff|phone-app handoff' -- . "$EX1" "$EX2" "$EX3" || true

          echo '===== OLD AUTOMATION SETUP LANGUAGE ====='
          git grep -n -i -E 'AutoInput|automation profile|external automation|accessibility submission|choose default phone assistant' -- . "$EX1" "$EX2" "$EX3" || true

          echo '===== SUSPECT SHARED RESOURCE IDS ====='
          git grep -n -E 'plugins_open_external|publish_external_source_link|publish_external_source_hint|dashboard_phone_assistant' -- . "$EX1" "$EX2" "$EX3" || true

          echo '===== SUSPECT IDS OUTSIDE TRANSLATION DEFINITIONS ====='
          git grep -n -E 'plugins_open_external|publish_external_source_link|publish_external_source_hint|dashboard_phone_assistant' -- . "$EX1" "$EX2" "$EX3" \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-de/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-es/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-fr/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-it/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-ko/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-pt-rBR/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-ru/strings_extra.xml' \
            ':(exclude)android/AD-Glasses/shared/src/commonMain/composeResources/values-zh-rCN/strings_extra.xml' || true

          echo '===== MIGRATION WIRE TOKENS (review, do not auto-delete) ====='
          git grep -n -E 'PHONE_ASSISTANT|CUSTOM_AI_PROVIDER|phone_assistant|default_assistant|"gemini"|"chatgpt"' -- . "$EX1" "$EX2" "$EX3" || true

          echo '===== GENERIC COMPANION APP REFERENCES ====='
          git grep -n -i -E 'companion app' -- . "$EX1" "$EX2" "$EX3" || true
