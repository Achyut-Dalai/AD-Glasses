name: Temporary repo reference cleanup

on:
  push:
    branches:
      - fix/repo-wide-legacy-reference-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/repo-wide-legacy-reference-cleanup
          submodules: false
          fetch-depth: 0

      - name: Apply deterministic reviewed cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp_cleanup_legacy_refs.py
          python3 tools/temp_cleanup_locale_refs.py
          git diff --check

          echo '===== STRICT RESIDUAL CHECK ====='
          if git grep -n -i -E 'cyan[ _-]?bridge|cyanbridge|fersaiyan|tasker' -- . \
            ':(exclude).github/workflows/temp-repo-reference-audit.yml' \
            ':(exclude)tools/temp_cleanup_legacy_refs.py' \
            ':(exclude)tools/temp_cleanup_locale_refs.py'; then
            echo 'Strict legacy brand/package reference remains.' >&2
            exit 1
          fi
          if git grep -n -E 'CliRelayClient|CloudAiPrefs|GlassesAssistantMode|EXTERNAL_ASSISTANT|PRO_RELAY|CLI_RELAY|cbImageAsAssistant|btnModeGemini|btnModeChatgpt|btnModeInternal|compose_external_' -- . \
            ':(exclude).github/workflows/temp-repo-reference-audit.yml' \
            ':(exclude)tools/temp_cleanup_legacy_refs.py' \
            ':(exclude)tools/temp_cleanup_locale_refs.py'; then
            echo 'Retired assistant/relay implementation reference remains.' >&2
            exit 1
          fi

          git diff --name-only > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          test -s /tmp/changed-files.txt

      - name: Commit reviewed cleanup only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/temp-repo-reference-audit.yml tools/temp_cleanup_legacy_refs.py tools/temp_cleanup_locale_refs.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'chore: remove remaining legacy assistant and CyanBridge references'
          git push origin HEAD:fix/repo-wide-legacy-reference-cleanup
