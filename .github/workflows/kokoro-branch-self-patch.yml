name: Kokoro no-Android-TTS branch verifier

on:
  push:
    branches:
      - fix/kokoro-no-android-tts

permissions:
  contents: write
  packages: read

concurrency:
  group: kokoro-no-android-tts-self-patch
  cancel-in-progress: true

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v7
        with:
          ref: fix/kokoro-no-android-tts
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Materialize submodule LFS files
        shell: bash
        run: |
          git lfs install --local
          git submodule foreach --recursive 'git lfs install --local && git lfs pull'

      - name: Apply Kokoro-only speech migrations
        shell: bash
        run: |
          # MainActivity is transformed first. LocalAgent has one device-unavailable stop site
          # outside its legacy speech block, so normalize that site before running its strict helper.
          python3 tools/finish_kokoro_main_activity.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/AD-Glasses/app/src/main/java/com/ad_glasses/localagent/LocalAgentService.kt')
          text = path.read_text(encoding='utf-8')
          old = '        runCatching { tts?.stop() }\n'
          new = '        KokoroSpeechService.get(applicationContext).stop()\n'
          if old not in text:
              raise SystemExit('Could not find LocalAgent unavailable-device Android speech stop')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/finish_kokoro_local_agent.py

      - name: Verify first-party Android platform TTS is absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'import android\.speech\.tts|TextToSpeech\.|TextToSpeech\(|UtteranceProgressListener' \
              android/AD-Glasses/app/src/main/java \
              android/AD-Glasses/app/src/myvu-stub/java \
              android/AD-Glasses/shared/src; then
            echo 'Android platform TextToSpeech runtime references remain in compiled first-party sources' >&2
            exit 1
          fi
          grep -q 'exclude("com/myvu/client/ai/TtsPlayer.java")' android/AD-Glasses/app/build.gradle
          test -f android/AD-Glasses/app/src/main/java/com/myvu/client/ai/TtsPlayer.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/AD-Glasses/**/*.gradle*
            android/AD-Glasses/gradle/libs.versions.toml
            heycyan-core/**/*.gradle*

      - name: Install current Android CLI
        shell: bash
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo tee /etc/apt/keyrings/google.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] http://dl.google.com/android/cli/latest/debian/ stable main" \
            | sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y android-cli
          android update

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          android --sdk="$SDK_ROOT" sdk install \
            platforms/android-37 \
            build-tools/36.0.0 \
            cmake/3.22.1 \
            ndk/29.0.14206865 \
            platform-tools

      - name: Verify sherpa Android classpath is not duplicated
        working-directory: android/AD-Glasses
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > /tmp/debug-runtime.txt
          grep -i 'sherpa-onnx' /tmp/debug-runtime.txt || true
          if grep -q 'sherpa-onnx-jvm' /tmp/debug-runtime.txt; then
            echo 'sherpa-onnx-jvm is still present in the Android runtime classpath' >&2
            exit 1
          fi

      - name: Verify generated MYVU source excludes platform TTS player
        working-directory: android/AD-Glasses
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:syncMyvuSources
          test ! -f app/build/generated/myvu-upstream/java/com/myvu/client/ai/TtsPlayer.java
          if grep -RInE 'import android\.speech\.tts|TextToSpeech\.|TextToSpeech\(|UtteranceProgressListener' \
              app/build/generated/myvu-upstream/java; then
            echo 'Android platform TextToSpeech leaked into generated MYVU compiled sources' >&2
            exit 1
          fi

      - name: Assemble Android debug APK
        working-directory: android/AD-Glasses
        shell: bash
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Commit verified speech migration
        shell: bash
        run: |
          paths=(
            android/AD-Glasses/app/build.gradle
            android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt
            android/AD-Glasses/app/src/main/java/com/ad_glasses/localagent/LocalAgentService.kt
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No generated migration diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Finish Kokoro-only Android speech migration'
          git push origin HEAD:fix/kokoro-no-android-tts
