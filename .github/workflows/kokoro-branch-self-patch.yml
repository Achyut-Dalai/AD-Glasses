name: Kokoro branch self patch

on:
  push:
    branches:
      - feat/kokoro-heart-voice

permissions:
  contents: write

concurrency:
  group: kokoro-branch-self-patch
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kokoro-heart-voice
          fetch-depth: 0

      - name: Apply Kokoro-only MainActivity migration
        run: python3 tools/finish_kokoro_main_activity.py

      - name: Verify platform TTS is absent from app runtime sources
        run: |
          if grep -RInE 'android\.speech\.tts|TextToSpeech|UtteranceProgressListener' android/AD-Glasses/app/src/main android/AD-Glasses/shared/src; then
            echo 'Platform TextToSpeech references remain' >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Android app Kotlin
        working-directory: android/AD-Glasses
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit migrated activity
        run: |
          if git diff --quiet; then
            echo 'No migration diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt
          git commit -m 'Complete Kokoro-only assistant voice migration'
          git push origin HEAD:feat/kokoro-heart-voice
