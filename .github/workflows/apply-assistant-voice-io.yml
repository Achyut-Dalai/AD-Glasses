name: Apply assistant voice IO patch

on:
  push:
    branches:
      - fix/provider-managed-cloud-endpoints
    paths:
      - .github/workflows/apply-assistant-voice-io.yml
      - scripts/apply_assistant_voice_io_patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Patch MainActivity voice IO
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/provider-managed-cloud-endpoints
          fetch-depth: 0

      - name: Apply asserted source patch
        run: python3 scripts/apply_assistant_voice_io_patch.py

      - name: Validate diff
        run: git diff --check

      - name: Commit MainActivity patch
        shell: bash
        run: |
          if git diff --quiet -- android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt; then
            echo "MainActivity already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt
          git commit -m "Wire Android assistant voice I/O and latency tracing"
          git push origin HEAD:fix/provider-managed-cloud-endpoints
