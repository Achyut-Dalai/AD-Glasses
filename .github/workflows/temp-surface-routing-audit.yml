name: Temporary surface routing cleanup

on:
  push:
    branches:
      - fix/post-merge-surface-routing-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7
        with:
          ref: fix/post-merge-surface-routing-cleanup
          fetch-depth: 1
      - name: Apply surface cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp_surface_cleanup.py
          git diff --check

          echo '===== RETIRED SOURCES / INTENTS ====='
          test ! -e android/AD-Glasses/app/src/main/java/com/ad_glasses/ui/adglasses/ADNativeAiScreen.kt
          test ! -e android/AD-Glasses/app/src/main/java/com/ad_glasses/ai/runtime/ADIntelligencePrefs.kt
          if git grep -n -F 'AssistantIntent.EXECUTE_UI_TASK' -- android/AD-Glasses/app/src/main; then
            echo 'retired EXECUTE_UI_TASK still present' >&2
            exit 1
          fi

          echo '===== HOME SUGGESTION RESIDUE ====='
          if git grep -n -i -E 'try asking|starter prompt|prompt chip|quick prompt' -- android/AD-Glasses/app/src/main android/AD-Glasses/app/src/main/res; then
            echo 'removed Home suggestion residue remains' >&2
            exit 1
          fi

          echo '===== CURRENT VISUAL ASSETS ====='
          test -s android/AD-Glasses/app/src/main/res/drawable-nodpi/ad_glasses_hero_v4.png
          test -s android/AD-Glasses/app/src/main/res/drawable-nodpi/ad_glasses_icon_source.png
          test -s android/AD-Glasses/app/src/main/res/drawable-nodpi/ad_lens_shutter.png

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Clean removed UI assets and stale routes'
            git push origin HEAD:fix/post-merge-surface-routing-cleanup
          fi
