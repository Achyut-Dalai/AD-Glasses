name: Temporary feature removal audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v7
        with:
          ref: fix/post-merge-cleanup
          fetch-depth: 1
      - name: Apply complete feature cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp_remove_diary_timeline.py
          git diff --check
          echo '===== REMAINING LIVE FEATURE TOKENS ====='
          git grep -n -i -E 'daynote|day note|autodiary|auto diary|visualdiary|visual diary|visual_diary' -- \
            android/AD-Glasses/app/src/main \
            android/AD-Glasses/shared/src/commonMain || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Timeline and Diary features completely'
            git push origin HEAD:fix/post-merge-cleanup
          fi
