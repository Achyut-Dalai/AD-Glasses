name: Temporary feature removal audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Audit removed features and chat routes
        shell: bash
        run: |
          set -u
          echo '===== LIVE TIMELINE / DIARY RESIDUE ====='
          git grep -n -i -E 'daynote|day note|autodiary|auto diary|visualdiary|visual diary|timeline|diary' -- \
            android/AD-Glasses/app/src/main \
            android/AD-Glasses/shared/src \
            ':!android/AD-Glasses/app/src/main/myvu-upstream/**' || true
          echo '===== WHOLE-REPO TIMELINE / DIARY RESIDUE ====='
          git grep -n -i -E 'daynote|day note|autodiary|auto diary|visualdiary|visual diary|timeline|diary' -- . \
            ':!third_party/**' \
            ':!android/AD-Glasses/app/src/main/myvu-upstream/**' \
            ':!.github/workflows/temp-feature-removal-audit.yml' || true
          echo '===== CHAT ROUTES / CLEAR CHAT ====='
          git grep -n -E 'ChatListActivity|ChatThreadActivity|ADConversationsRedirectActivity|clear.*chat|Clear.*chat|conversation.*clear|clear.*conversation|CONVERSATIONS|Conversations' -- android/AD-Glasses || true
          echo '===== REMOVED FEATURE SOURCE PATHS ====='
          find android/AD-Glasses/app/src/main -type f \( -iname '*diary*' -o -iname '*timeline*' -o -iname '*daynote*' \) -print || true
