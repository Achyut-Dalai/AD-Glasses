name: Temporary cloud AI cleanup

on:
  push:
    branches:
      - cleanup/ad-glasses-cloud-rebrand

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v7
        with:
          ref: cleanup/ad-glasses-cloud-rebrand
          fetch-depth: 1
          submodules: false

      - name: Apply Cloud-only migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/temp_cloud_cleanup.py
          rm -f tools/cloud_ai_audit_report.txt
          rm -f .github/cloud-cleanup-trigger.txt
          rm -f .github/temp_cloud_cleanup.py
          rm -f .github/workflows/temp-cloud-ai-audit.yml
          git diff --check

          echo 'Checking live source for retired Local LLM/runtime symbols...'
          if git grep -n -E 'com\.ad_glasses\.localmodels|LocalModelsProvider|LocalModelsConfigure|GemmaLiteRt|TranscriptionEngine\.GEMMA|LlamaCppLocalEngine|LiteRtLocalEngine|litertlm-android|llamacpp-kotlin|localLlamaRuntimeAarPath' -- \
              android/AD-Glasses/app/src/main \
              android/AD-Glasses/shared/src/commonMain \
              android/AD-Glasses/app/build.gradle \
              ':!android/AD-Glasses/app/src/main/myvu-upstream/**'; then
            echo 'Retired Local LLM references remain in live source.' >&2
            exit 1
          fi

          echo 'Checking tracked files for obvious API-secret shapes (filenames only)...'
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          patterns = [
              re.compile(rb'AIza[0-9A-Za-z_-]{20,}'),
              re.compile(rb'sk-[A-Za-z0-9_-]{20,}'),
          ]
          bad = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = Path(raw.decode())
              if str(path).startswith('third_party/') or 'myvu-upstream/' in str(path):
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if any(p.search(data) for p in patterns):
                  bad.append(str(path))
          if bad:
              print('Secret-like value detected in tracked files:')
              for path in bad:
                  print(path)
              raise SystemExit(1)
          print('No obvious tracked API-token patterns found.')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finish Cloud-only AI migration'
            git push origin HEAD:cleanup/ad-glasses-cloud-rebrand
          fi
