name: Temporary cloud AI cleanup

on:
  push:
    branches:
      - cleanup/ad-glasses-cloud-rebrand

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v7
        with:
          ref: cleanup/ad-glasses-cloud-rebrand
          fetch-depth: 1
          submodules: false

      - name: Apply Cloud-only migration
        shell: bash
        run: |
          set -u
          mkdir -p tools
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/temp_cloud_cleanup.py')
          value = path.read_text()
          value = value.replace('if (ROOT.joinpath(daily).exists():', 'if ROOT.joinpath(daily).exists():')
          value = value.replace('if (ROOT.joinpath(wrappers).exists():', 'if ROOT.joinpath(wrappers).exists():')
          path.write_text(value)
          PY
          status=0
          python3 .github/temp_cloud_cleanup.py > tools/cloud_cleanup_diagnostics.txt 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f tools/cloud_cleanup_diagnostics.txt
            git commit -m 'Capture Cloud cleanup failure diagnostics'
            git push origin HEAD:cleanup/ad-glasses-cloud-rebrand
            exit "$status"
          fi

          rm -f tools/cloud_cleanup_diagnostics.txt
          rm -f tools/cloud_ai_audit_report.txt
          rm -f .github/cloud-cleanup-trigger.txt
          rm -f .github/temp_cloud_cleanup.py
          rm -f .github/workflows/temp-cloud-ai-audit.yml
          git diff --check || exit 1

          if git grep -n -E 'com\.ad_glasses\.localmodels|LocalModelsProvider|LocalModelsConfigure|GemmaLiteRt|TranscriptionEngine\.GEMMA|LlamaCppLocalEngine|LiteRtLocalEngine|litertlm-android|llamacpp-kotlin|localLlamaRuntimeAarPath' -- \
              android/AD-Glasses/app/src/main \
              android/AD-Glasses/shared/src/commonMain \
              android/AD-Glasses/app/build.gradle \
              ':!android/AD-Glasses/app/src/main/myvu-upstream/**' > tools/cloud_cleanup_diagnostics.txt; then
            echo 'Retired Local LLM references remain in live source.' >> tools/cloud_cleanup_diagnostics.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f tools/cloud_cleanup_diagnostics.txt
            git commit -m 'Capture Cloud cleanup residue diagnostics'
            git push origin HEAD:cleanup/ad-glasses-cloud-rebrand
            exit 1
          fi
          rm -f tools/cloud_cleanup_diagnostics.txt

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          patterns = [re.compile(rb'AIza[0-9A-Za-z_-]{20,}'), re.compile(rb'sk-[A-Za-z0-9_-]{20,}')]
          bad = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = Path(raw.decode())
              if str(path).startswith('third_party/') or 'myvu-upstream/' in str(path):
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if any(p.search(data) for p in patterns):
                  bad.append(str(path))
          if bad:
              Path('tools/cloud_cleanup_diagnostics.txt').write_text('Secret-like value detected in tracked files (filenames only):\n' + '\n'.join(bad) + '\n')
              raise SystemExit(1)
          PY
          if [ -f tools/cloud_cleanup_diagnostics.txt ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f tools/cloud_cleanup_diagnostics.txt
            git commit -m 'Capture Cloud secret-scan diagnostics'
            git push origin HEAD:cleanup/ad-glasses-cloud-rebrand
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finish Cloud-only AI migration'
            git push origin HEAD:cleanup/ad-glasses-cloud-rebrand
          fi
