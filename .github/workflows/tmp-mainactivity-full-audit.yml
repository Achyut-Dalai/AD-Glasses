name: Temporary MainActivity audit repair

on:
  push:
    branches:
      - fix/mainactivity-full-audit

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/mainactivity-full-audit
          fetch-depth: 0

      - name: Apply audited MainActivity fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt')
          text = path.read_text(encoding='utf-8')
          if 'private fun discardTtsUtterance' in text:
              print('MainActivity audit repair already applied')
              raise SystemExit(0)

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          def regex_once(pattern: str, replacement: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, found {count}')

          replace_once('import android.os.Environment\n', '', 'remove dead Environment import')
          replace_once('    private var isImageAssistantMode = true // Use assistant vs share intent\n', '', 'remove retired image assistant mode')
          replace_once('    private var lastImageQueryAtMs: Long = 0L\n', '', 'remove timestamp debounce state')
          replace_once(
              '        if (!callbackIntent.data?.scheme.equals("ADGlasses", ignoreCase = true)) return false',
              '        if (!callbackIntent.data?.scheme.equals("ad-glasses", ignoreCase = true)) return false',
              'fix Meta callback URI scheme',
          )

          # Retired consumer-assistant UI state had no effect on routing after the Cloud/Local migration.
          regex_once(
              r'\n        binding\.cbImageAsAssistant\.isChecked = isImageAssistantMode\n'
              r'        binding\.cbImageAsAssistant\.text = if \(isImageAssistantMode\) "Direct Assistant" else "App Sharing"\n'
              r'\s*\n'
              r'        binding\.cbImageAsAssistant\.setOnCheckedChangeListener \{ _, isChecked ->\n'
              r'            isImageAssistantMode = isChecked\n'
              r'            val modeName = if \(isChecked\) "Direct Assistant" else "App Sharing"\n'
              r'            binding\.cbImageAsAssistant\.text = modeName\n'
              r'            Toast\.makeText\(this, "Image Hijack: \$modeName", Toast\.LENGTH_SHORT\)\.show\(\)\n'
              r'        \}\n',
              '\n',
              'remove retired Direct Assistant/App Sharing listener',
          )

          # Route all TTS completion through one once-only callback remover and explicitly discard
          # interrupted callbacks so QUEUE_FLUSH cannot leave stale follow-up closures behind.
          text = text.replace('utteranceId?.let { ttsDoneCallbacks.remove(it)?.invoke() }', 'completeTtsUtterance(utteranceId)')
          replace_once(
              '''            override fun onError(utteranceId: String?, errorCode: Int) {
                localSpeechSessionManager.speechQueueController.onUtteranceError(utteranceId, errorCode)
                Log.w("ImageQuestionAudio", "TTS failed id=$utteranceId errorCode=$errorCode")
                completeTtsUtterance(utteranceId)
            }
''',
              '''            override fun onError(utteranceId: String?, errorCode: Int) {
                localSpeechSessionManager.speechQueueController.onUtteranceError(utteranceId, errorCode)
                Log.w("ImageQuestionAudio", "TTS failed id=$utteranceId errorCode=$errorCode")
                completeTtsUtterance(utteranceId)
            }

            override fun onStop(utteranceId: String?, interrupted: Boolean) {
                localSpeechSessionManager.speechQueueController.onUtteranceError(utteranceId)
                Log.i("ImageQuestionAudio", "TTS stopped id=$utteranceId interrupted=$interrupted")
                discardTtsUtterance(utteranceId)
            }
''',
              'add TTS stop cleanup',
          )
