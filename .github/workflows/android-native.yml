name: Android Native

on:
  push:
    branches: [main]
    paths:
      - 'android/AD-Glasses/**'
      - 'android/AGENTS.md'
      - '.github/workflows/android-native.yml'
  pull_request:
    paths:
      - 'android/AD-Glasses/**'
      - 'android/AGENTS.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install current Android CLI
        shell: bash
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo tee /etc/apt/keyrings/google.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] http://dl.google.com/android/cli/latest/debian/ stable main" \
            | sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y android-cli
          android update
      - name: Install Android SDK 37
        shell: bash
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          android --sdk="$SDK_ROOT" sdk install \
            platforms/android-37 \
            build-tools/36.0.0 \
            platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        working-directory: android/AD-Glasses
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ad-glasses-android-debug
          path: android/AD-Glasses/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
