name: Android Native

on:
  push:
    branches: [main]
    paths:
      - 'android/AD-Glasses/**'
      - 'android/AGENTS.md'
      - '.github/workflows/android-native.yml'
  pull_request:
    paths:
      - 'android/AD-Glasses/**'
      - 'android/AGENTS.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: yes | sdkmanager 'platforms;android-37' 'build-tools;36.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        working-directory: android/AD-Glasses
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ad-glasses-android-debug
          path: android/AD-Glasses/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
