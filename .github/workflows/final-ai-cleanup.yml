name: Final AI cleanup

on:
  push:
    branches: [cleanup/ai-architecture-final]
    paths: [.github/workflows/final-ai-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ai-architecture-final
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply cleanup
        run: python tools/final_ai_cleanup.py
      - name: Compile and test with diagnostics
        id: gradle
        continue-on-error: true
        working-directory: android/CyanBridge
        run: |
          set +e
          ./gradlew --no-daemon test > ../../cleanup-build.log 2>&1
          TEST_STATUS=$?
          ./gradlew --no-daemon :app:assembleDebug >> ../../cleanup-build.log 2>&1
          BUILD_STATUS=$?
          echo "test_status=$TEST_STATUS" >> ../../cleanup-build.log
          echo "build_status=$BUILD_STATUS" >> ../../cleanup-build.log
          test $TEST_STATUS -eq 0 -a $BUILD_STATUS -eq 0
      - name: Remove one-shot tooling
        run: rm -f tools/final_ai_cleanup.py .github/workflows/final-ai-cleanup.yml
      - name: Commit cleanup and diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'cleanup: remove legacy assistant and subscription stack'
          git push origin HEAD:cleanup/ai-architecture-final
