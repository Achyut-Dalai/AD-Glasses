name: Final AI cleanup

on:
  push:
    branches: [cleanup/ai-architecture-final]
    paths: [.github/workflows/final-ai-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ai-architecture-final
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply cleanup
        run: python tools/final_ai_cleanup.py
      - name: Compile and test
        working-directory: android/CyanBridge
        run: |
          ./gradlew --no-daemon test
          ./gradlew --no-daemon :app:assembleDebug
      - name: Remove one-shot tooling
        run: rm -f tools/final_ai_cleanup.py .github/workflows/final-ai-cleanup.yml
      - name: Commit validated cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'cleanup: remove legacy assistant and subscription stack'
          git push origin HEAD:cleanup/ai-architecture-final
