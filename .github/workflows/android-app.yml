name: Android app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-app.yml
      - android/AD-Glasses/**
      - heycyan-core/**
      - third_party/moonshine/**
  push:
    branches:
      - main
      - "agent/**"
      - "ui/**"
      - "codex/**"
      - "fix/**"
    paths:
      - .github/workflows/android-app.yml
      - android/AD-Glasses/**
      - heycyan-core/**
      - third_party/moonshine/**

permissions:
  contents: write
  packages: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test AD Glasses
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: fix/android-resource-repair
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Materialize submodule LFS files
        shell: bash
        run: |
          git lfs install --local
          git submodule foreach --recursive 'git lfs install --local && git lfs pull'

      - name: Migrate retired assistant dashboard UI
        if: github.event.pull_request.head.ref == 'fix/android-resource-repair' || github.ref == 'refs/heads/fix/android-resource-repair'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('android/AD-Glasses')
          screen = root / 'shared/src/commonMain/kotlin/com/ad_glasses/shared/ui/glasses/GlassesDashboardScreen.kt'
          strings = root / 'shared/src/commonMain/composeResources/values/strings_extra.xml'

          text = screen.read_text(encoding='utf-8')
          text = text.replace('import com.ad_glasses.shared.glasses.GlassesAssistantMode\n', '')

          controls = text.index('private fun GlassesAssistantControls(')
          row_marker = '        Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {'
          row_start = text.index(row_marker, controls)
          action_start = text.index('        ActionRow(', row_start)
          text = text[:row_start] + text[action_start:]

          controls = text.index('private fun GlassesAssistantControls(')
          diagnostics_marker = '        OutlinedButton(\n            onClick = { onAction(GlassesDashboardAction.OpenExternalImageAutomationDiagnostics) },'
          diagnostics_start = text.index(diagnostics_marker, controls)
          next_function_marker = '@Composable\nprivate fun AiWakeWordRouteControls('
          next_function = text.index(next_function_marker, diagnostics_start)
          controls_tail = text.rfind('    }\n}\n\n', diagnostics_start, next_function)
          if controls_tail < 0:
              raise SystemExit('Could not locate assistant controls closing braces')
          text = text[:diagnostics_start] + text[controls_tail:]

          helper_start = text.index('@Composable\nprivate fun AssistantModeChip(')
          meta_start = text.index('@Composable\nprivate fun MetaRaybanControls(', helper_start)
          text = text[:helper_start] + text[meta_start:]

          retired = (
              'GlassesAssistantMode',
              'assistantMode',
              'OpenExternalImageAutomationDiagnostics',
              'SelectAssistantMode',
              'dashboard_gemini_chatgpt_setup',
              'dashboard_phone_assistant',
              'dashboard_custom_provider',
          )
          remaining = [token for token in retired if token in text]
          if remaining:
              raise SystemExit('Retired assistant dashboard references remain: ' + ', '.join(remaining))
          screen.write_text(text, encoding='utf-8')

          string_text = strings.read_text(encoding='utf-8')
          for name in (
              'dashboard_phone_assistant',
              'dashboard_custom_provider',
              'dashboard_gemini_chatgpt_setup',
          ):
              string_text = re.sub(
                  rf'^\s*<string name="{name}">.*?</string>\n?',
                  '',
                  string_text,
                  count=1,
                  flags=re.MULTILINE,
              )
          strings.write_text(string_text, encoding='utf-8')
          PY
          git diff --check
          git status --short -- android/AD-Glasses

      - name: Commit forward-only dashboard migration
        if: github.event.pull_request.head.ref == 'fix/android-resource-repair' || github.ref == 'refs/heads/fix/android-resource-repair'
        shell: bash
        run: |
          git add -- android/AD-Glasses/shared/src/commonMain/kotlin/com/ad_glasses/shared/ui/glasses/GlassesDashboardScreen.kt \
                     android/AD-Glasses/shared/src/commonMain/composeResources/values/strings_extra.xml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: remove retired assistant-mode dashboard UI'
            git push origin HEAD:fix/android-resource-repair
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/AD-Glasses/**/*.gradle*
            android/AD-Glasses/gradle/libs.versions.toml
            heycyan-core/**/*.gradle*

      - name: Install current Android CLI
        shell: bash
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo tee /etc/apt/keyrings/google.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] http://dl.google.com/android/cli/latest/debian/ stable main" \
            | sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y android-cli
          android update
          android --version

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          android --sdk="$SDK_ROOT" sdk install \
            platforms/android-37 \
            build-tools/36.0.0 \
            cmake/3.22.1 \
            ndk/29.0.14206865 \
            platform-tools
          android --sdk="$SDK_ROOT" sdk list '^(platforms/android-37|build-tools/36\.0\.0|cmake/3\.22\.1|ndk/29\.0\.14206865|platform-tools)$' --all-versions

      - name: Compile shared Android source
        working-directory: android/AD-Glasses
        shell: bash
        run: ./gradlew --no-daemon --warning-mode=all :shared:compileAndroidMain --stacktrace

      - name: Run app unit tests
        working-directory: android/AD-Glasses
        shell: bash
        run: |
          set +e
          mkdir -p build/ci
          ./gradlew --no-daemon --warning-mode=all :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/ad-gradle-unit.log
          status=${PIPESTATUS[0]}
          grep -Ei '(^e:|^w:|warning:|deprecated|deprecation)' /tmp/ad-gradle-unit.log \
            | grep -vE '/third_party/|/myvu-upstream/' \
            | tail -600 > build/ci/gradle-owned-warnings.txt || true
          if [ "$status" -ne 0 ]; then
            grep -Ei '(^e:|^w:|FAILURE:|What went wrong:|Could not |deprecated|deprecation|error:|Unresolved reference|Compilation error|Caused by:|> .* FAILED$|tests completed)' /tmp/ad-gradle-unit.log \
              | tail -500 > build/ci/gradle-unit-summary.txt || true
            echo "::group::Compact Gradle failure summary"
            cat build/ci/gradle-unit-summary.txt || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-unit-diagnostics
          path: |
            android/AD-Glasses/build/ci/gradle-unit-summary.txt
            android/AD-Glasses/build/ci/gradle-owned-warnings.txt
            android/AD-Glasses/app/build/test-results/testDebugUnitTest/**/*.xml
            android/AD-Glasses/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 2

      - name: Assemble AD Glasses debug APK
        working-directory: android/AD-Glasses
        shell: bash
        run: |
          set +e
          mkdir -p build/ci
          ./gradlew --no-daemon --warning-mode=all :app:assembleDebug --stacktrace 2>&1 | tee /tmp/ad-gradle-assemble.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -Ei '(^e:|^w:|FAILURE:|What went wrong:|Could not |deprecated|deprecation|error:|Unresolved reference|Compilation error|Caused by:)' /tmp/ad-gradle-assemble.log \
              | tail -400 > build/ci/gradle-assemble-summary.txt || true
            echo "::group::Compact Gradle failure summary"
            cat build/ci/gradle-assemble-summary.txt || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload assemble failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-assemble-failure-summary
          path: android/AD-Glasses/build/ci/gradle-assemble-summary.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Verify branded APK output
        run: test -f android/AD-Glasses/app/build/outputs/apk/debug/AD-Glasses.apk

      - name: Upload AD Glasses APK
        uses: actions/upload-artifact@v7
        with:
          name: AD-Glasses-debug
          path: android/AD-Glasses/app/build/outputs/apk/debug/AD-Glasses.apk
          if-no-files-found: error
          retention-days: 7
