name: Android app

on:
  push:
    branches:
      - fix/app-kotlin-forward-ai-cleanup
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/app-kotlin-forward-ai-cleanup
          fetch-depth: 0
          submodules: false

      - name: Migrate remaining AI call sites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android/AD-Glasses/app/src/main/java/com/ad_glasses')

          def rewrite(path: Path, replacements: list[tuple[str, str]]) -> None:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old[:90]!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          rewrite(
              root / 'ai/live/GeminiLiveActivity.kt',
              [('ImageQuestionRoute.PRO_RELAY', 'ImageQuestionRoute.CLOUD_API')],
          )

          rewrite(
              root / 'ai/summarization/AiSummarizationService.kt',
              [
                  ('import com.ad_glasses.ai.router.CliRelayClient', 'import com.ad_glasses.ai.router.AiAssistantRouter'),
                  (' * via CliRelayClient based on user preferences.', ' * through the selected AD Glasses Cloud API or Local AI route.'),
                  ('''        val response = CliRelayClient.chat(\n            context = context,\n            chatId = "ai-summarization",\n            prompt = prompt,\n            messages = listOf(mapOf("role" to "user", "content" to prompt)),\n        ).getOrDefault("")\n''', '''        val response = AiAssistantRouter.textReply(context, prompt)\n'''),
              ],
          )

          rewrite(
              root / 'ai/transcription/MoonshotTranscriptionProvider.kt',
              [
                  ('import com.ad_glasses.BuildConfig\n', ''),
                  ('''        val apiKey = TranscriptionEndpointPrefs.getApiKey(context)\n            ?.trim()\n            ?.takeIf { it.isNotBlank() }\n            ?: BuildConfig.OPENAI_API_KEY.trim()\n''', '''        val apiKey = TranscriptionEndpointPrefs.getApiKey(context)\n            ?.trim()\n            .orEmpty()\n'''),
              ],
          )

          rewrite(
              root / 'localagent/LocalAgentBrain.kt',
              [
                  ('AgentInferenceRouter.isRemotePlanner(context)', 'AgentInferenceRouter.isRemotePlanner(LocalAgentPrefs.getProviderType(context))'),
              ],
          )

          daily = root / 'localagent/dailysummary/DailySummaryGenerator.kt'
          text = daily.read_text(encoding='utf-8')
          for old, new in [
              ('import com.ad_glasses.agent.CloudAiPrefs\n', ''),
              ('import com.ad_glasses.ai.router.CliRelayClient\n', 'import com.ad_glasses.ai.router.ApiTokenClient\n'),
              ('            AgentProviderType.CLOUD_AI -> runRelay(context, prompt)', '            AgentProviderType.CLOUD_AI -> runCloudApi(context, prompt)'),
              ('if (s.startsWith("Relay unavailable (", ignoreCase = true)) return false', 'if (s.startsWith("Cloud AI unavailable (", ignoreCase = true)) return false'),
              ('            msg.contains("relay unavailable") ||', '            msg.contains("cloud ai unavailable") ||'),
          ]:
              if old not in text:
                  raise SystemExit(f'Missing expected DailySummary text: {old!r}')
              text = text.replace(old, new)

          start = '    private suspend fun runRelay(context: Context, prompt: String): ProviderResponse {'
          end = '    private suspend fun runLocalModels(context: Context, prompt: String): ProviderResponse {'
          i = text.find(start)
          j = text.find(end, i)
          if i < 0 or j < 0:
              raise SystemExit('Could not locate legacy daily-summary relay block')
          cloud_block = '''    private suspend fun runCloudApi(context: Context, prompt: String): ProviderResponse {\n        val inputTokens = DailySummaryRunHistory.estimateTokenCount(prompt)\n        val started = System.currentTimeMillis()\n        val reply = ApiTokenClient.chat(\n            context = context,\n            messages = listOf(mapOf("role" to "user", "content" to prompt)),\n            maxTokens = 1200,\n        ).getOrElse { err ->\n            throw IllegalStateException("Cloud AI unavailable (${err.message}).", err)\n        }.trim()\n        val totalMs = (System.currentTimeMillis() - started).coerceAtLeast(1L)\n\n        if (!isUsableSummaryReply(reply)) {\n            throw IllegalStateException("Unable to generate daily summary from active cloud provider.")\n        }\n\n        val outputTokens = DailySummaryRunHistory.estimateTokenCount(reply)\n        val promptMs = (totalMs * 0.35).toLong().coerceAtLeast(1L)\n        val generationMs = (totalMs - promptMs).coerceAtLeast(1L)\n        return ProviderResponse(\n            text = reply,\n            metrics = DailySummaryRunHistory.RunMetrics(\n                provider = "cloud_api",\n                inputTokens = inputTokens,\n                outputTokens = outputTokens,\n                promptTokensPerSec = inputTokens / (promptMs / 1000.0),\n                generationTokensPerSec = outputTokens / (generationMs / 1000.0),\n                totalMs = totalMs,\n            ),\n        )\n    }\n\n'''
          text = text[:i] + cloud_block + text[j:]
          daily.write_text(text, encoding='utf-8')

          # Compiler-focused forward audit: none of the deleted relay/config symbols may remain in these call sites.
          audited = [
              root / 'ai/live/GeminiLiveActivity.kt',
              root / 'ai/summarization/AiSummarizationService.kt',
              root / 'ai/transcription/MoonshotTranscriptionProvider.kt',
              root / 'localagent/LocalAgentBrain.kt',
              daily,
          ]
          forbidden = ['CliRelayClient', 'CloudAiPrefs', 'ImageQuestionRoute.PRO_RELAY', 'BuildConfig.OPENAI_API_KEY']
          violations = []
          for path in audited:
              current = path.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in current:
                      violations.append(f'{path}: {token}')
          if violations:
              raise SystemExit('Retired AI symbols remain:\n' + '\n'.join(violations))
          PY

          git diff --check
          git diff --stat

      - name: Commit forward migrations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- android/AD-Glasses/app/src/main/java/com/ad_glasses/ai/live/GeminiLiveActivity.kt \
            android/AD-Glasses/app/src/main/java/com/ad_glasses/ai/summarization/AiSummarizationService.kt \
            android/AD-Glasses/app/src/main/java/com/ad_glasses/ai/transcription/MoonshotTranscriptionProvider.kt \
            android/AD-Glasses/app/src/main/java/com/ad_glasses/localagent/LocalAgentBrain.kt \
            android/AD-Glasses/app/src/main/java/com/ad_glasses/localagent/dailysummary/DailySummaryGenerator.kt
          git diff --cached --check
          git commit -m 'fix: migrate remaining app AI call sites'
          git push origin HEAD:fix/app-kotlin-forward-ai-cleanup
