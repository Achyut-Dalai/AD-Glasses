name: Android app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-app.yml
      - android/CyanBridge/**
      - heycyan-core/**
      - third_party/moonshine/**
  push:
    branches:
      - main
      - "agent/**"
      - "ui/**"
      - "codex/**"
      - "fix/**"
    paths:
      - .github/workflows/android-app.yml
      - android/CyanBridge/**
      - heycyan-core/**
      - third_party/moonshine/**
      - tools/post_cleanup_repair.py

permissions:
  contents: write
  packages: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test AD Glasses
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Materialize submodule LFS files
        shell: bash
        run: |
          git lfs install --local
          git submodule foreach --recursive 'git lfs install --local && git lfs pull'

      - name: Apply one-shot post-cleanup repair
        if: github.ref == 'refs/heads/fix/post-cleanup-build'
        run: python3 tools/post_cleanup_repair.py

      - name: Validate repair diff and audit legacy terms
        if: github.ref == 'refs/heads/fix/post-cleanup-build'
        shell: bash
        run: |
          git diff --check
          git status --short
          echo '== forbidden legacy identifiers =='
          git grep -nEi 'PRO_SUBSCRIPTION|pro_subscription|PRO_RELAY|CliRelayClient|CloudAiPrefs|GlassesAssistantMode|PHONE_ASSISTANT|OpenExternalImageAutomationDiagnostics|SelectAssistantMode|usesExternalAssistantUi|usesExternalImageAutomation|ExternalAssistantAutomation|ExternalImageAutomation|phone assistant|Pro endpoint' -- \
            'android/CyanBridge/app/src/**' \
            'android/CyanBridge/shared/src/**' \
            ':!**/build/**' || true
          echo '== broad subscription references =='
          git grep -nEi 'subscription' -- \
            'android/CyanBridge/app/src/**' \
            'android/CyanBridge/shared/src/**' \
            ':!**/build/**' || true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/CyanBridge/**/*.gradle*
            android/CyanBridge/gradle/libs.versions.toml
            heycyan-core/**/*.gradle*

      - name: Install current Android CLI
        shell: bash
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo tee /etc/apt/keyrings/google.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] http://dl.google.com/android/cli/latest/debian/ stable main" \
            | sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y android-cli
          android update
          android --version

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          android --sdk="$SDK_ROOT" sdk install \
            platforms/android-37 \
            build-tools/36.0.0 \
            cmake/3.22.1 \
            ndk/29.0.14206865 \
            platform-tools
          android --sdk="$SDK_ROOT" sdk list '^(platforms/android-37|build-tools/36\.0\.0|cmake/3\.22\.1|ndk/29\.0\.14206865|platform-tools)$' --all-versions

      - name: Compile shared Android source
        working-directory: android/CyanBridge
        shell: bash
        run: ./gradlew --no-daemon --warning-mode=all :shared:compileAndroidMain --stacktrace

      - name: Run app unit tests
        working-directory: android/CyanBridge
        shell: bash
        run: |
          set +e
          mkdir -p build/ci
          ./gradlew --no-daemon --warning-mode=all :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/ad-gradle-unit.log
          status=${PIPESTATUS[0]}
          grep -Ei '(^e:|^w:|warning:|deprecated|deprecation)' /tmp/ad-gradle-unit.log \
            | grep -vE '/third_party/|/myvu-upstream/' \
            | tail -600 > build/ci/gradle-owned-warnings.txt || true
          if [ "$status" -ne 0 ]; then
            grep -Ei '(^e:|^w:|FAILURE:|What went wrong:|Could not |deprecated|deprecation|error:|Unresolved reference|Compilation error|Caused by:|> .* FAILED$|tests completed)' /tmp/ad-gradle-unit.log \
              | tail -500 > build/ci/gradle-unit-summary.txt || true
            echo "::group::Compact Gradle failure summary"
            cat build/ci/gradle-unit-summary.txt || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-unit-diagnostics
          path: |
            android/CyanBridge/build/ci/gradle-unit-summary.txt
            android/CyanBridge/build/ci/gradle-owned-warnings.txt
            android/CyanBridge/app/build/test-results/testDebugUnitTest/**/*.xml
            android/CyanBridge/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 2

      - name: Assemble AD Glasses debug APK
        working-directory: android/CyanBridge
        shell: bash
        run: |
          set +e
          mkdir -p build/ci
          ./gradlew --no-daemon --warning-mode=all :app:assembleDebug --stacktrace 2>&1 | tee /tmp/ad-gradle-assemble.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -Ei '(^e:|^w:|FAILURE:|What went wrong:|Could not |deprecated|deprecation|error:|Unresolved reference|Compilation error|Caused by:)' /tmp/ad-gradle-assemble.log \
              | tail -400 > build/ci/gradle-assemble-summary.txt || true
            echo "::group::Compact Gradle failure summary"
            cat build/ci/gradle-assemble-summary.txt || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload assemble failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-assemble-failure-summary
          path: android/CyanBridge/build/ci/gradle-assemble-summary.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Verify branded APK output
        run: test -f android/CyanBridge/app/build/outputs/apk/debug/AD-Glasses.apk

      - name: Enforce post-cleanup architecture gate
        if: github.ref == 'refs/heads/fix/post-cleanup-build'
        shell: bash
        run: |
          if git grep -nEi 'PRO_SUBSCRIPTION|pro_subscription|PRO_RELAY|CliRelayClient|CloudAiPrefs|GlassesAssistantMode|PHONE_ASSISTANT|OpenExternalImageAutomationDiagnostics|SelectAssistantMode|usesExternalAssistantUi|usesExternalImageAutomation|ExternalAssistantAutomation|ExternalImageAutomation|phone assistant|Pro endpoint' -- \
            'android/CyanBridge/app/src/**' \
            'android/CyanBridge/shared/src/**' \
            ':!**/build/**'; then
            echo 'Legacy subscription/consumer-assistant identifiers remain.' >&2
            exit 1
          fi

      - name: Commit repaired source and remove harness
        if: github.ref == 'refs/heads/fix/post-cleanup-build'
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/android-app.yml
          rm -f tools/post_cleanup_repair.py .github/workflows/post-cleanup-repair.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete AI architecture cleanup and restore build'
          git push origin HEAD:fix/post-cleanup-build

      - name: Upload AD Glasses APK
        uses: actions/upload-artifact@v7
        with:
          name: AD-Glasses-debug
          path: android/CyanBridge/app/build/outputs/apk/debug/AD-Glasses.apk
          if-no-files-found: error
          retention-days: 7
