name: Native iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-native.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-native.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native SwiftUI app
        run: |
          xcodebuild \
            -project ios/ADGlasses.xcodeproj \
            -scheme ADGlasses \
            -sdk iphonesimulator \
            -configuration "Debug Personal" \
            CODE_SIGNING_ALLOWED=NO \
            build
