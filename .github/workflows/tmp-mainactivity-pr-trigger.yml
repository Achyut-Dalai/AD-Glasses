name: Temporary MainActivity PR trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/mainactivity-full-audit
          fetch-depth: 0

      - name: Execute audited repair body
        shell: bash
        run: |
          python3 - <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-mainactivity-full-audit.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(textwrap.dedent(body), {})
          BOOT
          git diff --check
          git diff --stat

      - name: Commit audited source
        shell: bash
        run: |
          if git diff --quiet -- android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt
          git commit -m "fix: harden MainActivity assistant lifecycle"
          git push origin HEAD:fix/mainactivity-full-audit
