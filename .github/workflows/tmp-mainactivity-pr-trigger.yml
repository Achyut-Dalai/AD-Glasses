name: Temporary MainActivity PR trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/mainactivity-full-audit
          fetch-depth: 0

      - name: Apply final audited source repair
        shell: bash
        run: |
          python3 tools/tmp_mainactivity_audit_phase3.py
          git diff --check
          git diff --stat

      - name: Commit audited source
        shell: bash
        run: |
          if git diff --quiet -- android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt
          git commit -m "fix: finalize MainActivity voice lifecycle"
          git push origin HEAD:fix/mainactivity-full-audit
