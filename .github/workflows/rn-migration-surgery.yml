name: RN migration surgery

on:
  push:
    branches:
      - codex/build-runtime-fixes
    paths:
      - .github/workflows/rn-migration-surgery.yml

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/build-runtime-fixes
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/CyanBridge/package-lock.json

      - uses: gradle/actions/setup-gradle@v3

      - name: Detach legacy Compose product presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def remove_braced_call(text: str, marker: str) -> str:
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Could not find braced marker: {marker!r}')
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f'Could not find opening brace after: {marker!r}')
              depth = 0
              i = brace
              while i < len(text):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          if end < len(text) and text[end] == '\n':
                              end += 1
                          return text[:start] + text[end:]
                  i += 1
              raise SystemExit(f'Unbalanced braces after: {marker!r}')

          main = Path('android/CyanBridge/app/src/main/java/com/fersaiyan/cyanbridge/MainActivity.kt')
          text = main.read_text()
          for line in [
              'import androidx.activity.compose.setContent\n',
              'import androidx.compose.runtime.getValue\n',
              'import androidx.compose.runtime.mutableStateOf\n',
              'import androidx.compose.runtime.setValue\n',
              'import com.fersaiyan.cyanbridge.ui.adglasses.ADAutomation\n',
              'import com.fersaiyan.cyanbridge.ui.adglasses.ADGlassesApp\n',
              'import com.fersaiyan.cyanbridge.ui.adglasses.ADHostActions\n',
          ]:
              if text.count(line) != 1:
                  raise SystemExit(f'{main}: expected exactly one {line.strip()!r}')
              text = text.replace(line, '')

          old_state = '''    // Keeps the existing Android control handlers alive while Compose owns the visible tree.\n    private lateinit var binding: AcitivytMainBinding\n    private var dashboardState by mutableStateOf(\n        GlassesDashboardUiState(\n            wifiAdbDebug = WifiAdbDebugUiState(isAvailable = BuildConfig.DEBUG),\n        ),\n    )\n    private var showDownloadFlowPicker by mutableStateOf(false)\n'''
          new_state = '''    // Hidden native runtime. React Native owns the visible product tree while this Activity\n    // preserves the proven glasses transport, hardware callbacks, sync and OTA lifecycle.\n    private lateinit var binding: AcitivytMainBinding\n    private var dashboardState = GlassesDashboardUiState(\n        wifiAdbDebug = WifiAdbDebugUiState(isAvailable = BuildConfig.DEBUG),\n    )\n'''
          if text.count(old_state) != 1:
              raise SystemExit('MainActivity dashboard-state anchor changed')
          text = text.replace(old_state, new_state)
          text = remove_braced_call(text, '        setContent {')
          text = remove_braced_call(text, '    private fun openAutomationSettings(automation: ADAutomation) {')

          old_picker = '''    private fun showDownloadFlowPicker() {\n        showDownloadFlowPicker = true\n    }\n'''
          new_picker = '''    private fun showDownloadFlowPicker() {\n        // Legacy hidden control path: use the same proven resolver that RN Sync invokes.\n        startDataDownload(mode = GlassesSyncFlow.CUSTOM)\n    }\n'''
          if text.count(old_picker) != 1:
              raise SystemExit('MainActivity download-flow anchor changed')
          text = text.replace(old_picker, new_picker)
          text = text.replace(
              '        // Hide the view-based bottom navigation; the shared CMP nav shell owns it now.\n',
              '        // Keep the view-based controls hidden; React Native owns all visible product UI.\n',
          )
          text = text.replace(
              '                // The Compose shell has no legacy flow-picker host. Start the proven\n',
              '                // The React Native shell has no legacy flow-picker host. Start the proven\n',
          )
          main.write_text(text)

          prompt = Path('android/CyanBridge/src/screens/MainScreens.tsx')
          text = prompt.read_text()
          old = "  const [value, setValue] = useState('');"
          new = "  const [value, setValue] = useState(() => typeof route?.params?.prefill === 'string' ? route.params.prefill : '');"
          if text.count(old) != 1:
              raise SystemExit('Prompt prefill anchor changed')
          prompt.write_text(text.replace(old, new))

          legacy_dir = Path('android/CyanBridge/app/src/main/java/com/fersaiyan/cyanbridge/ui/adglasses')
          removed = []
          for path in sorted(legacy_dir.glob('*.kt')):
              if path.name == 'ADLegacyRouteRedirectActivity.kt':
                  continue
              path.unlink()
              removed.append(path.name)
          if not removed:
              raise SystemExit('Expected obsolete adglasses presentation files to remove')
          print('Removed obsolete product presentation:', ', '.join(removed))
          PY

      - name: Install React Native dependencies
        working-directory: android/CyanBridge
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify React Native source
        working-directory: android/CyanBridge
        run: |
          npm run typecheck
          npm run lint

      - name: Compile and assemble migrated Android app
        working-directory: android/CyanBridge
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit compile-tested presentation removal
        run: |
          git config user.name "Achyut-Dalai"
          git config user.email "79808239+Achyut-Dalai@users.noreply.github.com"
          git add android/CyanBridge/app/src/main/java/com/fersaiyan/cyanbridge/MainActivity.kt \
                  android/CyanBridge/app/src/main/java/com/fersaiyan/cyanbridge/ui/adglasses \
                  android/CyanBridge/src/screens/MainScreens.tsx
          if git diff --cached --quiet; then
            echo "No migration source changes to commit"
            exit 0
          fi
          git commit -m "refactor(android): detach legacy Compose product shell"
          git push origin HEAD:codex/build-runtime-fixes
