name: Temporary duplicate import cleanup

on:
  push:
    branches:
      - fix/mainactivity-full-audit

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/mainactivity-full-audit
          fetch-depth: 0

      - name: Remove duplicate import
        shell: bash
        run: |
          python3 tools/tmp_remove_duplicate_import.py
          git diff --check

      - name: Commit source cleanup
        shell: bash
        run: |
          if git diff --quiet -- android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/AD-Glasses/app/src/main/java/com/ad_glasses/MainActivity.kt
          git commit -m "fix: remove duplicate MainActivity import"
          git push origin HEAD:fix/mainactivity-full-audit
