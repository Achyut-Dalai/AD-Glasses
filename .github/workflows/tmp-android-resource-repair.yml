name: Temporary Android resource repair

on:
  push:
    branches:
      - fix/android-resource-repair
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: read

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/android-resource-repair
          fetch-depth: 0
          submodules: false

      - name: Remove retired assistant-mode UI and validate resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path('android/AD-Glasses')
          res = project / 'app/src/main/res'
          screen = project / 'shared/src/commonMain/kotlin/com/ad_glasses/shared/ui/glasses/GlassesDashboardScreen.kt'
          strings = project / 'shared/src/commonMain/composeResources/values/strings_extra.xml'

          text = screen.read_text(encoding='utf-8')
          text = text.replace('import com.ad_glasses.shared.glasses.GlassesAssistantMode\n', '')

          assistant_mode_row = '''        Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
              AssistantModeChip(
                  label = stringResource(Res.string.dashboard_phone_assistant),
                  mode = GlassesAssistantMode.PHONE_ASSISTANT,
                  selectedMode = state.assistantMode,
                  onAction = onAction,
                  modifier = Modifier.weight(1f),
              )
              AssistantModeChip(
                  label = stringResource(Res.string.dashboard_custom_provider),
                  mode = GlassesAssistantMode.CUSTOM_AI_PROVIDER,
                  selectedMode = state.assistantMode,
                  onAction = onAction,
                  modifier = Modifier.weight(1f),
              )
          }
'''
          assistant_mode_row = assistant_mode_row.replace('              ', '            ').replace('          }\n', '        }\n')
          text = text.replace(assistant_mode_row, '')

          diagnostics_button = '''        OutlinedButton(
              onClick = { onAction(GlassesDashboardAction.OpenExternalImageAutomationDiagnostics) },
              modifier = Modifier.fillMaxWidth(),
          ) {
              Text(stringResource(Res.string.dashboard_gemini_chatgpt_setup))
          }
'''
          diagnostics_button = diagnostics_button.replace('              ', '            ').replace('          ) {\n', '        ) {\n').replace('          }\n', '        }\n')
          text = text.replace(diagnostics_button, '')

          helper = '''@Composable
private fun AssistantModeChip(
    label: String,
    mode: GlassesAssistantMode,
    selectedMode: GlassesAssistantMode,
    onAction: (GlassesDashboardAction) -> Unit,
    modifier: Modifier,
) {
    FilterChip(
        selected = selectedMode == mode,
        onClick = { onAction(GlassesDashboardAction.SelectAssistantMode(mode)) },
        label = { Text(label) },
        modifier = modifier,
    )
}

'''
          text = text.replace(helper, '')

          forbidden = (
              'GlassesAssistantMode',
              'assistantMode',
              'OpenExternalImageAutomationDiagnostics',
              'SelectAssistantMode',
              'dashboard_gemini_chatgpt_setup',
              'dashboard_phone_assistant',
              'dashboard_custom_provider',
          )
          remaining = [token for token in forbidden if token in text]
          if remaining:
              raise SystemExit('Retired assistant-mode UI remains: ' + ', '.join(remaining))
          screen.write_text(text, encoding='utf-8')

          string_text = strings.read_text(encoding='utf-8')
          for name in (
              'dashboard_phone_assistant',
              'dashboard_custom_provider',
              'dashboard_gemini_chatgpt_setup',
          ):
              string_text, count = re.subn(
                  rf'^\s*<string name="{re.escape(name)}">.*?</string>\n?',
                  '',
                  string_text,
                  count=1,
                  flags=re.MULTILINE,
              )
          strings.write_text(string_text, encoding='utf-8')

          bad_names = []
          name_re = re.compile(r'\bname="([^"]+)"')
          for p in res.glob('values*/*.xml'):
              source = p.read_text(encoding='utf-8')
              for match in name_re.finditer(source):
                  name = match.group(1)
                  if any(ch.isspace() for ch in name):
                      bad_names.append(f'{p}: {name!r}')
          if bad_names:
              raise SystemExit('Invalid Android resource names remain:\n' + '\n'.join(bad_names))

          bad_files = []
          for folder in res.iterdir():
              if not folder.is_dir() or folder.name.startswith('values'):
                  continue
              for p in folder.iterdir():
                  if not p.is_file() or p.name.startswith('.'):
                      continue
                  stem = p.name[:-6] if p.name.endswith('.9.png') else p.stem
                  if not re.fullmatch(r'[a-z0-9_]+', stem):
                      bad_files.append(str(p))
          if bad_files:
              raise SystemExit('Invalid file-based Android resource names remain:\n' + '\n'.join(bad_files))
          PY

          git diff --check
          git status --short

      - name: Commit forward-only source repair
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- android/AD-Glasses
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove retired assistant-mode dashboard UI'
            git push origin HEAD:fix/android-resource-repair
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble debug APK
        working-directory: android/AD-Glasses
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug --stacktrace
