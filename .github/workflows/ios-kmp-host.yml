name: iOS KMP host

on:
  workflow_dispatch:
  push:
    branches:
      - compose-material3-kmp-v2
      - main
    paths:
      - .github/workflows/ios-kmp-host.yml
      - android/CyanBridge/shared/**
      - android/CyanBridge/settings.gradle.kts
      - android/CyanBridge/build.gradle.kts
      - android/CyanBridge/gradle/**
      - android/CyanBridge/gradle.properties
      - ios/CyanBridgeKMPHost/**
      - ios/CyanBridgeKMPHostTests/**
      - ios/QCSDKDemo.xcodeproj/**
      - ios/scripts/verify_kmp_host.py

permissions:
  contents: read

concurrency:
  group: ios-kmp-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator-host:
    name: Build KMP framework and iOS simulator host
    runs-on: macos-14
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/CyanBridge/**/*.gradle*

      - name: Verify the isolated iOS host structure
        run: python3 ios/scripts/verify_kmp_host.py

      - name: Run portable shared tests
        working-directory: android/CyanBridge
        run: ./gradlew --no-daemon :shared:portabilityTest

      - name: Link the Apple-Silicon simulator framework
        working-directory: android/CyanBridge
        run: ./gradlew --no-daemon -PenableAppleTargets=true :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build the unsigned SwiftUI simulator host
        run: >-
          xcodebuild
          -project ios/QCSDKDemo.xcodeproj
          -scheme CyanBridgeKMPHost
          -configuration Debug
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2'
          -derivedDataPath "$RUNNER_TEMP/CyanBridgeDerivedData"
          CODE_SIGNING_ALLOWED=NO
          ENABLE_USER_SCRIPT_SANDBOXING=NO
          build

      - name: Run KMP host unit tests
        run: >-
          xcodebuild
          -project ios/QCSDKDemo.xcodeproj
          -scheme CyanBridgeKMPHost
          -configuration Debug
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2'
          -derivedDataPath "$RUNNER_TEMP/CyanBridgeDerivedData"
          CODE_SIGNING_ALLOWED=NO
          ENABLE_USER_SCRIPT_SANDBOXING=NO
          test

      - name: Launch the simulator host smoke test
        run: |
          DEVICE_UDID="$(xcrun simctl create CyanBridgeCI com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-2)"
          trap 'xcrun simctl delete "$DEVICE_UDID"' EXIT
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$RUNNER_TEMP/CyanBridgeDerivedData/Build/Products/Debug-iphonesimulator/CyanBridgeKMPHost.app"
          xcrun simctl launch "$DEVICE_UDID" com.fersaiyan.CyanBridgeKMPHost
          sleep 3
          xcrun simctl io "$DEVICE_UDID" screenshot "$RUNNER_TEMP/CyanBridgeKMPHost.png"

      - name: Upload Xcode build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-kmp-host-build-logs
          path: |
            ${{ runner.temp }}/CyanBridgeDerivedData/Logs
            ${{ runner.temp }}/CyanBridgeKMPHost.png
          if-no-files-found: warn
          retention-days: 7
