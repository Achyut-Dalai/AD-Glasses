# AD Glasses phone wake word — LiveKit WakeWord
# Assistant name / wake phrase: "Jarvis"
# Pronounced naturally as two syllables: "JAR-vis".
#
# This is the production replacement for the previous Hey A D classifier.
# The project is pinned to LiveKit WakeWord commit
# 95448a7559c453fcd87645bd67b247ffb45f85b0.

model_name: jarvis

target_phrases:
  - "jarvis"

# Production-scale synthetic positives/negatives.
n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500

# LiveKit's upstream prod config suggests 50 for ~8 GB GPU, but this project
# previously encountered stability/resource issues at 50. Keep the safer 25
# for an unattended overnight run; it trades throughput for headroom.
tts_batch_size: 25

# Hard negatives should be genuinely non-target phrases. Do not include phrases
# that contain "jarvis" itself, or training can suppress natural utterances such
# as "Jarvis, ..." after the detector window captures following speech.
custom_negative_phrases:
  - "jar"
  - "jars"
  - "jarred"
  - "jervis"
  - "travis"
  - "harvest"
  - "marvis"
  - "service"
  - "nervous"
  - "jasmine"
  - "garbage"
  - "justice"

noise_scales: [0.98]
noise_scale_ws: [0.98]
length_scales: [0.75, 1.0, 1.25]
slerp_weights: [0.2, 0.35, 0.5, 0.65, 0.8]

data_dir: ./data
output_dir: ./output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [./data/backgrounds]
  rir_paths: [./data/rirs]

model:
  model_type: conv_attention
  model_size: medium

# LiveKit trains three phases: 100k + 10k + 10k optimizer steps.
steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 3000

target_fp_per_hour: 0.1

batch_n_per_class:
  positive: 50
  adversarial_negative: 50
  ACAV100M_sample: 1024
  background_noise: 50
